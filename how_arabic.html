<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بيت الحكمة — Arabic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a2e;--ink2:#2e2e44;--ink3:#5a5a78;--ink4:#9a9ab0;
  --gold:#d4af37;--gl:#e8cc70;--gp:#fdf8e8;
  --teal:#1d6f6f;--tl:#d0eaea;--tld:#0e4040;
  --blue:#1a3d6e;--bll:#dde8f5;
  --plum:#3d1f6e;--pll:#ede0f8;
  --coral:#c0522a;--cll:#fbeee8;
  --p:#f9f7f4;--p2:#f0ece4;--p3:#e4ddd0;--border:#d4c9b8;
  --r:10px;--shadow:0 2px 8px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:var(--p);color:var(--ink);min-height:100vh}
.hidden{display:none!important}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:100}
.top-bar-title{font-family:"Amiri",serif;font-size:1.2rem;letter-spacing:.02em}
.top-bar-title span{color:var(--gold)}
.top-bar-right{display:flex;gap:10px;align-items:center}
.nav-btn{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:5px 12px;font-size:.8rem;cursor:pointer;font-family:"DM Sans",sans-serif;transition:.15s}
.nav-btn:hover{background:rgba(255,255,255,.1)}
.screen{max-width:680px;margin:0 auto;padding:24px 16px 60px}
.sel-header{text-align:center;padding:32px 0 24px}
.sel-header h1{font-family:"Spectral",serif;font-size:2rem;color:var(--ink)}
.sel-header p{color:var(--ink3);margin-top:6px;font-size:.95rem}
.sel-arabic{font-family:"Amiri",serif;font-size:1.4rem;color:var(--gold);display:block;margin-top:4px}
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.student-card{background:#fff;border:2px solid var(--border);border-radius:var(--r);padding:16px 12px;text-align:center;cursor:pointer;transition:.15s;position:relative}
.student-card.edit-mode{border-color:var(--coral);cursor:default}
.del-btn{display:none;position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;border:2px solid #fff;font-size:1rem;line-height:1;cursor:pointer;align-items:center;justify-content:center;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.edit-mode .del-btn{display:flex}
.edit-toggle{background:none;border:1.5px solid var(--border);border-radius:6px;padding:4px 12px;font-size:.78rem;color:var(--ink3);cursor:pointer;margin-left:auto;display:block}
.edit-toggle.active{border-color:var(--coral);color:var(--coral)}
.sel-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.student-card:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.student-avatar{width:48px;height:48px;border-radius:50%;background:var(--p2);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.student-name{font-weight:600;font-size:.95rem;color:var(--ink)}
.student-meta{font-size:.78rem;color:var(--ink3);margin-top:3px}
.mode-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600;margin-top:5px;text-transform:uppercase;letter-spacing:.04em}
.mode-j{background:var(--cll);color:var(--coral)}
.mode-m{background:var(--bll);color:var(--blue)}
.mode-s{background:var(--tl);color:var(--teal)}
.add-form{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:20px}
.add-form h3{font-size:1rem;margin-bottom:14px;color:var(--ink)}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:.82rem;color:var(--ink3);margin-bottom:4px;font-weight:500}
.form-row input,.form-row select{width:100%;border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:.95rem;font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--p);outline:none;transition:.15s}
.form-row input:focus,.form-row select:focus{border-color:var(--teal);background:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;border:none;transition:.15s;font-family:"DM Sans",sans-serif}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--tld)}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:var(--gl)}
.btn-outline{background:none;border:1px solid var(--border);color:var(--ink3)}
.btn-outline:hover{border-color:var(--ink3);color:var(--ink)}
.btn-sm{padding:6px 14px;font-size:.82rem}
.dash-hero{background:var(--ink);color:#fff;border-radius:14px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.dash-hero::before{content:"";position:absolute;top:-20px;right:-20px;width:120px;height:120px;background:var(--gold);opacity:.08;border-radius:50%}
.dash-student-name{font-family:"Spectral",serif;font-size:1.5rem;font-weight:600}
.dash-level{color:rgba(255,255,255,.65);font-size:.88rem;margin-top:3px}
.dash-level strong{color:var(--gold)}
.progress-bar-wrap{margin-top:16px}
.progress-bar-label{display:flex;justify-content:space-between;font-size:.8rem;color:rgba(255,255,255,.6);margin-bottom:6px}
.progress-bar-track{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .4s ease}
.dash-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center}
.stat-val{font-family:"Spectral",serif;font-size:1.6rem;font-weight:600;color:var(--ink)}
.stat-label{font-size:.75rem;color:var(--ink3);margin-top:2px}
.week-strip-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:20px}
.week-strip-title{font-size:.82rem;font-weight:600;color:var(--ink3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.week-strip{display:flex;gap:5px;flex-wrap:wrap}
.week-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--p2);cursor:pointer;font-size:.72rem;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--ink3);transition:.15s}
.week-dot:hover{border-color:var(--teal);color:var(--teal)}
.week-dot.done{background:var(--teal);border-color:var(--teal);color:#fff}
.week-dot.current{background:var(--gold);border-color:var(--gold);color:var(--ink);box-shadow:0 0 0 3px rgba(212,175,55,.3)}
.week-dot.partial{background:var(--gp);border-color:var(--gold);color:var(--ink)}
.week-dot.locked{background:none;border:none;opacity:.3;cursor:default;padding:0;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem}
.dash-section-title{font-size:.85rem;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.session-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.session-bar{height:4px}
.session-head{padding:16px 18px 12px;border-bottom:1px solid var(--p3)}
.session-labels{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.lv-badge{padding:2px 10px;background:var(--p2);border-radius:20px;font-size:.72rem;font-weight:600;color:var(--ink3)}
.wk-badge{font-size:.72rem;color:var(--ink4)}
.ses-done-badge{font-size:.72rem;color:var(--teal);font-weight:600}
.session-title{font-family:"Amiri",serif;font-size:1.25rem;color:var(--ink)}
.session-title-en{font-size:.82rem;color:var(--ink3);margin-top:1px}
.session-body{padding:16px 18px}
.grammar-box{background:var(--tl);border:1px solid #9dd0d0;border-radius:8px;padding:12px 14px;margin-bottom:14px}
.grammar-ar{font-family:"Amiri",serif;font-size:1.1rem;color:var(--teal);direction:rtl;text-align:right}
.grammar-en{font-size:.85rem;font-weight:600;color:var(--teal);margin-top:2px}
.grammar-rule{font-family:"DM Mono",monospace;font-size:.8rem;color:var(--ink2);background:rgba(255,255,255,.6);border-radius:4px;padding:6px 8px;margin-top:8px;line-height:1.5}
.arabic-block{background:var(--gp);border-right:3px solid var(--gold);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.arabic-text{font-family:"Amiri",serif;font-size:1.6rem;line-height:2.1;direction:rtl;text-align:right;color:var(--ink)}
.translation-text{font-size:.85rem;color:var(--ink3);margin-top:8px;line-height:1.6;font-style:italic}
.translation-text.hidden-tr{display:none}
.reveal-tr-btn{font-size:.78rem;color:var(--teal);background:none;border:none;cursor:pointer;padding:2px 0;margin-top:4px;font-family:"DM Sans",sans-serif;text-decoration:underline}
.vocab-section{margin-bottom:14px}
.vocab-label{font-size:.78rem;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.vocab-table{width:100%;border-collapse:collapse;border:1px solid var(--p3);border-radius:6px;overflow:hidden}
.vocab-table tr:nth-child(even){background:var(--p2)}
.vocab-table tr:nth-child(odd){background:#fff}
.vocab-table td{padding:8px 12px;font-size:.9rem}
.vt-ar{font-family:"Amiri",serif;font-size:1.1rem;direction:rtl;text-align:right;color:var(--ink)}
.vt-em{text-align:center;width:30px}
.vt-en{color:var(--ink3);font-size:.85rem}
.speak-btn{background:none;border:none;cursor:pointer;padding:0 4px;color:var(--ink4);font-size:.85rem}
.speak-btn:hover{color:var(--teal)}
.activity-section{margin-bottom:14px}
.activity-label{font-size:.78rem;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.activity-label::after{content:"";flex:1;height:1px;background:var(--p3)}
.jr-wrap{background:var(--cll);border-radius:8px;padding:16px;text-align:center}
.jr-prompt{font-size:.88rem;color:var(--coral);font-weight:600;margin-bottom:10px}
.jr-word-btn{background:#fff;border:2px solid var(--coral);border-radius:10px;padding:14px 24px;cursor:pointer;margin-bottom:12px;display:inline-block;width:100%}
.jr-arabic-big{font-family:"Amiri",serif;font-size:2.4rem;color:var(--ink);direction:rtl;display:block;line-height:1.3}
.jr-listen-hint{font-size:.75rem;color:var(--ink3);display:block;margin-top:4px}
.jr-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.jr-choice{padding:12px 8px;border:2px solid var(--border);border-radius:10px;font-size:.9rem;font-weight:500;cursor:pointer;background:#fff;text-align:center;transition:.15s;font-family:"DM Sans",sans-serif}
.jr-choice:hover{border-color:var(--coral)}
.jr-choice.jr-correct{border-color:#2a7a2a!important;background:#eaf5ea!important;color:#2a7a2a!important}
.jr-choice.jr-wrong{border-color:#c0392b!important;background:#fdf5f5!important;color:#c0392b!important}
.jr-result{min-height:28px;font-size:.9rem;font-weight:600;margin-bottom:6px}
.jr-progress{font-size:.78rem;color:var(--ink3)}
.md-wrap{background:var(--bll);border-radius:8px;padding:14px}
.md-prompt{font-size:.88rem;color:var(--blue);font-weight:600;margin-bottom:10px}
.md-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.md-col-title{font-size:.75rem;font-weight:600;color:var(--ink3);margin-bottom:6px;text-align:center}
.md-item{display:block;width:100%;padding:9px 10px;border:2px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-family:"DM Sans",sans-serif;transition:.15s;margin-bottom:6px;text-align:center}
.md-ar{font-family:"Amiri",serif;font-size:1.1rem;direction:rtl}
.md-en{font-size:.85rem;color:var(--ink3)}
.md-item:hover{border-color:var(--blue)}
.md-item.md-sel{border-color:var(--blue);background:var(--bll);color:var(--blue)}
.md-item.md-matched{border-color:#2a7a2a;background:#eaf5ea;color:#2a7a2a;cursor:default}
.md-item.md-wrong{border-color:#c0392b;background:#fdf5f5;animation:shake .3s}
.md-score{text-align:center;font-size:.85rem;font-weight:600;color:var(--blue);margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.sr-wrap{background:#fff;border:1px solid var(--tl);border-radius:8px;padding:14px}
.sr-part{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--p3)}
.sr-part:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.sr-q-label{font-size:.8rem;font-weight:600;color:var(--teal);margin-bottom:6px}
.sr-q-arabic{font-family:"Amiri",serif;font-size:1.3rem;direction:rtl;text-align:right;color:var(--ink);background:var(--gp);border-radius:6px;padding:10px 12px;margin-bottom:6px;line-height:1.8}
.sr-input{width:100%;border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:.9rem;font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--p);resize:vertical;min-height:60px;outline:none;transition:.15s}
.sr-input:focus{border-color:var(--teal);background:#fff}
.sr-reveal{background:var(--tl);border-radius:6px;padding:10px 12px;font-size:.88rem;color:var(--ink2);margin-top:6px;line-height:1.6}
.sr-reveal-label{font-weight:600;color:var(--teal);font-size:.78rem;display:block;margin-bottom:3px}
.sr-reveal-btn{font-size:.78rem;color:var(--teal);background:none;border:1px solid var(--tl);border-radius:4px;cursor:pointer;padding:4px 10px;margin-top:6px;font-family:"DM Sans",sans-serif}
.session-footer{padding:12px 18px;background:var(--p);border-top:1px solid var(--p3);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.resource-links{display:flex;gap:12px}
.resource-links a{font-size:.78rem;color:var(--teal);text-decoration:none;font-weight:500}
.resource-links a:hover{text-decoration:underline}
.mark-btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;font-family:"DM Sans",sans-serif;background:var(--teal);color:#fff;transition:.15s}
.mark-btn:hover{background:var(--tld)}
.mark-btn.done{background:#2a7a2a;cursor:default}
.act-complete{text-align:center;padding:12px;color:#2a7a2a;font-weight:600;font-size:.9rem;background:#eaf5ea;border-radius:6px;margin-top:8px}
.week-banner{background:var(--gold);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:16px}
.week-banner h3{font-family:"Spectral",serif;font-size:1.3rem;color:var(--ink)}
.week-banner p{font-size:.88rem;color:rgba(26,26,46,.75);margin-top:4px}
.report-header{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;text-align:center}
.report-name{font-family:"Spectral",serif;font-size:1.4rem;color:var(--ink)}
.report-sub{color:var(--ink3);font-size:.88rem;margin-top:4px}
.report-section{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.report-section-title{font-size:.82rem;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.report-stat{text-align:center}
.report-stat-val{font-size:1.5rem;font-weight:700;color:var(--ink);font-family:"Spectral",serif}
.report-stat-label{font-size:.75rem;color:var(--ink3)}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--p3);font-size:.85rem}
.log-item:last-child{border-bottom:none}
.log-strand{font-weight:600;color:var(--ink)}
.log-date{color:var(--ink3);font-size:.78rem}
@media(max-width:440px){.dash-stats{grid-template-columns:1fr 1fr}.jr-choices{grid-template-columns:1fr}.student-grid{grid-template-columns:repeat(2,1fr)}}

/* ── Fill-in-the-blank activity ─────────────────────────────────────── */
.fill-section{margin-top:14px;border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.fill-header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg2)}
.fill-header h4{margin:0;font-size:.83rem;color:var(--ink3);font-weight:600}
.fill-open-btn{background:var(--gold);color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:.78rem;cursor:pointer}
.fill-body{padding:12px}
.fill-progress{font-size:.75rem;color:var(--ink4);text-align:right;margin-bottom:6px}
.fill-sentence{font-family:'Amiri',serif;font-size:1.4rem;direction:rtl;text-align:right;line-height:2;margin-bottom:10px;color:var(--ink1)}
.fill-blank{display:inline-block;border-bottom:2px solid var(--teal);min-width:80px;margin:0 4px;text-align:center;color:var(--teal);font-weight:600}
.fill-blank.correct{border-color:#2a7a2a;color:#2a7a2a;background:#eaf5ea;border-radius:4px;padding:0 6px}
.fill-blank.wrong{border-color:var(--coral);color:var(--coral);background:#fdf0f0;border-radius:4px;padding:0 6px}
.fill-tr{font-size:.82rem;color:var(--ink3);margin-bottom:10px;text-align:left}
.fill-choices{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;justify-content:center}
.fill-choice{background:var(--bg2);border:1.5px solid var(--border);border-radius:8px;padding:8px 16px;font-family:'Amiri',serif;font-size:1.1rem;cursor:pointer;transition:.12s}
.fill-choice:hover{border-color:var(--teal);color:var(--teal)}
.fill-choice.selected{border-color:var(--teal);background:var(--teal);color:#fff}
.fill-choice.correct{border-color:#2a7a2a;background:#2a7a2a;color:#fff;cursor:default}
.fill-choice.wrong{border-color:var(--coral);background:var(--coral);color:#fff}
.fill-type-wrap{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.fill-input{font-family:'Amiri',serif;font-size:1.1rem;direction:rtl;border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;width:140px;text-align:center}
.fill-input:focus{outline:none;border-color:var(--teal)}
.fill-submit{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:.82rem}
.fill-reveal{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:.75rem;cursor:pointer;color:var(--ink3)}
.fill-hint{font-size:.73rem;color:var(--ink4);text-align:center;margin-bottom:6px;font-style:italic}
.fill-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.fill-nav-btn{background:var(--bg2);border:1.5px solid var(--border);border-radius:6px;padding:3px 12px;cursor:pointer;font-size:.9rem}
.fill-nav-btn:hover{border-color:var(--teal)}
.fill-counter{font-size:.75rem;color:var(--ink4)}
.fill-score{font-size:.78rem;font-weight:600;color:var(--teal)}

/* ── Transformation drills ──────────────────────────────────────────── */
.drill-section{margin-top:14px;border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.drill-header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg2)}
.drill-header h4{margin:0;font-size:.83rem;color:var(--ink3);font-weight:600}
.drill-open-btn{background:#6B4A8A;color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:.78rem;cursor:pointer}
.drill-body{padding:12px}
.drill-source{font-family:'Amiri',serif;font-size:1.6rem;direction:rtl;text-align:right;color:var(--ink1);margin-bottom:2px}
.drill-source-tr{font-size:.8rem;color:var(--ink4);text-align:left;margin-bottom:6px}
.drill-instruction{font-size:.82rem;font-weight:600;color:#6B4A8A;margin-bottom:8px;padding:4px 8px;background:#f5f0fa;border-radius:6px;display:inline-block}
.drill-choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.drill-choice{background:var(--bg2);border:1.5px solid var(--border);border-radius:8px;padding:8px 14px;font-family:'Amiri',serif;font-size:1.05rem;cursor:pointer;transition:.12s}
.drill-choice:hover{border-color:#6B4A8A;color:#6B4A8A}
.drill-choice.correct{border-color:#2a7a2a;background:#2a7a2a;color:#fff;cursor:default}
.drill-choice.wrong{border-color:var(--coral);background:var(--coral);color:#fff}

<script>
// UTILITIES
function V(ar,en,em){return{ar:ar,en:en,em:em||""}}
function $(id){return document.getElementById(id)}
function shuffle(a){var b=[...a];for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function today(){return new Date().toISOString().slice(0,10)}
// Pre-load voices; update when they arrive
var _arVoice = null;
function _initVoices() {
  var vs = (typeof speechSynthesis !== 'undefined') ? speechSynthesis.getVoices() : [];
  _arVoice = vs.find(function(v){ return v.lang.startsWith('ar'); }) || null;
}
_initVoices();
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = _initVoices;
}

function speak(text) {
  if (!text || !text.trim()) return;
  // Path 1: native Arabic voice via Web Speech API
  if (_arVoice) {
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.voice = _arVoice;
      u.lang = 'ar-SA';
      u.rate = 0.85;
      setTimeout(function(){ speechSynthesis.speak(u); }, 60);
      return;
    } catch(e) {}
  }
  // Path 2: Google Translate TTS — real Arabic, requires internet
  try {
    var url = 'https://translate.google.com/translate_tts?ie=UTF-8&q='
            + encodeURIComponent(text) + '&tl=ar&client=gtx&ttsspeed=0.8';
    var a = new Audio(url);
    a.play().catch(function(){});
  } catch(e) {}
}
function getMode(grade){var g=parseInt(grade)||0;return g<=2?"junior":g<=6?"middle":"senior"}
function modeLabelFull(m){return m==="junior"?"Junior (K-2)":m==="middle"?"Middle (Gr 3-6)":"Senior (Gr 7+)"}

// STORAGE
// ── Supabase client ───────────────────────────────────────────────────────────
var _sb = null;
try {
  if (typeof supabase !== 'undefined') {
    _sb = supabase.createClient(
      'https://apallkuclqcqxnbmjuqu.supabase.co',
      'sb_publishable_2BiWGqs9AfvWKw4N69TSGw_iCvnslJ9'
    );
  }
} catch(e) {}

// ── Store — localStorage first, Supabase sync in background ───────────────────
var Store = {
  getProgress: function(id) {
    try { return JSON.parse(localStorage.getItem('how_arabic_p_' + id) || 'null'); } catch(e) { return null; }
  },
  saveProgress: function(id, p) {
    localStorage.setItem('how_arabic_p_' + id, JSON.stringify(p));
    pushArabicProgress(); // background sync
  },
  defaultProgress: function(level, mode) {
    return { level: parseInt(level)||0, week:1, mode:mode, done:{}, streak:0, lastDate:null };
  }
};

// ── Supabase pull / push ───────────────────────────────────────────────────────
async function pullArabicProgress() {
  if (!_sb || !APP.student || !APP.student.id) return null;
  var jwt = localStorage.getItem('how_jwt'); if (!jwt) return null;
  try {
    var r = await _sb.from('arabic_progress')
      .select('level,week,mode,done,streak,last_date')
      .eq('student_id', APP.student.id)
      .single();
    if (r.data) {
      var d = r.data;
      return { level:d.level||0, week:d.week||1, mode:d.mode||getMode(APP.student.grade),
               done:d.done||{}, streak:d.streak||0, lastDate:d.last_date||null };
    }
  } catch(e) {}
  return null;
}

async function pushArabicProgress() {
  if (!_sb || !APP.student || !APP.student.id || !APP.progress) return;
  var jwt = localStorage.getItem('how_jwt');
  var hid = localStorage.getItem('how_household_id');
  if (!jwt || !hid) return;
  var p = APP.progress;
  try {
    await _sb.from('arabic_progress').upsert({
      student_id:   APP.student.id,
      household_id: hid,
      level:        p.level,
      week:         p.week,
      mode:         p.mode,
      done:         p.done,
      streak:       p.streak,
      last_date:    p.lastDate,
      updated_at:   new Date().toISOString()
    }, { onConflict: 'student_id' });

]},

{id:"durus",label:"القواعد",labelEn:"Grammar",color:"#1d6f6f",grammarAr:"صيغة التفضيل",grammarEn:"Comparative - أَفْعَلُ pattern",rule:"Form: أَفْعَلُ. كَبِيرٌ -> أَكْبَرُ (bigger). Superlative: الـ + أَفْعَلُ.",text:"الْقُرْآنُ أَعْظَمُ كِتَابٍ. اللّٰهُ أَكْبَرُ. الصَّبْرُ أَحْسَنُ مِنَ الْغَضَبِ.",tr:"The Quran is the greatest book. Allah is the greatest. Patience is better than anger.",vocab:[V("أَكْبَرُ","bigger/greatest",""),V("أَصْغَرُ","smaller",""),V("أَحْسَنُ","better/best",""),V("أَعْظَمُ","greater/greatest",""),V("أَفْضَلُ","superior/better",""),V("اللّٰهُ أَكْبَرُ","Allah is the greatest","📿"),V("أَقْرَبُ","closer",""),V("أَبْعَدُ","farther","")]},

{w:21,lesson:21,title:"النفي",titleEn:"Negation",ejtaal:"http://ejtaal.net/islam/madeenah-arabic/du1_21.htm",ua:"https://understand-arabic.com",sessions:[

{id:"taabeer",label:"التعبير",labelEn:"Expression",color:"#3d1f6e",grammarAr:"النفي في العقيدة والأخلاق",grammarEn:"Negation in creed and character",rule:"The Shahada is negation then affirmation. Express what Islam negates and affirms.",text:"لَا إِلَهَ إِلَّا اللّٰهُ. لَا شَرِيكَ لَهُ. لَا يَكْذِبُ الْمُؤْمِنُ. لَا يَغُشُّ الْمُسْلِمُ.",tr:"There is no god but Allah. No partner for Him. The believer does not lie. The Muslim does not cheat.",vocab:[V("لَا شَرِيكَ","no partner",""),V("لَا يَغُشُّ","does not cheat",""),V("الْمُؤْمِنُ","the believer","")]}

{w:1,title:"وِلَادَةُ النَّبِيِّ ﷺ",titleEn:"Seerah — Birth & early life",sessions:[
{id:"durus",label:"قِرَاءَة",labelEn:"Reading",color:"#8B6914",grammarAr:"السِّيرَةُ النَّبَوِيَّة",grammarEn:"Seerah narrative — sustained reading",rule:"Read the passage, identify verb forms and case endings. Narrate the event in your own Arabic.",text:"وُلِدَ النَّبِيُّ مُحَمَّدٌ ﷺ فِي مَكَّةَ الْمُكَرَّمَةِ عَامَ الْفِيلِ. تُوُفِّيَ أَبُوهُ عَبْدُ اللَّهِ قَبْلَ وِلَادَتِهِ. وَكَفَلَتْهُ أُمُّهُ آمِنَةُ ثُمَّ جَدُّهُ عَبْدُ الْمُطَّلِبِ.",tr:"The Prophet Muhammad ﷺ was born in Makkah in the Year of the Elephant. His father Abdullah passed away before his birth. His mother Aminah cared for him, then his grandfather Abdul Muttalib.",vocab:[V("وُلِدَ","was born","👶"),V("عَامُ الْفِيلِ","Year of the Elephant","🐘"),V("تُوُفِّيَ","passed away","🌿"),V("كَفَلَ","cared for / raised","🤲"),V("رَضَاعَةٌ","nursing / suckling","🍼"),V("حَلِيمَةُ السَّعْدِيَّة","Haleema al-Sa'diyya","👩"),V("شَقُّ الصَّدْر","opening of the chest","✨"),V("يَتِيمٌ","orphan","🕊️")]}

{w:2,title:"نُزُولُ الْوَحْيِ",titleEn:"Seerah — First revelation",sessions:[
{id:"durus",label:"قِرَاءَة",labelEn:"Reading",color:"#8B6914",grammarAr:"السِّيرَةُ النَّبَوِيَّة",grammarEn:"Seerah narrative — sustained reading",rule:"Read the passage, identify verb forms and case endings. Narrate the event in your own Arabic.",text:"نَزَلَ الْوَحْيُ عَلَى النَّبِيِّ ﷺ فِي غَارِ حِرَاءٍ. جَاءَهُ جِبْرِيلُ وَقَالَ: اقْرَأْ. قَالَ: مَا أَنَا بِقَارِئٍ. فَغَطَّهُ ثُمَّ أَرْسَلَهُ.",tr:"The revelation descended upon the Prophet ﷺ in the Cave of Hira. Jibreel came to him and said: Read. He said: I am not a reader. He embraced him then released him.",vocab:[V("وَحْيٌ","revelation","📖"),V("غَارُ حِرَاء","Cave of Hira","🏔️"),V("جِبْرِيلُ","Jibreel / Gabriel","👼"),V("اقْرَأْ","Read! (imperative)","📚"),V("غَطَّهُ","embraced him tightly","🤗"),V("أَرْسَلَ","sent / released","✉️"),V("رَجَفَ","shook / trembled","😨"),V("زَمِّلُونِي","wrap me up","🧥")]}
]},
{w:3,title:"الْإِسْرَاءُ وَالْمِعْرَاجُ",titleEn:"Seerah — Al-Isra wal-Miraj",sessions:[

]},
{w:4,title:"الْهِجْرَةُ إِلَى الْمَدِينَة",titleEn:"Seerah — Hijra to Madinah",sessions:[
{id:"durus",label:"قِرَاءَة",labelEn:"Reading",color:"#8B6914",grammarAr:"السِّيرَةُ النَّبَوِيَّة",grammarEn:"Seerah narrative — sustained reading",rule:"Read the passage, identify verb forms and case endings. Narrate the event in your own Arabic.",text:"أَذِنَ اللَّهُ لِلنَّبِيِّ ﷺ بِالْهِجْرَةِ إِلَى الْمَدِينَةِ. صَحِبَهُ أَبُو بَكْرٍ الصِّدِّيقُ. اخْتَبَأَا فِي غَارِ ثَوْرٍ ثَلَاثَةَ أَيَّامٍ.",tr:"Allah permitted the Prophet ﷺ to migrate to Madinah. Abu Bakr al-Siddiq accompanied him. They hid in the Cave of Thawr for three days.",vocab:[V("هِجْرَةٌ","migration / Hijra","🚶"),V("أَذِنَ","permitted","✅"),V("صَحِبَ","accompanied","🤝"),V("اخْتَبَأَ","hid","🕵️"),V("غَارُ ثَوْرٍ","Cave of Thawr","🏔️"),V("أَنْصَارٌ","the Helpers","🌟"),V("مُهَاجِرُونَ","the Migrants","🚶"),V("مُؤَاخَاةٌ","brotherhood pact","🤝")]}

{w:5,title:"غَزْوَةُ بَدْرٍ",titleEn:"Seerah — Battle of Badr",sessions:[
{id:"durus",label:"قِرَاءَة",labelEn:"Reading",color:"#8B6914",grammarAr:"السِّيرَةُ النَّبَوِيَّة",grammarEn:"Seerah narrative — sustained reading",rule:"Read the passage, identify verb forms and case endings. Narrate the event in your own Arabic.",text:"وَقَعَتْ غَزْوَةُ بَدْرٍ فِي السَّنَةِ الثَّانِيَةِ مِنَ الْهِجْرَةِ. كَانَ الْمُسْلِمُونَ ثَلَاثَمِئَةٍ وَبِضْعَةَ عَشَرَ رَجُلًا. نَصَرَ اللَّهُ الْمُؤْمِنِينَ.",tr:"The Battle of Badr occurred in the second year of the Hijra. The Muslims were 313 men. Allah aided the believers.",vocab:[V("غَزْوَةٌ","battle / military expedition","⚔️"),V("وَقَعَتْ","occurred / took place","📅"),V("نَصَرَ","aided / gave victory","🏆"),V("أَسِيرٌ","captive / prisoner","⛓️"),V("فِدَاءٌ","ransom","💰"),V("مَلَائِكَةٌ","angels","👼"),V("شَهِيدٌ","martyr","🌹"),V("غَنِيمَةٌ","war spoils","🎁")]}
]},
{w:6,title:"فَتْحُ مَكَّةَ",titleEn:"Seerah — Conquest of Makkah",sessions:[
{id:"durus",label:"قِرَاءَة",labelEn:"Reading",color:"#8B6914",grammarAr:"السِّيرَةُ النَّبَوِيَّة",grammarEn:"Seerah narrative — sustained reading",rule:"Read the passage, identify verb forms and case endings. Narrate the event in your own Arabic.",text:"دَخَلَ النَّبِيُّ ﷺ مَكَّةَ فِي السَّنَةِ الثَّامِنَةِ مُنْتَصِرًا. قَالَ: يَا أَهْلَ مَكَّةَ مَا تَظُنُّونَ أَنِّي فَاعِلٌ بِكُمْ؟ قَالُوا: أَخٌ كَرِيمٌ. قَالَ: اذْهَبُوا فَأَنْتُمُ الطُّلَقَاءُ.",tr:"The Prophet ﷺ entered Makkah in the eighth year, victorious. He said: O people of Makkah, what do you think I will do to you? They said: A noble brother. He said: Go, you are free.",vocab:[V("مُنْتَصِرًا","victorious (hal)","🏆"),V("طُلَقَاءُ","freed people","🕊️"),V("عَفَا","pardoned / forgave","💚"),V("أَصْنَامٌ","idols","🗿"),V("كَسَرَ","broke / smashed","💥"),V("تَوْحِيدٌ","monotheism","☝️"),V("كَرِيمٌ","noble / generous","⭐"),V("رَحْمَةٌ","mercy","💚")]}
]},
{w:7,title:"خُطْبَةُ الْوَدَاعِ",titleEn:"Seerah — Farewell Sermon",sessions:[
{id:"durus",label:"قِرَاءَة",labelEn:"Reading",color:"#8B6914",grammarAr:"السِّيرَةُ النَّبَوِيَّة",grammarEn:"Seerah narrative — sustained reading",rule:"Read the passage, identify verb forms and case endings. Narrate the event in your own Arabic.",text:"قَالَ النَّبِيُّ ﷺ فِي حَجَّةِ الْوَدَاعِ: أَيُّهَا النَّاسُ إِنَّ دِمَاءَكُمْ وَأَمْوَالَكُمْ حَرَامٌ عَلَيْكُمْ. لَا تَرْجِعُوا بَعْدِي كُفَّارًا.",tr:"The Prophet ﷺ said in the Farewell Pilgrimage: O people, your blood and wealth are sacred to you. Do not return after me as disbelievers.",vocab:[V("وَدَاعٌ","farewell","👋"),V("دِمَاءٌ","blood (pl.)","🩸"),V("أَمْوَالٌ","wealth (pl.)","💰"),V("حَرَامٌ","forbidden / sacred","🚫"),V("شَاهِدٌ","witness","👁️"),V("وَصِيَّةٌ","final counsel / bequest","📜"),V("تُبَلِّغُ","convey / transmit","📣"),V("أَمَانَةٌ","trust / responsibility","🤝")]}
]},
{w:8,title:"أَبُو بَكْرٍ الصِّدِّيقُ",titleEn:"Companion — Abu Bakr",sessions:[
{id:"durus",label:"قِرَاءَة",labelEn:"Companion biography",color:"#8B6914",grammarAr:"صَحَابَةُ النَّبِيِّ",grammarEn:"Companions of the Prophet — reading and reflection",rule:"Read the passage carefully. Identify three grammatical features. Then summarise in three Arabic sentences.",text:"أَبُو بَكْرٍ الصِّدِّيقُ أَوَّلُ مَنْ آمَنَ مِنَ الرِّجَالِ. صَاحَبَ النَّبِيَّ ﷺ فِي الْهِجْرَةِ. قَالَ النَّبِيُّ: لَوْ كُنْتُ مُتَّخِذًا خَلِيلًا لَاتَّخَذْتُ أَبَا بَكْرٍ خَلِيلًا.",tr:"Abu Bakr al-Siddiq was the first man to believe. He accompanied the Prophet ﷺ in the Hijra. The Prophet said: If I were to take a close friend I would have taken Abu Bakr.",vocab:[V("صِدِّيقٌ","the most truthful","✅"),V("خَلِيلٌ","intimate friend","🤝"),V("خَلِيفَةٌ","successor / caliph","👑"),V("رِدَّةٌ","apostasy","↩️"),V("جَيْشُ أُسَامَةَ","Army of Usama","⚔️"),V("جَمَعَ","collected / compiled","📚"),V("مُصْحَفٌ","copy of the Quran","📖"),V("الصِّدِّيقُ","the Truthful (title)","⭐")]}
]},
{w:9,title:"عُمَرُ بْنُ الْخَطَّابِ",titleEn:"Companion — Umar",sessions:[
{id:"durus",label:"قِرَاءَة",labelEn:"Companion biography",color:"#8B6914",grammarAr:"صَحَابَةُ النَّبِيِّ",grammarEn:"Companions of the Prophet — reading and reflection",rule:"Read the passage carefully. Identify three grammatical features. Then summarise in three Arabic sentences.",text:"عُمَرُ بْنُ الْخَطَّابِ الْفَارُوقُ. فَرَّقَ اللَّهُ بِهِ بَيْنَ الْحَقِّ وَالْبَاطِلِ. فَتَحَ بَيْتَ الْمَقْدِسِ. عُرِفَ بِالْعَدْلِ وَالزُّهْدِ.",tr:"Umar ibn al-Khattab, al-Faruq. Allah distinguished through him between truth and falsehood. He opened Jerusalem. He was known for justice and asceticism.",vocab:[V("فَارُوقٌ","the Distinguisher (title)","⚖️"),V("عَدْلٌ","justice","⚖️"),V("زُهْدٌ","asceticism / abstinence","🌿"),V("فَتَحَ","opened / conquered","🔓"),V("بَيْتُ الْمَقْدِس","Jerusalem","🕌"),V("دِيوَانٌ","administrative register","📋"),V("أَمِيرُ الْمُؤْمِنِين","Commander of the Faithful","👑"),V("شُورَى","consultation","🤝")]}
]},
{w:10,title:"عُثْمَانُ بْنُ عَفَّانَ",titleEn:"Companion — Uthman",sessions:[
{id:"durus",label:"قِرَاءَة",labelEn:"Companion biography",color:"#8B6914",grammarAr:"صَحَابَةُ النَّبِيِّ",grammarEn:"Companions of the Prophet — reading and reflection",rule:"Read the passage carefully. Identify three grammatical features. Then summarise in three Arabic sentences.",text:"عُثْمَانُ بْنُ عَفَّانَ ذُو النُّورَيْنِ. جَمَعَ الْقُرْآنَ فِي مُصْحَفٍ وَاحِدٍ. أَرْسَلَ النُّسَخَ إِلَى الْأَمْصَارِ. قَالَ النَّبِيُّ: مَا ضَرَّ عُثْمَانَ مَا فَعَلَ بَعْدَ الْيَوْمِ.",tr:"Uthman ibn Affan, the one with two lights. He compiled the Quran into one copy. He sent copies to the provinces. The Prophet said: Nothing will harm Uthman for what he does after today.",vocab:[V("ذُو النُّورَيْن","of two lights (title)","✨"),V("جَمَعَ","compiled / gathered","📚"),V("نُسْخَةٌ","copy","📄"),V("أَمْصَارٌ","provinces / cities","🏙️"),V("حَيَاءٌ","modesty / shyness","🌸"),V("تَجْهِيزٌ","equipping","⚔️"),V("جَيْشُ الْعُسْرَة","Army of Difficulty","💪"),V("رَحِيمٌ","merciful","💚")]}

{w:11,title:"عَلِيُّ بْنُ أَبِي طَالِبٍ",titleEn:"Companion — Ali",sessions:[

{w:12,title:"الْأَرْبَعُونَ النَّوَوِيَّة (١–١٠)",titleEn:"40 Nawawi Hadith — 1 to 10",sessions:[

{w:13,title:"الْأَرْبَعُونَ النَّوَوِيَّة (١١–٢٠)",titleEn:"40 Nawawi Hadith — 11 to 20",sessions:[
{id:"durus",label:"حَدِيث",labelEn:"Hadith study",color:"#8B6914",grammarAr:"الْأَرْبَعُونَ النَّوَوِيَّة",grammarEn:"40 Hadith Nawawi — full grammatical analysis",rule:"For each hadith: (1) identify verb forms, (2) mark case endings on key nouns, (3) translate fully.",text:"لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ. اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا.",tr:"None of you truly believes until he loves for his brother what he loves for himself. Be mindful of Allah wherever you are, and follow a bad deed with a good one — it will erase it.",vocab:[V("حَتَّى يُحِبَّ","until he loves (subj.)","💭"),V("أَتْبِعِ","follow up (imperative)","📋"),V("سَيِّئَةٌ","bad deed","❌"),V("تَمْحُوهَا","erases it","🧹"),V("حَيْثُمَا","wherever","📍"),V("مَحَبَّةٌ","love / affection","❤️"),V("تَقْوَى","God-consciousness","⚠️"),V("مُتَقِّي","one who has taqwa","🌟")]}

// ACTIVITY BUILDERS - use data attributes, no inline string args
function buildJuniorActivity(sesKey, vocab) {
  if (!vocab || vocab.length < 2) return "";
  var items = shuffle([...vocab]).slice(0, Math.min(vocab.length, 8));
  _jr[sesKey] = {items:items, current:0, correct:0};
  _actVocab[sesKey] = items;
  return jrBuildHtml(sesKey, items, 0);
}

function jrBuildHtml(sesKey, items, idx) {
  var w = items[idx];
  var others = shuffle(items.filter(function(_,i){return i!==idx;})).slice(0,3);
  var choices = shuffle([w].concat(others));
  var html = '<div class="jr-wrap">';
  html += '<p class="jr-prompt">What does this word mean?</p>';
  html += '<div class="jr-word-btn" id="jwb-' + sesKey + '" data-ar="' + esc(w.ar) + '" onclick="speakFromEl(this)">';
  html += '<span class="jr-arabic-big" id="jwa-' + sesKey + '">' + w.ar + '</span>';
  html += '<span class="jr-listen-hint">&#128266; tap to hear</span></div>';
  html += '<div class="jr-choices" id="jrc-' + sesKey + '">';
  choices.forEach(function(c) {
    html += '<button class="jr-choice" data-ses="' + sesKey + '" data-ar="' + esc(c.ar) + '" onclick="jrPick(this)">';
    html += (c.em ? c.em + " " : "") + c.en + "</button>";
  });
  html += '</div>';
  html += '<div class="jr-result" id="jrr-' + sesKey + '"></div>';
  html += '<div class="jr-progress" id="jrp-' + sesKey + '">Word ' + (idx+1) + ' of ' + items.length + '</div>';
  html += '</div>';
  return html;
}

function speakFromEl(el) {
  speak(el.dataset.ar || el.textContent.trim());
}

function jrPick(btn) {
  var sesKey = btn.dataset.ses;
  var clickedAr = btn.dataset.ar;
  var jr = _jr[sesKey]; if (!jr) return;
  var targetAr = jr.items[jr.current].ar;
  var correct = (targetAr === clickedAr);
  // Disable all choices
  var all = document.querySelectorAll("#jrc-" + sesKey + " .jr-choice");
  all.forEach(function(b){ b.disabled = true; });
  btn.classList.add(correct ? "jr-correct" : "jr-wrong");
  if (correct) jr.correct++;
  jr.current++;
  var rEl = $("jrr-" + sesKey);
  if (rEl) rEl.innerHTML = correct
    ? "<span style='color:#2a7a2a;font-weight:600'>&#10003; Correct!</span>"
    : "<span style='color:#c0392b;font-weight:600'>Not quite — next one!</span>";
  setTimeout(function(){ jrNext(sesKey); }, 1300);
}

function jrNext(sesKey) {
  var jr = _jr[sesKey]; if (!jr) return;
  if (jr.current >= jr.items.length) {
    var cEl = $("jrc-" + sesKey);
    var rEl = $("jrr-" + sesKey);
    var pEl = $("jrp-" + sesKey);
    if (cEl) cEl.style.display = "none";
    if (rEl) rEl.innerHTML = '<div class="act-complete">&#10003; ' + jr.correct + " / " + jr.items.length + " correct!</div>";
    if (pEl) pEl.textContent = "";
    return;
  }
  var w = jr.items[jr.current];
  var others = shuffle(jr.items.filter(function(_,i){return i!==jr.current;})).slice(0,3);
  var choices = shuffle([w].concat(others));
  var cEl = $("jrc-" + sesKey);
  if (cEl) {
    var html = "";
    choices.forEach(function(c) {
      html += '<button class="jr-choice" data-ses="' + sesKey + '" data-ar="' + esc(c.ar) + '" onclick="jrPick(this)">';
      html += (c.em ? c.em + " " : "") + c.en + "</button>";
    });
    cEl.innerHTML = html;
  }
  var rEl = $("jrr-" + sesKey); if (rEl) rEl.innerHTML = "";
  var pEl = $("jrp-" + sesKey); if (pEl) pEl.textContent = "Word " + (jr.current+1) + " of " + jr.items.length;
  var wBtn = $("jwb-" + sesKey);
  if (wBtn) { wBtn.dataset.ar = w.ar; }
  var wAr = $("jwa-" + sesKey);
  if (wAr) wAr.textContent = w.ar;
}

function buildMiddleActivity(sesKey, vocab) {
  if (!vocab || vocab.length < 2) return "";
  var items = shuffle([...vocab]).slice(0, Math.min(vocab.length, 5));
  var eng = shuffle([...items]);
  _md.sesKey = sesKey; _md.selAr = null; _md.selEn = null;
  _md.matched = 0; _md.total = items.length;
  var html = '<div class="md-wrap">';
  html += '<p class="md-prompt">Match each Arabic word to its English meaning.</p>';
  html += '<div class="md-cols"><div>';
  html += '<div class="md-col-title">&#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577;</div>';
  items.forEach(function(v) {
    html += '<button class="md-item md-ar" data-ses="' + sesKey + '" data-word="' + esc(v.ar) + '" onclick="mdClickAr(this)">' + v.ar + "</button>";
  });
  html += '</div><div><div class="md-col-title">English</div>';
  eng.forEach(function(v) {
    html += '<button class="md-item md-en" data-ses="' + sesKey + '" data-word="' + esc(v.ar) + '" onclick="mdClickEn(this)">' + v.en + "</button>";
  });
  html += '</div></div>';
  html += '<div class="md-score" id="md-score-' + sesKey + '">0 / ' + items.length + " matched</div></div>";
  return html;
}

function buildSeniorActivity(sesKey, text, tr) {
  if (!text) return "";
  var sentences = text.split(/[.،]/).map(function(s){return s.trim();}).filter(function(s){return s.length>4;}).slice(0,3);
  var trs = (tr||"").split(/[.،]/).map(function(s){return s.trim();}).filter(function(s){return s.length>2;});
  var html = '<div class="sr-wrap">';
  sentences.forEach(function(s, i) {
    html += '<div class="sr-part">';
    html += '<div class="sr-q-label">Translate into English</div>';
    html += '<div class="sr-q-arabic">' + s + '.</div>';
    html += '<textarea class="sr-input" placeholder="Write your translation here&#x2026;" rows="2"></textarea>';
    html += '<div class="sr-reveal hidden" id="srrev-' + sesKey + '-' + i + '">';
    html += '<span class="sr-reveal-label">Translation:</span> ' + (trs[i]||"&#8212;") + '.</div>';
    html += '<button class="sr-reveal-btn" data-ses="' + sesKey + '" data-idx="' + i + '" onclick="srReveal(this)">Reveal translation</button>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// ACTIVITY HANDLERS
function mdClick(btn, side) {
  if (btn.classList.contains("md-matched")) return;
  var word = btn.dataset.word;
  var sesKey = btn.dataset.ses || _md.sesKey;
  _md.sesKey = sesKey;
  if (side === "ar") {
    document.querySelectorAll(".md-ar.md-sel").forEach(function(b){b.classList.remove("md-sel");});
    btn.classList.add("md-sel"); _md.selAr = {btn:btn, word:word};
  } else {
    document.querySelectorAll(".md-en.md-sel").forEach(function(b){b.classList.remove("md-sel");});
    btn.classList.add("md-sel"); _md.selEn = {btn:btn, word:word};
  }
  if (_md.selAr && _md.selEn) {
    if (_md.selAr.word === _md.selEn.word) {
      [_md.selAr.btn, _md.selEn.btn].forEach(function(b){
        b.classList.remove("md-sel"); b.classList.add("md-matched"); b.disabled = true;
      });
      _md.matched++;
      var sc = $("md-score-" + sesKey);
      if (sc) sc.textContent = _md.matched + " / " + _md.total + " matched";
      _md.selAr = null; _md.selEn = null;
      if (_md.matched === _md.total) {
        setTimeout(function(){
          var sc2 = $("md-score-" + sesKey);
          if (sc2) sc2.innerHTML = '<div class="act-complete">&#10003; All matched! Excellent.</div>';
        }, 300);
      }
    } else {
      var ar = _md.selAr, en = _md.selEn;
      _md.selAr = null; _md.selEn = null;
      [ar.btn, en.btn].forEach(function(b){b.classList.add("md-wrong");});
      setTimeout(function(){[ar.btn,en.btn].forEach(function(b){b.classList.remove("md-wrong","md-sel");});}, 700);
    }
  }
}

function srReveal(btn) {
  var sesKey = btn.dataset.ses;
  var idx = btn.dataset.idx;
  var rev = $("srrev-" + sesKey + "-" + idx);
  if (rev) rev.classList.remove("hidden");
  btn.style.display = "none";
}

function revealTr(sesKey) {
  var el = $("tr-" + sesKey);
  if (el) el.classList.remove("hidden-tr");
  var btns = document.querySelectorAll("[data-rtkey='" + sesKey + "']");
  btns.forEach(function(b){b.style.display="none";});
}
function revealTrEl(btn) { revealTr(btn.dataset.rtkey); }

function mdClickAr(btn){ mdClick(btn,"ar"); }
function mdClickEn(btn){ mdClick(btn,"en"); }

// SESSION CARD BUILDER
function buildCard(ses, week, lNum, idx, total, progress, mode) {
  var sesKey = "L" + lNum + "_W" + week.w + "_" + ses.id;
  var isDone = !!(progress && progress.done && progress.done[sesKey]);
  var actHtml = "";
  if (mode === "junior") actHtml = buildJuniorActivity(sesKey, ses.vocab);
  else if (mode === "middle") actHtml = buildMiddleActivity(sesKey, ses.vocab);
  else actHtml = buildSeniorActivity(sesKey, ses.text, ses.tr);

  var vocabHtml = "";
  if (ses.vocab && ses.vocab.length) {
    vocabHtml = '<div class="vocab-section"><div class="vocab-label">Vocabulary &#x2014; &#1575;&#1604;&#1605;&#1601;&#1585;&#1583;&#1575;&#1578;</div><table class="vocab-table">';
    ses.vocab.forEach(function(v) {
      vocabHtml += "<tr><td class='vt-ar'>" + v.ar + "</td><td class='vt-em'>" + (v.em||"") + "</td>";
      vocabHtml += "<td class='vt-en'>" + v.en + "</td>";
      vocabHtml += "<td><button class='speak-btn' data-ar='" + esc(v.ar) + "' onclick='speakFromEl(this)' title='Listen'>&#128266;</button></td></tr>";
    });
    vocabHtml += "</table></div>";
  }

  var trBlock = "";
  if (ses.tr) {
    if (mode === "senior") {
      trBlock = '<div class="translation-text hidden-tr" id="tr-' + sesKey + '">' + ses.tr + '</div>';
      trBlock += '<button class="reveal-tr-btn" data-rtkey="' + sesKey + '" onclick="revealTrEl(this)">Show translation</button>';
    } else {
      trBlock = '<div class="translation-text">' + ses.tr + '</div>';
    }
  }

  var markId = "mark-" + sesKey.replace(/_/g, "-");
  var html = '<div class="session-card" id="card-' + sesKey + '">';
  html += '<div class="session-bar" style="background:' + ses.color + '"></div>';
  html += '<div class="session-head">';
  html += '<div class="session-labels">';
  html += '<span class="lv-badge">Level ' + lNum + '</span>';
  html += '<span class="wk-badge">Week ' + week.w + '</span>';
  html += '<span class="wk-badge">' + (idx+1) + ' of ' + total + '</span>';
  if (isDone) html += '<span class="ses-done-badge">&#10003; Done</span>';
  html += '</div>';
  html += '<div class="session-title">' + ses.label + '</div>';
  html += '<div class="session-title-en">' + ses.labelEn + '</div>';
  html += '</div><div class="session-body">';

  if (ses.grammarAr || ses.grammarEn) {
    html += '<div class="grammar-box">';
    if (ses.grammarAr) html += '<div class="grammar-ar">' + ses.grammarAr + '</div>';
    if (ses.grammarEn) html += '<div class="grammar-en">' + ses.grammarEn + '</div>';
    if (ses.teacherNote) html += '<div class="teacher-note">📋 <strong>Teacher note:</strong> ' + ses.teacherNote + '</div>';
    if (ses.rule) html += '<div class="grammar-rule">' + ses.rule + '</div>';
    html += '</div>';
  }
  if (ses.text) {
    html += '<div class="arabic-block">';
    html += '<div class="arabic-text">' + ses.text + '</div>';
    html += trBlock;
    html += '</div>';
  }
  html += vocabHtml;
  if (actHtml) {
    html += '<div class="activity-section"><div class="activity-label">Practice &#x2014; &#1575;&#1604;&#1578;&#1583;&#1585;&#1610;&#1576;</div>' + actHtml + '</div>';
  }
  html += '</div>'; // session-body
  html += '<div class="session-footer">';
  html += '<div class="resource-links"></div>';
  html += '<button class="mark-btn' + (isDone?" done":"") + '" id="' + markId + '" data-key="' + sesKey + '" onclick="markDone(this)"' + (isDone?" disabled":"") + '>';
  html += (isDone ? "&#10003; Complete" : "Mark complete") + '</button>';
  html += '</div></div>';
  // Comprehension questions panel
  if (COMP_DB[sesKey] && COMP_DB[sesKey].length) {

  // Sentence scramble panel
  if (SCRAMBLE_DB[sesKey] && SCRAMBLE_DB[sesKey].length) {

    html += '<div class="scr-header"><h4>✦ Sentence scramble</h4>';

    html += '<div class="drill-header"><h4>⇄ Transformation drills</h4>';
    html += '<button class="drill-open-btn" data-sk="' + sesKey + '" onclick="toggleDrill(this)">⇄ Drill</button></div>';

  if (TABLE_DB[sesKey] && TABLE_DB[sesKey].length) {

    html += '<button class="table-open-btn" data-sk="' + sesKey + '" onclick="toggleTable(this)">⊞ Table</button></div>';

  // Dictation panel — senior mode only
  if (ses.vocab && ses.vocab.length && mode === 'senior') {
    html += '<div class="dict-section">';

    html += '<h4>🎧 Dictation <span class="dict-senior-badge">Senior</span></h4>';
    html += '<button class="dict-open-btn" data-sk="' + sesKey + '" onclick="toggleDict(this)">🎧 Dictation</button>';
    html += '</div>';
    html += '<div class="dict-body" id="dictb-' + sesKey + '" style="display:none"></div>';
    html += '</div>';
  }
  // Word search panel (uses vocab from _wcVocab, populated above)
  // Word search: hide during alphabet weeks (L0 W1-W5) — students not yet letter-fluent
  if (ses.vocab && ses.vocab.length >= 3 && !(lNum === 0 && week.w <= 5)) {
    html += '<div class="ws-section">';
    html += '<div class="ws-header"><h4>⊡ Word search</h4>';

    html += '<div class="ws-body" id="wsb-' + sesKey + '" style="display:none"></div>';
    html += '</div>';
  }
  // Writing practice panel
  if (ses.vocab && ses.vocab.length) {
    _wcVocab[sesKey] = ses.vocab;
    html += '<div class="writing-panel">';
    html += '<div class="wp-header"><h4>&#9998;&#65039; Writing practice</h4>';
    html += '<button class="wp-open-btn" data-sk="' + sesKey + '" onclick="toggleWP(this)">&#9998; Practice</button></div>';
    html += '<div class="wp-body" id="wpb-' + sesKey + '" style="display:none">';
    html += '<div class="wp-model" id="wp-word-' + sesKey + '">&#8212;</div>';
    html += '<div class="wp-en" id="wp-en-' + sesKey + '"></div>';
    html += '<div class="wp-nav">';
    html += '<button class="wp-nav-btn" data-sk="' + sesKey + '" onclick="wcPrev(this)">&#8592;</button>';

    html += '<div class="wp-canvas-wrap"><canvas id="wcanvas-' + sesKey + '" class="wp-canvas"></canvas></div>';

    html += '<button class="wp-act-btn" data-sk="' + sesKey + '" onclick="wcReveal(this)">&#128065; English</button>';
    html += '</div>';
    html += '<p class="wp-hint">Finger &middot; stylus &middot; mouse &nbsp;&nbsp; Arabic writes right to left &#8592;</p>';
    html += '</div></div>';
  }
  return html;
}



// ── Fill-in-the-blank ────────────────────────────────────────────────────────
var _fill = {}; // state per sesKey

function toggleFill(btn) {
  var sk = btn.dataset.sk;
  var body = document.getElementById('fillb-' + sk); if (!body) return;
  var open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '✎ Fill-in' : 'Hide';
  if (!open && !_fill[sk]) fillInit(sk);
}

function fillInit(sk) {
  var exercises = FILL_DB[sk]; if (!exercises || !exercises.length) return;
  var mode = APP && APP.student ? (APP.progress && APP.progress.mode) || getMode(APP.student.grade) : 'middle';
  _fill[sk] = { idx: 0, exercises: exercises, mode: mode, score: 0, answered: 0 };
  fillRender(sk);
}

function fillRender(sk) {
  var s = _fill[sk]; if (!s) return;
  var ex = s.exercises[s.idx];
  var total = s.exercises.length;

  // Build sentence with blank
  var parts = ex.sentence_ar.split('___');

var _scr = {};

function toggleScr(btn) {
  var sk = btn.dataset.sk;
  var body = document.getElementById('scrb-' + sk); if (!body) return;
  var open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '✦ Scramble' : 'Hide';
  if (!open && !_scr[sk]) scrInit(sk);
}

function scrInit(sk) {
  var items = SCRAMBLE_DB[sk]; if (!items || !items.length) return;
  var mode = APP && APP.student ? (APP.progress && APP.progress.mode) || getMode(APP.student.grade) : 'middle';
  _scr[sk] = { idx: 0, items: items, mode: mode, score: 0, answered: 0, placed: [] };
  scrRender(sk);
}

function scrShuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function scrRender(sk) {
  var s = _scr[sk]; if (!s) return;
  var ex = s.items[s.idx]; var total = s.items.length;
  var shuffled = scrShuffle(ex.words);
  s.placed = []; s.bank = shuffled.slice();

  var html = '<div class="scr-progress">' + (s.idx+1) + ' / ' + total +
    (s.answered > 0 ? ' · <span style="color:#C47B2A;font-weight:600">' + s.score + '/' + s.answered + '</span>' : '') + '</div>';

  // Show translation for junior always; others after check
  if (s.mode === 'junior') html += '<div class="scr-tr" style="display:block">' + ex.tr + '</div>';
  else html += '<div class="scr-tr" id="scr-tr-' + sk + '">' + ex.tr + '</div>';

  if (ex.hint) html += '<div class="scr-hint">💡 ' + ex.hint + '</div>';
  html += '<div class="scr-answer-area" id="scr-ans-' + sk + '"></div>';
  html += '<div class="scr-word-bank" id="scr-bank-' + sk + '">';
  shuffled.forEach(function(w, i) {
    html += '<button class="scr-word bank" data-sk="' + sk + '" data-widx="' + i + '" onclick="scrBankClick(this)">' + w + '</button>';
  });
  html += '</div>';
  html += '<div class="scr-actions">';
  html += '<button class="scr-check" data-sk="' + sk + '" onclick="scrCheck(this)">✓ Check</button>';
  html += '<button class="scr-reset" data-sk="' + sk + '" onclick="scrReset(this)">↺ Reset</button>';
  if (s.mode !== 'junior') html += '<button class="scr-reveal" data-sk="' + sk + '" onclick="scrRevealTr(this)">Translation</button>';
  html += '</div>';
  html += '<div class="scr-feedback" id="scr-fb-' + sk + '"></div>';
  html += '<div class="scr-nav">';
  html += '<button class="scr-nav-btn" data-sk="' + sk + '" onclick="scrPrev(this)">&#8592;</button>';
  html += '<span class="fill-counter">' + (s.idx+1) + ' of ' + total + '</span>';
  html += '<button class="scr-nav-btn" data-sk="' + sk + '" onclick="scrNext(this)">&#8594;</button>';
  html += '</div>';

  var body = document.getElementById('scrb-' + sk);
  if (body) body.innerHTML = html;
  _scr[sk].bank = shuffled;
}

function scrBankClick(btn) {
  // Move from bank to answer
  var sk = btn.dataset.sk; var s = _scr[sk]; if (!s) return;
  var widx = parseInt(btn.dataset.widx);
  s.placed.push({ widx: widx, word: s.bank[widx] });
  btn.style.visibility = 'hidden';
  scrUpdateAnswer(sk);
}

function scrPlacedClick(btn) {
  // Remove from answer, return to bank
  var sk = btn.dataset.sk; var s = _scr[sk]; if (!s) return;
  var pidx = parseInt(btn.dataset.pidx);
  var item = s.placed[pidx]; if (!item) return;
  s.placed.splice(pidx, 1);
  // Restore bank word
  var bankBtn = document.querySelector('#scr-bank-' + sk + ' [data-widx="' + item.widx + '"]');
  if (bankBtn) bankBtn.style.visibility = 'visible';
  scrUpdateAnswer(sk);
}

function scrUpdateAnswer(sk) {
  var s = _scr[sk]; if (!s) return;
  var area = document.getElementById('scr-ans-' + sk); if (!area) return;
  area.innerHTML = '';
  area.classList.remove('correct','wrong');
  s.placed.forEach(function(item, pidx) {
    var btn = document.createElement('button');
    btn.className = 'scr-word placed';
    btn.textContent = item.word;
    btn.dataset.sk = sk;
    btn.dataset.pidx = pidx;
    btn.onclick = function() { scrPlacedClick(this); };
    area.appendChild(btn);
  });
}

function scrCheck(btn) {
  var sk = btn.dataset.sk; var s = _scr[sk]; if (!s) return;
  var ex = s.items[s.idx];
  var attempt = s.placed.map(function(p){return p.word;}).join(' ');
  var correct = attempt === ex.answer;
  var area = document.getElementById('scr-ans-' + sk);
  var fb = document.getElementById('scr-fb-' + sk);
  if (area) area.classList.add(correct ? 'correct' : 'wrong');
  if (fb) {
    fb.textContent = correct ? '✓ Correct!' : '✗ Not quite — try again or reset';
    fb.style.color = correct ? '#2a7a2a' : 'var(--coral)';
  }
  // Show translation
  var tr = document.getElementById('scr-tr-' + sk);
  if (tr) tr.style.display = 'block';
  s.answered++; if (correct) { s.score++; setTimeout(function(){scrAdvance(sk);}, 1000); }
}

function scrReset(btn) {
  var sk = btn.dataset.sk; scrRender(sk);
}

function scrRevealTr(btn) {
  var sk = btn.dataset.sk;
  var tr = document.getElementById('scr-tr-' + sk);
  if (tr) tr.style.display = tr.style.display === 'none' ? 'block' : 'none';
}

function scrAdvance(sk) {
  var s = _scr[sk]; if (!s) return;

  else {
    var body = document.getElementById('scrb-' + sk);
    if (body) body.innerHTML += '<div style="text-align:center;padding:10px;font-size:.85rem;color:#C47B2A;font-weight:600">✓ All done — ' + s.score + '/' + s.answered + '</div>';
  }
}
function scrPrev(btn){var sk=btn.dataset.sk;var s=_scr[sk];if(!s||s.idx===0)return;s.idx--;scrRender(sk);}
function scrNext(btn){var sk=btn.dataset.sk;var s=_scr[sk];if(!s||s.idx>=s.items.length-1)return;s.idx++;scrRender(sk);}

// ── Word search ───────────────────────────────────────────────────────────────
var _ws = {};
var WS_FILLER = 'ابتثجحخدذرزسشصضطظعغفقكلمنهوي';

function toggleWS(btn) {
  var sk = btn.dataset.sk;
  var body = document.getElementById('wsb-' + sk); if (!body) return;
  var open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '⊡ Word search' : 'Hide';
  if (!open && !_ws[sk]) wsInit(sk);
}

function wsStrip(str) {
  return str.replace(/[\u064B-\u065F\u0640]/g, '');
}

function wsLetters(word) {
  return [...wsStrip(word)];
}

function wsInit(sk) {
  var vocab = _wcVocab[sk]; if (!vocab || vocab.length < 3) return;
  var size = 9;
  var words = [];
  vocab.slice(0, 8).forEach(function(v) {
    var letters = wsLetters(v.ar);
    if (letters.length >= 2 && letters.length <= size) {
      words.push({ ar: v.ar, en: v.en, letters: letters, found: false, positions: null });
    }
  });
  if (words.length < 3) return;

  var grid = [];
  for (var r = 0; r < size; r++) {
    grid[r] = [];
    for (var cc = 0; cc < size; cc++) grid[r][cc] = { letter: '', wordIdx: -1, found: false };
  }

  var dirs = [{dr:0,dc:1},{dr:0,dc:-1},{dr:1,dc:0},{dr:-1,dc:0}];

  words.forEach(function(word, wi) {
    var shuffleDirs = dirs.slice().sort(function(){return Math.random()-.5;});
    var placed = false;
    for (var di = 0; di < shuffleDirs.length && !placed; di++) {
      var d = shuffleDirs[di];
      for (var att = 0; att < 60 && !placed; att++) {
        var r = Math.floor(Math.random()*size);
        var c = Math.floor(Math.random()*size);
        var len = word.letters.length;
        var er = r + d.dr*(len-1); var ec = c + d.dc*(len-1);
        if (er<0||er>=size||ec<0||ec>=size) continue;
        var ok = true; var pos = [];
        for (var i = 0; i < len; i++) {
          var cr = r+d.dr*i; var cc2 = c+d.dc*i;
          if (grid[cr][cc2].letter && grid[cr][cc2].letter !== word.letters[i]) { ok=false; break; }
          pos.push({r:cr,c:cc2});
        }
        if (ok) {
          word.positions = pos;
          pos.forEach(function(p,i){ grid[p.r][p.c].letter=word.letters[i]; grid[p.r][p.c].wordIdx=wi; });
          placed = true;
        }
      }
    }
  });

  for (var r2=0;r2<size;r2++) for (var c2=0;c2<size;c2++)
    if (!grid[r2][c2].letter) grid[r2][c2].letter = WS_FILLER[Math.floor(Math.random()*WS_FILLER.length)];

  _ws[sk] = { grid:grid, words:words, size:size, found:0, start:null };
  wsRender(sk);
}

function wsRender(sk) {
  var s = _ws[sk]; if (!s) return;
  var total = s.words.length;
  var html = '<div class="ws-progress">' + s.found + ' / ' + total + ' words found</div>';
  html += '<div class="ws-layout">';

  // Grid
  html += '<div class="ws-grid-wrap"><table class="ws-grid">';
  for (var r=0;r<s.size;r++) {
    html += '<tr>';
    for (var c=0;c<s.size;c++) {
      var cell = s.grid[r][c];
      var cls = cell.found ? 'ws-found' : '';
      html += '<td class="' + cls + '" data-sk="' + sk + '" data-r="' + r + '" data-c="' + c + '" onclick="wsClickCell(this)">' + cell.letter + '</td>';
    }
    html += '</tr>';
  }
  html += '</table>';
  html += '<div class="ws-hint">Tap first letter, then last letter of a word</div>';
  html += '</div>';

  // Word list
  html += '<div class="ws-word-list"><h5>Find these words:</h5>';
  s.words.forEach(function(w) {
    html += '<div class="ws-word' + (w.found?' found':'') + '">';
    html += '<span class="ws-word-ar">' + w.ar + '</span>';
    html += '<span class="ws-word-en">' + w.en + '</span>';
    html += '</div>';
  });
  html += '</div></div>';

  html += '<div class="ws-actions">';
  html += '<button class="ws-new-btn" data-sk="' + sk + '" onclick="wsNew(this)">↺ New grid</button>';
  html += '<button class="ws-reveal-btn" data-sk="' + sk + '" onclick="wsReveal(this)">Reveal all</button>';
  html += '</div>';

  var body = document.getElementById('wsb-' + sk);
  if (body) body.innerHTML = html;
}

function wsClickCell(td) {
  var sk = td.dataset.sk; var s = _ws[sk]; if (!s) return;
  if (td.classList.contains('ws-found')) return;
  var r = parseInt(td.dataset.r); var c = parseInt(td.dataset.c);

  if (!s.start) {
    // First tap — set start
    s.start = {r:r, c:c, td:td};
    td.classList.add('ws-start');
    return;
  }

  // Second tap — check range
  var sr = s.start.r; var sc = s.start.c;
  if (s.start.td) s.start.td.classList.remove('ws-start');

  // Clear any previous selection highlight
  document.querySelectorAll('#wsb-' + sk + ' td.ws-selected').forEach(function(el){ el.classList.remove('ws-selected'); });

  // Determine direction
  var positions = [];
  if (r === sr) {
    // Horizontal
    var minC = Math.min(c,sc); var maxC = Math.max(c,sc);
    for (var i=minC;i<=maxC;i++) positions.push({r:r,c:i});
  } else if (c === sc) {
    // Vertical
    var minR = Math.min(r,sr); var maxR = Math.max(r,sr);
    for (var i=minR;i<=maxR;i++) positions.push({r:i,c:c});
  } else {
    // Not aligned — reset
    s.start = null; return;
  }

  // Highlight selection
  positions.forEach(function(p) {
    var el = document.querySelector('#wsb-' + sk + ' td[data-r="' + p.r + '"][data-c="' + p.c + '"]');
    if (el && !el.classList.contains('ws-found')) el.classList.add('ws-selected');
  });

  // Check if selection matches a word
  var selLetters = positions.map(function(p){ return s.grid[p.r][p.c].letter; }).join('');
  var selLettersRev = selLetters.split('').reverse().join('');
  var matched = false;

  s.words.forEach(function(w,wi) {
    if (w.found) return;
    var wStr = w.letters.join('');
    if (selLetters === wStr || selLettersRev === wStr) {
      w.found = true; s.found++;
      positions.forEach(function(p){
        s.grid[p.r][p.c].found = true;
        var el = document.querySelector('#wsb-' + sk + ' td[data-r="'+p.r+'"][data-c="'+p.c+'"]');
        if (el) { el.classList.remove('ws-selected'); el.classList.add('ws-found'); }
      });
      // Update word list
      var wordEls = document.querySelectorAll('#wsb-' + sk + ' .ws-word');
      if (wordEls[wi]) wordEls[wi].classList.add('found');
      // Update progress
      var prog = document.querySelector('#wsb-' + sk + ' .ws-progress');
      if (prog) prog.textContent = s.found + ' / ' + s.words.length + ' words found';
      if (s.found === s.words.length) {
        setTimeout(function(){
          var body = document.getElementById('wsb-' + sk);
          if (body) body.innerHTML += '<div style="text-align:center;padding:10px;color:#2a7a2a;font-weight:600;font-size:.9rem">✓ All words found!</div>';
        }, 300);
      }
      matched = true;
    }
  });

  if (!matched) {
    // Clear selection after short delay
    setTimeout(function(){
      document.querySelectorAll('#wsb-' + sk + ' td.ws-selected').forEach(function(el){ el.classList.remove('ws-selected'); });
    }, 400);
  }
  s.start = null;
}

function wsNew(btn) {
  var sk = btn.dataset.sk;
  delete _ws[sk];
  wsInit(sk);
}

function wsReveal(btn) {
  var sk = btn.dataset.sk; var s = _ws[sk]; if (!s) return;
  s.words.forEach(function(w) {
    if (!w.found && w.positions) {
      w.found = true; s.found++;
      w.positions.forEach(function(p){ s.grid[p.r][p.c].found = true; });
    }
  });
  wsRender(sk);
}

function toggleWP(btn){
  var sk=btn.dataset.sk;
  var body=document.getElementById('wpb-'+sk); if(!body) return;
  var open=body.style.display!=='none';
  body.style.display=open?'none':'block';
  btn.textContent=open?'✏️ Practice':'Hide';
  if(!open&&!_wcs[sk]) setTimeout(function(){wcInit(sk);},30);
}
function wcInit(sk){
  var canvas=document.getElementById('wcanvas-'+sk); if(!canvas) return;
  var vocab=_wcVocab[sk]; if(!vocab||!vocab.length) return;
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=Math.round(rect.width*dpr);
  canvas.height=Math.round(rect.height*dpr);
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineCap='round'; ctx.lineJoin='round';
  _wcs[sk]={idx:0,vocab:vocab,drawing:false,lastX:0,lastY:0,ctx:ctx,dpr:dpr,W:rect.width,H:rect.height};
  wcGuides(sk);
  wcDisplay(sk);
  // Pointer events — covers mouse, stylus (pen), and finger (touch)
  function pd(e){wcDown(e,sk);}
  function pm(e){wcMove(e,sk);}
  function pu(e){wcUp(e,sk);}
  canvas.addEventListener('pointerdown',pd,{passive:false});
  canvas.addEventListener('pointermove',pm,{passive:false});
  canvas.addEventListener('pointerup',pu,{passive:false});
  canvas.addEventListener('pointercancel',pu,{passive:false});
  canvas.addEventListener('pointerleave',pu,{passive:false});
}
function wcGuides(sk){
  var s=_wcs[sk]; if(!s||!s.ctx) return;
  var ctx=s.ctx; var W=s.W; var H=s.H;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  // Lined-paper guide lines
  ctx.strokeStyle='#e0dcd0'; ctx.lineWidth=1; ctx.setLineDash([]);
  [H*0.22, H*0.52, H*0.82].forEach(function(y){
    ctx.beginPath(); ctx.moveTo(12,y); ctx.lineTo(W-12,y); ctx.stroke();
  });
  // RTL direction hint arrow
  ctx.setLineDash([]);
  ctx.fillStyle='#c8c4b8'; ctx.font='10px sans-serif'; ctx.textAlign='right';
  ctx.fillText('← right to left',W-10,H-5);
  ctx.restore();
}
function wcPos(e,canvas){
  var r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function wcDown(e,sk){
  e.preventDefault();
  var s=_wcs[sk]; if(!s) return;
  s.drawing=true;
  e.target.setPointerCapture(e.pointerId);
  var p=wcPos(e,e.target);
  s.lastX=p.x; s.lastY=p.y;
  var pressure=(e.pressure>0)?e.pressure:0.5;
  s.ctx.beginPath();
  s.ctx.moveTo(p.x,p.y);
  s.ctx.lineWidth=1.5+pressure*3;
  s.ctx.strokeStyle='#1a1a2e';
}
function wcMove(e,sk){
  e.preventDefault();
  var s=_wcs[sk]; if(!s||!s.drawing) return;
  var p=wcPos(e,e.target);
  var pressure=(e.pressure>0)?e.pressure:0.5;
  s.ctx.lineWidth=1.5+pressure*3;
  var mx=(s.lastX+p.x)/2; var my=(s.lastY+p.y)/2;
  s.ctx.quadraticCurveTo(s.lastX,s.lastY,mx,my);
  s.ctx.stroke();
  s.ctx.beginPath(); s.ctx.moveTo(mx,my);
  s.lastX=p.x; s.lastY=p.y;
}
function wcUp(e,sk){
  var s=_wcs[sk]; if(!s) return;
  s.drawing=false;
}
function wcClear(btn){
  var sk=btn.dataset.sk; wcGuides(sk);
}
function wcPrev(btn){
  var sk=btn.dataset.sk; var s=_wcs[sk]; if(!s) return;
  s.idx=(s.idx-1+s.vocab.length)%s.vocab.length;
  wcDisplay(sk); wcGuides(sk);
  document.getElementById('wp-en-'+sk).textContent='';
}
function wcNext(btn){
  var sk=btn.dataset.sk; var s=_wcs[sk]; if(!s) return;
  s.idx=(s.idx+1)%s.vocab.length;
  wcDisplay(sk); wcGuides(sk);
  document.getElementById('wp-en-'+sk).textContent='';
}
function wcDisplay(sk){
  var s=_wcs[sk]; if(!s||!s.vocab.length) return;
  var item=s.vocab[s.idx];
  var w=document.getElementById('wp-word-'+sk);
  var c=document.getElementById('wp-count-'+sk);
  if(w) w.textContent=item.ar;

}
function wcReveal(btn){
  var sk=btn.dataset.sk; var s=_wcs[sk]; if(!s) return;

// SCREEN RENDERERS

function weekAllowed(level, weekNum, mode) {
  if (level === 0) return true;               // Foundation: all modes, all weeks
  if (level === 1) {
    if (mode === 'junior')  return weekNum <= 8;
    if (mode === 'middle')  return weekNum <= 15;
    return true;                              // senior: all 30 weeks
  }
  if (level === 2) {
    if (mode === 'junior')  return false;
    if (mode === 'middle')  return weekNum === 1 || weekNum === 3; // Inna + direct object only
    return weekNum !== 2;                     // senior: skip الحال (W2)
  }
  return mode === 'senior';                   // Levels 3-4: senior only
}
function maxAllowedWeek(level, mode) {
  var ld = CURR.find(function(l){return l.level===level;}); if (!ld) return 0;
  var allowed = ld.weeks.filter(function(w){return weekAllowed(level,w.w,mode);});
  return allowed.length ? allowed[allowed.length-1].w : 0;
}
function renderDashboard() {
  var p = APP.progress; var s = APP.student; if (!p || !s) return;
  var ld = CURR.find(function(l){return l.level===p.level;});
  var totalWeeks = ld ? ld.weeks.length : 30;
  var pct = Math.round(((p.week-1)/totalWeeks)*100);
  var weekData = ld ? ld.weeks.find(function(w){return w.w===p.week;}) : null;
  var totalDone = Object.keys(p.done).filter(function(k){return k.startsWith("L"+p.level+"_");}).length;

  var dots = "";
  var _mode = p.mode || getMode(s.grade);
  if (ld) {
    ld.weeks.forEach(function(w) {
      var allowed = weekAllowed(p.level, w.w, _mode);
      var allDone = w.sessions.every(function(ses){return p.done["L"+p.level+"_"+w.w+"_"+ses.id];});
      var anyDone = w.sessions.some(function(ses){return p.done["L"+p.level+"_"+w.w+"_"+ses.id];});
      var cls = allDone ? "done" : w.w===p.week ? "current" : anyDone ? "partial" : "";
      if (allowed) {
        dots += '<button class="week-dot ' + cls + '" data-lv="' + p.level + '" data-wk="' + w.w + '" onclick="openWeekFromEl(this)" title="' + esc(w.titleEn||"Week "+w.w) + '">' + w.w + '</button>';
      } else {
        dots += '<span class="week-dot locked" title="Not yet — advance a grade first">🔒</span>';
      }
    });
  }

  var sesButtons = "";
  if (weekData) {
    weekData.sessions.forEach(function(ses, i) {
      var sesKey = "L"+p.level+"_"+p.week+"_"+ses.id;
      var done = !!p.done[sesKey];
      sesButtons += '<button class="btn ' + (done?"btn-outline":"btn-primary") + '" data-lv="' + p.level + '" data-wk="' + weekData.w + '" onclick="openWeekFromEl(this)">' + (done?"&#10003; ":"") + ses.labelEn + '</button>';
    });
  }

  $("dash-content").innerHTML =
    '<div class="dash-hero">' +
      '<div class="dash-student-name">' + esc(s.name) + '</div>' +
      '<div class="dash-level"><strong>' + (ld?ld.titleEn:(_lvNames[p.level]||"Level "+p.level)) + '</strong> &middot; ' + modeLabelFull(p.mode) + ' &middot; Week ' + p.week + ' of ' + totalWeeks + '</div>' +
      '<div class="progress-bar-wrap">' +
        '<div class="progress-bar-label"><span>Level ' + p.level + ' progress</span><span>' + pct + '%</span></div>' +
        '<div class="progress-bar-track"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
    '</div>' +
    '<div class="dash-stats">' +
      '<div class="stat-card"><div class="stat-val">' + p.level + '</div><div class="stat-label">Level</div></div>' +
      '<div class="stat-card"><div class="stat-val">' + p.week + '</div><div class="stat-label">Week</div></div>' +
      '<div class="stat-card"><div class="stat-val">' + (p.streak||0) + '</div><div class="stat-label">Streak &#128293;</div></div>' +
    '</div>' +
    '<div class="week-strip-wrap">' +
      '<div class="week-strip-title">Level ' + p.level + ' &mdash; ' + totalWeeks + ' weeks</div>' +
      '<div class="week-strip">' + dots + '</div>' +
    '</div>' +
    '<div class="dash-section-title">This week &mdash; Week ' + p.week + '</div>' +
    (weekData ?
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">' + sesButtons + '</div>' :
      '<p style="color:var(--ink3);font-size:.9rem">No week data found.</p>') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">' +
      '<button class="btn btn-gold" data-lv="' + p.level + '" data-wk="' + p.week + '" onclick="openWeekFromEl(this)">&#128218; Open this week</button>' +
      '<button class="btn btn-outline" onclick="goReport()">&#128202; Progress report</button>' +
      (p.level<4 ? '<button class="btn btn-outline" onclick="advanceLevel()" style="font-size:.8rem">Advance to Level '+(p.level+1)+'</button>' : '') +
    '</div>';
}

function renderSession(lNum, wNum) {
  var p = APP.progress;
  var ld = CURR.find(function(l){return l.level===lNum;}); if (!ld) return;
  var week = ld.weeks.find(function(w){return w.w===wNum;});
  if (!week) { $("session-list").innerHTML = '<p style="color:var(--ink3)">Week data not found.</p>'; return; }
  var mode = p ? p.mode : "senior";
  $("session-nav-label").textContent = "Level " + lNum + " · Week " + wNum + " — " + (week.titleEn||week.title||"");
  $("session-banner").innerHTML = "";
  $("session-list").innerHTML = week.sessions.map(function(ses,i){
    return buildCard(ses, week, lNum, i, week.sessions.length, p, mode);
  }).join("");
}

function renderReport() {
  var s = APP.student; var p = APP.progress;
  if (!s||!p) { $("report-content").innerHTML = "<p>No data.</p>"; return; }
  var ld = CURR.find(function(l){return l.level===p.level;});
  var totalDone = Object.keys(p.done).length;
  var log = Object.entries(p.done)
    .map(function(e){return{key:e[0],date:e[1].date||"?"};})
    .sort(function(a,b){return b.date.localeCompare(a.date);})
    .slice(0,20);

  $("report-content").innerHTML =
    '<div class="report-header">' +
      '<div class="report-name">' + esc(s.name) + '</div>' +
      '<div class="report-sub">Grade ' + s.grade + ' &middot; ' + modeLabelFull(p.mode) + ' &middot; ' + (ld?ld.titleEn:(_lvNames[p.level]||"Level "+p.level)) + '</div>' +
      '<div class="report-sub" style="margin-top:4px">Generated ' + today() + '</div>' +
    '</div>' +
    '<div class="report-section">' +
      '<div class="report-section-title">Progress summary</div>' +
      '<div class="report-grid">' +
        '<div class="report-stat"><div class="report-stat-val">' + p.level + '</div><div class="report-stat-label">Level</div></div>' +
        '<div class="report-stat"><div class="report-stat-val">' + p.week + '</div><div class="report-stat-label">Week</div></div>' +
        '<div class="report-stat"><div class="report-stat-val">' + totalDone + '</div><div class="report-stat-label">Sessions done</div></div>' +
        '<div class="report-stat"><div class="report-stat-val">' + (p.streak||0) + '</div><div class="report-stat-label">Streak</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="report-section">' +
      '<div class="report-section-title">Session log (recent 20)</div>' +
      (log.length ? log.map(function(l){
        return '<div class="log-item"><span class="log-strand">' +
          l.key.replace(/^L(\d+)/,function(m,n){return _lvNames[parseInt(n)]||"Level "+n;}).replace("_W"," · Week ").replace(/_/g," · ") +
          '</span><span class="log-date">' + l.date + '</span></div>';
      }).join("") : '<p style="color:var(--ink3);font-size:.88rem">No sessions recorded yet.</p>') +
    '</div>' +
    '<div class="report-section" style="border-top:2px solid var(--gold)">' +
      '<div class="report-section-title">Facilitator notes</div>' +
      '<textarea style="width:100%;border:1px solid var(--border);border-radius:6px;padding:10px;font-family:DM Sans,sans-serif;font-size:.9rem;min-height:80px;background:var(--p);color:var(--ink)" placeholder="Add notes before printing…"></textarea>' +
    '</div>';
}

// ROUTING
function showScreen(id) {
  ["screen-no-student","screen-dashboard","screen-session","screen-report"].forEach(function(s){$(s).classList.add("hidden");});
  $(id).classList.remove("hidden");
  var on = id !== "screen-no-student" && APP.student;
  $("btn-report").style.display = on ? "" : "none";
  $("btn-switch").style.display = on ? "" : "none";
}
function goHome(){ APP.student=null; APP.progress=null; renderSelector(); showScreen("screen-no-student"); }
function goDash(){ renderDashboard(); showScreen("screen-dashboard"); }
function goReport(){ renderReport(); showScreen("screen-report"); }

function openWeekFromEl(el) {
  var lNum = parseInt(el.dataset.lv);
  var wNum = parseInt(el.dataset.wk);
  openWeek(lNum, wNum);
}
function openWeek(lNum, wNum) {
  APP.viewWeek = {level:lNum, week:wNum};
  renderSession(lNum, wNum);
  showScreen("screen-session");
}
function markDone(btn) {
  var sesKey = btn.dataset.key;
  if (!APP.progress || !sesKey) return;
  var p = APP.progress;
  p.done[sesKey] = {date:today(), score:null};
  var t = today(), wkAgo = new Date(Date.now()-86400000*7).toISOString().slice(0,10);
  if (p.lastDate !== t) { p.streak = (p.lastDate >= wkAgo ? (p.streak||0)+1 : 1); p.lastDate = t; }
  Store.saveProgress(APP.student.id, p);
  btn.textContent = "&#10003; Complete"; btn.disabled = true; btn.classList.add("done");
  checkWeekComplete();
}
function checkWeekComplete() {
  var p = APP.progress; if (!p || !APP.viewWeek) return;
  var lv = APP.viewWeek.level, wk = APP.viewWeek.week;
  var ld = CURR.find(function(l){return l.level===lv;}); if (!ld) return;
  var week = ld.weeks.find(function(w){return w.w===wk;}); if (!week) return;
  var allDone = week.sessions.every(function(s){return p.done["L"+lv+"_"+wk+"_"+s.id];});
  if (allDone) {
    var banner = $("session-banner");
    if (banner && !banner.innerHTML) {
      banner.innerHTML = '<div class="week-banner"><h3>Week ' + wk + ' complete! &#127775;</h3>' +
        '<p>All sessions done.</p>' +
        '<button class="btn btn-primary" style="margin-top:12px" onclick="advanceWeek()">&#8594; Next week</button></div>';
    }
  }
}
function advanceWeek() {
  var p = APP.progress; if (!p) return;
  var ld = CURR.find(function(l){return l.level===p.level;}); if (!ld) return;
  var _mode = p.mode || getMode(APP.student.grade);
  // Find next allowed week above current
  var nextWeeks = ld.weeks.filter(function(w){ return w.w > p.week && weekAllowed(p.level, w.w, _mode); });
  if (nextWeeks.length) {
    p.week = nextWeeks[0].w;
    Store.saveProgress(APP.student.id, p); goDash();
  } else if (p.week < ld.weeks.length) {
    // At grade cap — show lock notice instead of advancing
    var banner = document.getElementById('session-banner');
    if (banner) banner.innerHTML = '<div style="background:#7B5EA7;color:#fff;padding:16px;border-radius:10px;text-align:center;margin:12px 0"><strong>Grade level reached 🔒</strong><br>All weeks for your grade are complete. Speak to your teacher to unlock the next level.</div>';
  } else { showLevelComplete(); }
}
var _lvNames=['Beginners','Explorer','Builder','Reader','Scholar'];
function advanceLevel() {
  var p = APP.progress; if (!p || p.level>=4) return;
  if (!confirm("Advance " + APP.student.name + " to " + (_lvNames[p.level+1]||"Level "+(p.level+1)) + "? Review the completion report first.")) return;
  p.level++; p.week=1; Store.saveProgress(APP.student.id, p); renderDashboard();
}
function showLevelComplete() {
  var banner = $("session-banner");
  if (banner) banner.innerHTML = '<div class="week-banner" style="background:var(--teal);color:#fff">' +
    '<h3 style="color:#fff">Level ' + APP.progress.level + ' Complete! &#127891;</h3>' +
    '<p style="color:rgba(255,255,255,.8)">Review the progress report with your facilitator before advancing.</p></div>';
}
async function init() {
  // Read active student set by HOW platform
  var raw = null;
  try { raw = JSON.parse(localStorage.getItem('how_active_student') || 'null'); } catch(e) {}

  if (!raw || !raw.id) {
    showScreen('screen-no-student');
    return;
  }

  APP.student = {
    id:    raw.id,
    name:  raw.name,
    grade: raw.current_grade || raw.grade || '7',
    mode:  getMode(raw.current_grade || raw.grade || '7')
  };

  // Load progress: Supabase first, localStorage fallback, fresh default last
  var p = await pullArabicProgress();
  if (!p) p = Store.getProgress(APP.student.id);
  if (!p) p = Store.defaultProgress(0, APP.student.mode);
  APP.progress = p;

  // Cache to localStorage for offline use
  Store.getProgress(APP.student.id) || localStorage.setItem('how_arabic_p_' + APP.student.id, JSON.stringify(p));

  renderDashboard();
  showScreen('screen-dashboard');
}
init();

</script>
</body>
</html>
