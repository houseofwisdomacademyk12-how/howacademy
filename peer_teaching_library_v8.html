<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المكتبة — The Peer Teaching Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1a2e; --ink-2:#2e2e44; --ink-3:#5a5a78; --ink-4:#9a9ab0; --ink-5:#d0d0e0;
  --parchment:#f9f7f4; --parchment-2:#f0ece4; --parchment-3:#e4ddd0;
  --gold:#d4af37; --gold-l:#e8cc70; --gold-pale:#fdf5d0;
  --teal:#1d6f6f; --teal-l:#d0eaea; --teal-d:#1a4a3a;
  --coral:#8b3a2a; --coral-l:#f5e0da;
  --blue:#1e4a7a; --blue-l:#ddeaf8;
  --purple:#4a3580; --purple-l:#eceaf8;
  --green:#3a6b2a; --green-l:#dcecd8;
  --r:8px; --rl:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--parchment);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.6}

/* ── LAYOUT ── */
.app{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
.topnav{background:var(--ink);padding:0 28px;display:flex;align-items:center;gap:0;height:52px;position:sticky;top:0;z-index:50}
.topnav-logo{font-family:'Amiri',serif;font-size:17px;color:var(--gold);margin-right:28px;white-space:nowrap}
.topnav-tabs{display:flex;gap:0;height:100%}
.topnav-tab{font-size:13px;padding:0 16px;color:rgba(255,255,255,.55);cursor:pointer;display:flex;align-items:center;border-bottom:2px solid transparent;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:'DM Sans',sans-serif;white-space:nowrap}
.topnav-tab:hover{color:rgba(255,255,255,.85)}
.topnav-tab.active{color:var(--gold-l);border-bottom-color:var(--gold)}
.topnav-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.topnav-btn{font-size:12px;padding:6px 14px;border-radius:var(--r);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.topnav-btn:hover{background:rgba(255,255,255,.18)}
.topnav-btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.topnav-btn.gold:hover{background:var(--gold-l)}

.body-grid{display:grid;grid-template-columns:280px 1fr}
.sidebar{background:var(--parchment-2);border-right:1px solid var(--ink-5);padding:20px 0;height:calc(100vh - 52px);position:sticky;top:52px;overflow-y:auto}
.main-area{padding:28px 32px;min-height:calc(100vh - 52px);max-width:860px}

/* sidebar */
.sb-label{font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-4);padding:0 16px;margin-bottom:6px;display:block}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 16px;cursor:pointer;font-size:13px;color:var(--ink-3);width:100%;text-align:left;border:none;background:none;font-family:'DM Sans',sans-serif;transition:all .12s;border-radius:0}
.sb-item:hover{background:var(--parchment-3);color:var(--ink)}
.sb-item.active{background:var(--gold-pale);color:var(--gold);font-weight:500;border-right:2px solid var(--gold)}
.sb-count{margin-left:auto;font-size:11px;color:var(--ink-5);background:var(--parchment-3);padding:1px 7px;border-radius:99px}
.sb-divider{height:1px;background:var(--ink-5);margin:12px 0}

/* discipline dots */
.disc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.disc-math{background:#534AB7} .disc-sky{background:#0F6E56}
.disc-eng{background:#854F0B} .disc-med{background:#185FA5}
.disc-hum{background:#712B13}

/* ── SEARCH BAR ── */
.search-bar{display:flex;gap:8px;margin-bottom:20px;align-items:center}
.search-input{flex:1;border:1px solid var(--ink-5);border-radius:var(--r);padding:9px 14px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--ink);background:white;transition:border-color .15s}
.search-input:focus{outline:none;border-color:var(--gold)}
.filter-pill{font-size:12px;padding:6px 13px;border-radius:99px;border:1px solid var(--ink-5);background:white;cursor:pointer;color:var(--ink-3);transition:all .12s;white-space:nowrap;font-family:'DM Sans',sans-serif}
.filter-pill:hover{border-color:var(--ink-4);color:var(--ink)}
.filter-pill.on{background:var(--gold-pale);border-color:var(--gold-l);color:var(--gold);font-weight:500}

/* ── TEACHING CARD ── */
.teaching-grid{display:grid;gap:12px}
.t-card{background:white;border:1px solid var(--ink-5);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:border-color .15s}
.t-card:hover{border-color:var(--gold-l)}
.t-card-top{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.t-card-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0}
.t-card-meta{flex:1;min-width:0}
.t-card-title{font-size:14px;font-weight:500;color:var(--ink);margin-bottom:3px;line-height:1.3}
.t-card-who{font-size:12px;color:var(--ink-4)}
.t-card-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid;font-weight:500;white-space:nowrap}
.badge-grade{background:var(--gold-pale);color:var(--gold);border-color:var(--gold-l)}
.badge-subject{background:var(--blue-l);color:var(--blue);border-color:#85B7EB}
.badge-disc-math{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC}
.badge-disc-sky{background:#E1F5EE;color:#085041;border-color:#5DCAA5}
.badge-disc-eng{background:#FAEEDA;color:#633806;border-color:#EF9F27}
.badge-disc-med{background:#E6F1FB;color:#0C447C;border-color:#85B7EB}
.badge-disc-hum{background:#FAECE7;color:#712B13;border-color:#F5C4B3}
.badge-new{background:var(--green-l);color:var(--green);border-color:#97C459}
.badge-scholar{background:var(--parchment-2);color:var(--ink-3);border-color:var(--ink-5)}
.t-card-preview{padding:0 16px 14px;font-size:13px;color:var(--ink-3);line-height:1.65}
.t-card-footer{padding:10px 16px;border-top:1px solid var(--ink-5);background:var(--parchment-2);display:flex;align-items:center;gap:12px}
.t-card-stat{font-size:11px;color:var(--ink-4);display:flex;align-items:center;gap:4px}
.t-card-actions{margin-left:auto;display:flex;gap:6px}
.t-card-btn{font-size:11px;padding:4px 11px;border-radius:var(--r);border:1px solid var(--ink-5);background:white;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--ink-3);transition:all .12s}
.t-card-btn:hover{background:var(--parchment-2);border-color:var(--ink-4)}
.t-card-btn.primary{background:var(--gold-pale);border-color:var(--gold-l);color:var(--gold)}

/* ── DETAIL VIEW ── */
.detail-back{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-4);cursor:pointer;margin-bottom:18px;background:none;border:none;font-family:'DM Sans',sans-serif;padding:0}
.detail-back:hover{color:var(--ink)}
.detail-header{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
.detail-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;flex-shrink:0}
.detail-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--ink);margin-bottom:4px;line-height:1.2}
.detail-who{font-size:13px;color:var(--ink-4)}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.detail-section{margin-bottom:22px}
.detail-section-label{font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-4);margin-bottom:10px;display:block}
.detail-body{font-size:14px;color:var(--ink-2);line-height:1.8}
.detail-quote{font-family:'DM Serif Display',serif;font-style:italic;font-size:15px;color:var(--ink);border-left:3px solid var(--gold);padding-left:12px;margin:12px 0;line-height:1.6}
.detail-divider{border:none;border-top:1px solid var(--ink-5);margin:18px 0}

/* transcript bubbles */
.transcript{display:grid;gap:8px;margin-top:10px}
.bubble{padding:10px 14px;border-radius:var(--rl);max-width:88%;font-size:13px;line-height:1.65}
.bubble.teacher{background:var(--gold-pale);border:1px solid var(--gold-l);color:var(--ink-2);margin-right:auto}
.bubble.student-q{background:var(--blue-l);border:1px solid #85B7EB;color:var(--blue);margin-left:auto}
.bubble.student-q::before{content:'Student question: ';font-weight:500;display:block;font-size:11px;margin-bottom:3px;opacity:.7}
.bubble.teacher::before{content:'Peer teacher: ';font-weight:500;display:block;font-size:11px;margin-bottom:3px;opacity:.7}
.bubble.unanswered{background:var(--coral-l);border:1px solid #F0997B;color:var(--coral);margin-left:auto}
.bubble.unanswered::before{content:'Unanswered question: ';font-weight:500;display:block;font-size:11px;margin-bottom:3px;opacity:.7}

/* ── RECORD FLOW ── */
.record-steps{display:flex;gap:0;margin-bottom:24px;border-radius:var(--r);overflow:hidden;border:1px solid var(--ink-5)}
.rec-step{flex:1;padding:10px 8px;text-align:center;background:white;border-right:1px solid var(--ink-5);cursor:pointer;transition:all .15s}
.rec-step:last-child{border-right:none}
.rec-step:hover{background:var(--parchment-2)}
.rec-step.active-step{background:var(--gold-pale)}
.rec-step.done-step{background:var(--green-l)}
.rec-step-n{font-size:16px;font-weight:500;color:var(--ink-4)}
.rec-step.active-step .rec-step-n{color:var(--gold)}
.rec-step.done-step .rec-step-n{color:var(--green)}
.rec-step-l{font-size:10px;color:var(--ink-4);line-height:1.3;margin-top:2px}
.rec-step.active-step .rec-step-l{color:var(--gold)}

.form-field{margin-bottom:14px}
.form-label{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);margin-bottom:5px;display:block}
input.field,select.field,textarea.field{width:100%;border:1px solid var(--ink-5);border-radius:var(--r);padding:9px 12px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--parchment);transition:border-color .15s}
input.field:focus,select.field:focus,textarea.field:focus{outline:none;border-color:var(--gold);background:white}
textarea.field{resize:vertical;line-height:1.65}

/* ── MURSHID PANEL ── */
.murshid-wrap{background:var(--gold-pale);border:1px solid var(--gold-l);border-radius:var(--rl);padding:16px;margin-bottom:16px}
.m-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.m-avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Amiri',serif;font-size:13px;color:var(--parchment);flex-shrink:0}
.m-name{font-size:12px;font-weight:500;color:var(--gold)}
.m-sub{font-size:11px;color:var(--ink-4)}
.m-text{font-family:'DM Serif Display',serif;font-style:italic;font-size:13px;color:var(--ink-2);line-height:1.75}
.dot-pulse{display:flex;gap:4px;align-items:center}
.dot-pulse span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 1.2s ease-in-out infinite}
.dot-pulse span:nth-child(2){animation-delay:.2s} .dot-pulse span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* ── MISC ── */
.page-kicker{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-4);margin-bottom:4px}
.page-title{font-family:'DM Serif Display',serif;font-size:24px;color:var(--ink);font-weight:400;line-height:1.2;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--ink-3);margin-bottom:20px;line-height:1.6}
.page-header{margin-bottom:22px}
.btn{font-size:12px;padding:7px 15px;border-radius:var(--r);border:1px solid var(--ink-5);background:white;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--ink-3);transition:all .12s}
.btn:hover{background:var(--parchment-2);border-color:var(--ink-4)}
.btn.primary{background:var(--gold-pale);border-color:var(--gold-l);color:var(--gold);font-weight:500}
.btn.primary:hover{background:var(--gold-l)}
.btn.teal{background:var(--teal-l);border-color:var(--teal);color:var(--teal)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty-state{text-align:center;padding:48px 24px;color:var(--ink-4)}
.empty-state-icon{font-size:36px;margin-bottom:12px;color:var(--ink-5)}
.empty-state-title{font-size:15px;color:var(--ink-3);margin-bottom:6px}
.empty-state-sub{font-size:13px;line-height:1.6}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.stat-card{background:var(--parchment-2);border-radius:var(--r);padding:12px;text-align:center}
.stat-n{font-size:20px;font-weight:500;color:var(--ink);margin-bottom:2px}
.stat-l{font-size:11px;color:var(--ink-4);line-height:1.4}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--parchment);padding:10px 18px;border-radius:var(--r);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(26,18,8,.5);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--parchment);border:1px solid var(--ink-5);border-radius:var(--rl);padding:28px;width:480px;max-width:95vw}
.modal-title{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:8px}
.modal-sub{font-size:13px;color:var(--ink-3);margin-bottom:18px;line-height:1.6}
.highlight{background:var(--gold-pale);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;font-size:13px;color:var(--ink-2);line-height:1.7;margin:12px 0}

/* ═══════════════════════════════════════════════════
   PEER TEACHING LIBRARY — MOBILE RESPONSIVE
   ═══════════════════════════════════════════════════ */
@media(max-width:767px){

  /* Top nav */
  .topnav{ padding:0 12px; height:48px; }
  .topnav-tabs{ overflow-x:auto; }
  .topnav-tab{ font-size:12px; padding:0 10px; white-space:nowrap; }
  .topnav-right{ gap:6px; }

  /* Body grid — single column */
  .body-grid{ grid-template-columns:1fr !important; }

  /* Sidebar — horizontal scrolling strip */
  .sidebar{
    position: static;
    height: auto;
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0;
    border-right: none;
    border-bottom: 1px solid var(--ink-5);
  }
  .sb-section-label{ display:none; }
  .sb-item{
    white-space: nowrap;
    padding: 10px 12px;
    font-size: 12px;
    min-height: 44px;
    border-right: 1px solid var(--ink-5);
    gap: 6px;
  }
  .sb-divider{ width:1px; height:100%; margin:0; }

  /* Main area */
  .main-area{ padding:14px; max-width:100%; }
  .page-title{ font-size:20px; }

  /* Teaching cards */
  .t-card-title{ font-size:13px; }
  .t-card-preview{ font-size:12px; }
  .t-card-footer{ flex-wrap:wrap; gap:8px; }
  .t-card-actions{ flex-wrap:wrap; }

  /* Detail view */
  .detail-title{ font-size:18px; }
  .detail-header{ flex-direction:column; gap:10px; }
  .detail-body{ font-size:13px; }
  .detail-back{ font-size:12px; }

  /* Transcript bubbles */
  .bubble{ max-width:95%; font-size:12px; }

  /* Record steps — scrollable */
  .record-steps{ overflow-x:auto; white-space:nowrap; }

  /* Form fields */
  .field{ font-size:14px !important; } /* prevent iOS zoom */
  input, textarea, select{ font-size:14px !important; }

  /* Search bar */
  .search-bar{ flex-wrap:wrap; gap:6px; }

  /* Modal — full width */
  .modal, [class*="-modal"]{
    width: calc(100vw - 20px) !important;
    max-width: none !important;
  }

  /* Stat cards */
  .stat-card{ padding:12px; }
  .stat-n{ font-size:24px; }

  /* Buttons */
  button:not(.topnav-tab):not(.sb-item):not(.t-card-stat){
    min-height:40px;
  }
}

@media(min-width:768px) and (max-width:1100px){
  .body-grid{ grid-template-columns:220px 1fr; }
  .main-area{ padding:20px 22px; max-width:100%; }
}

/* ── HOW Approach — TeachIt flow ──────────────────────────────────────────── */
.how-slide-header{font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-4);margin-bottom:4px}
.how-slide-type{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:16px}
/* position buttons removed — flat approach list */
.how-approach-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.how-app-btn{padding:12px 16px;border:2px solid var(--ink-5);border-radius:8px;
  background:white;cursor:pointer;font-size:13px;color:var(--ink);text-align:left;
  transition:.15s;line-height:1.5}
.how-app-btn:hover{border-color:var(--teal);background:#f0fafa}
.how-app-btn.selected{border-color:var(--teal);background:#e6f5f5;font-weight:600}
.how-work-block{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.how-work-label{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--teal);margin-bottom:4px}
.how-work-field{width:100%;padding:10px 12px;border:1.5px solid var(--ink-5);
  border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;
  min-height:60px;line-height:1.6;color:var(--ink)}
.how-work-field:focus{outline:none;border-color:var(--teal)}
.how-para-live{background:#f9f7f4;border:1px solid #e4ddd0;border-radius:8px;
  padding:14px 16px;margin-bottom:16px;min-height:60px;font-size:13px;
  line-height:1.75;color:var(--ink);font-style:italic;transition:.2s}
.how-para-label{font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:.06em;color:#aaa;margin-bottom:6px}
.how-canvas-wrap{border:1.5px solid var(--ink-5);border-radius:8px;
  overflow:hidden;margin-bottom:8px;background:#fff;touch-action:none}
.how-canvas{width:100%;height:160px;cursor:crosshair;display:block}
.how-canvas-tools{display:flex;gap:6px;align-items:center;margin-bottom:12px;
  flex-wrap:wrap}
.how-canvas-tool{padding:4px 10px;border:1px solid var(--ink-5);border-radius:6px;
  background:white;font-size:11px;cursor:pointer}
.how-canvas-tool:hover{border-color:var(--teal)}
.how-draw-label{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:#9c6b2e;margin-bottom:6px}
.how-slide-nav{display:flex;align-items:center;justify-content:space-between;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--ink-5)}
.how-slide-dots{display:flex;gap:5px}
.how-slide-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-5);transition:.15s}
.how-slide-dot.done{background:var(--teal)}
.how-slide-dot.current{background:var(--ink);transform:scale(1.3)}
.how-loading{display:flex;align-items:center;gap:8px;color:var(--ink-4);
  font-size:13px;padding:20px 0}
.how-spinner{width:18px;height:18px;border:2px solid var(--ink-5);
  border-top-color:var(--teal);border-radius:50%;animation:howspin .7s linear infinite}
@keyframes howspin{to{transform:rotate(360deg)}}
@media(max-width:600px){
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="toast" id="toast"></div>



<div class="app">
  <nav class="topnav">
    <span class="topnav-logo">المكتبة</span>
    <div class="topnav-tabs">
      <button class="topnav-tab active" data-tab="browse" onclick="switchTab(this)">Browse library</button>
      <button class="topnav-tab" data-tab="record" onclick="switchTab(this)">Record a teaching</button>
      <button class="topnav-tab" data-tab="mine" onclick="switchTab(this)">My teachings</button>
      <button class="topnav-tab" data-tab="about" onclick="switchTab(this)">How it works</button>
    </div>
    <div class="topnav-right">
      
      <button class="topnav-btn gold" onclick="switchTab(document.querySelector('[data-tab=record]'))">Record teaching +</button>
    </div>

<script>
// ── STORAGE ──────────────────────────────────────────────────────────
const S = {
  get(k){try{return JSON.parse(localStorage.getItem('ptl_'+k))}catch{return null}},
  set(k,v){localStorage.setItem('ptl_'+k,JSON.stringify(v))},
};
function getTeachings(){return S.get('teachings')||[]}

// ── Delete a teaching (local + Supabase) ─────────────────────────────────
async function deleteTeaching(id, evt){
  if(evt){ evt.stopPropagation(); }
  if(!confirm('Delete this teaching? This cannot be undone.')) return;

  // Remove from localStorage
  var teachings = getTeachings().filter(function(t){ return t.id !== id; });
  saveTeachings(teachings);

  // Remove from Supabase only if id is a real UUID (not a local lg/teach_ id)
  var isUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id);
  if(isUUID){
    try{
      var jwt = localStorage.getItem('how_jwt');
      if(jwt && typeof sb !== 'undefined'){
        var { error } = await sb.from('teaching').delete().eq('id', id);
        if(error) console.warn('Supabase delete failed:', error.message);
        else console.log('Supabase delete OK:', id);
      }
    }catch(e){ console.warn('deleteTeaching error:', e); }
  }

  renderTab(currentView||'mine');
  toast('Teaching deleted');
}

// ── Publish / unpublish a teaching ───────────────────────────────────────
async function togglePublish(id, currentState, evt){
  if(evt){ evt.stopPropagation(); }
  var newState = !currentState;

  // Update localStorage
  var teachings = getTeachings().map(function(t){
    return t.id === id ? Object.assign({}, t, {is_published: newState}) : t;
  });
  saveTeachings(teachings);

  // Update Supabase only if id is a real UUID
  var isUUID2 = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id);
  var serverOK = false, serverWhy = '';
  if(isUUID2){
    try{
      var jwt = localStorage.getItem('how_jwt');
      if(!sb) serverWhy = 'Supabase client did not load';
      else if(!jwt) serverWhy = 'not signed in on the platform in this browser';
      else{
        var { error } = await sb
          .from('teaching')
          .update({ is_published: newState })
          .eq('id', id);
        if(error) serverWhy = error.message||'server error';
        else serverOK = true;
      }
    }catch(e){ serverWhy = e.message||'network error'; }
  } else if(newState){
    // Local-only teaching being published for the first time → insert it now
    var localT = getTeachings().find(function(t){ return t.id===id; });
    if(localT){
      var res = await pushTeachingToSupabase(localT);
      if(res && res.id){
        var list = getTeachings().map(function(t){ return t.id===id ? Object.assign({},t,{id:res.id, fromSupabase:true}) : t; });
        saveTeachings(list);
        serverOK = true;
      } else serverWhy = (res&&res.reason)||'could not reach the shared table';
    }
  }

  renderTab(currentView||'mine');
  if(newState){
    toast(serverOK ? '✓ Published to the shared library' : '⚠ Published on this device only — '+(serverWhy||'no server connection'), serverOK?2600:5000);
  } else {
    toast(serverOK||!isUUID2 ? 'Unpublished — visible to you only' : '⚠ Unpublished locally, but the server still shows it: '+serverWhy, 4000);
  }
}
function saveTeachings(t){S.set('teachings',t);updateCounts()}

function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._hid);t._hid=setTimeout(()=>t.classList.remove('show'),ms||2200)}

let currentGradeFilter = null;
let currentView = 'browse';

function renderTab(tab){
  const mc = document.getElementById('tab-content');
  if(tab==='browse') renderBrowse(mc, currentFilter, currentGradeFilter, null);
  else if(tab==='record') renderRecord(mc);
  else if(tab==='mine') renderMine(mc);

  currentFilter = btn.dataset.filter;
  currentGradeFilter = null;
  document.querySelectorAll('.sb-item[data-gradefilter]').forEach(b=>b.classList.remove('active'));
  renderBrowse(document.getElementById('tab-content'), currentFilter, null, null);

function filterGrade(btn){

  renderBrowse(document.getElementById('tab-content'), 'all', currentGradeFilter, null);
}

// ── BROWSE ────────────────────────────────────────────────────────
function renderBrowse(mc, filter, gradeFilter, searchTerm){
  let teachings = getAllTeachings();
  if(filter && filter!=='all'){
    if(filter==='studio') teachings = teachings.filter(t=>t.tags&&t.tags.some(g=>g.toLowerCase().includes('studio')));
    else teachings = teachings.filter(t=>t.subject===filter);
  }
  if(gradeFilter) teachings = teachings.filter(t=>parseInt(t.taughtGrade)===gradeFilter);
  if(searchTerm) {
    const s = searchTerm.toLowerCase();
    teachings = teachings.filter(t=>
      t.title.toLowerCase().includes(s)||
      t.summary.toLowerCase().includes(s)||
      t.keyIdea.toLowerCase().includes(s)||
      (t.tags&&t.tags.some(tag=>tag.toLowerCase().includes(s)))||
      (t.scholar&&t.scholar.toLowerCase().includes(s))
    );
  }

  mc.innerHTML = `
  <div class="page-header">
    <p class="page-kicker">The school's living textbook</p>
    <h1 class="page-title">Peer teaching library</h1>
    <p class="page-sub">Teachings recorded by students for students. Find the concept you need — explained by someone who understood it recently enough to remember what was confusing.</p>
  </div>

  <div class="stats-row">
    <div class="stat-card"><p class="stat-n">${getAllTeachings().length}</p><p class="stat-l">teachings in the library</p></div>

    <div class="stat-card"><p class="stat-n">${getAllTeachings().reduce((a,t)=>a+(t.views||0),0)}</p><p class="stat-l">total views</p></div>
    <div class="stat-card"><p class="stat-n">${getAllTeachings().filter(t=>t.openQuestion).length}</p><p class="stat-l">open questions logged</p></div>
  </div>

  <div class="search-bar">
    <input class="search-input" type="text" id="search-input" placeholder="Search by concept, scholar, grade, studio…" oninput="handleSearch(this.value)">
    <button class="filter-pill ${filter==='all'?'on':''}" onclick="filterSidebar(document.querySelector('[data-filter=all]'))">All</button>
    <button class="filter-pill ${filter==='math'?'on':''}" onclick="filterSidebar(document.querySelector('[data-filter=math]'))">Math</button>
    <button class="filter-pill ${filter==='science'?'on':''}" onclick="filterSidebar(document.querySelector('[data-filter=science]'))">Science</button>
  </div>

  <div class="teaching-grid" id="teaching-grid">
    ${teachings.length ? teachings.map(t=>teachingCard(t)).join('') : `
    <div class="empty-state">
      <div class="empty-state-icon">○</div>
      <p class="empty-state-title">No teachings found</p>
      <p class="empty-state-sub">Try a different filter, or be the first to record a teaching on this topic.</p>
    </div>`}
  </div>`;
}

function markHelpful(id){

  if(marked.indexOf(id)>-1){ toast('You already marked this as helpful.'); return; }
  marked.push(id); localStorage.setItem('ptl_marked_helpful', JSON.stringify(marked));
  // Increment helpful count on local teachings
  var teachings = getTeachings().map(function(x){
    return x.id===id ? Object.assign({},x,{helpful:(x.helpful||0)+1}) : x;
  });
  saveTeachings(teachings);
  // Increment in Supabase if it's a server teaching
  if(sb && t.fromSupabase && /^[0-9a-f-]{36}$/.test(t.id)){
    sb.from('teaching').update({helpful:(t.helpful||0)+1}).eq('id',t.id).then(function(){});

  // Write to sahifa_entries so Murshid scan picks it up
  try{

// VERIFY LEARNING — the digital samāʿ certificate
// The learner attests reception in writing; the Murshid checks the
// reflection actually engages the content (ḍabṭ); the platform then
// seals the transmission in `transmission_verification`.
// ══════════════════════════════════════════════════════════════════════
function escV(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function getLearnerIdentity(){
  var name='';
  try{ var a=JSON.parse(localStorage.getItem('how_active_student')||'null'); if(a&&a.name) name=a.name; }catch(e){}
  if(!name){ try{ var ss=JSON.parse(localStorage.getItem('sahifa_settings')||'{}'); if(ss.name) name=ss.name; }catch(e){} }
  if(!name){ var s=getSettings(); if(s.name) name=s.name; }
  var grade='';
  try{ var ss2=JSON.parse(localStorage.getItem('sahifa_settings')||'{}'); grade=ss2.grade||''; }catch(e){}
  return {
    name: name,
    grade: grade,
    jwt: localStorage.getItem('how_jwt'),
    hid: localStorage.getItem('how_household_id'),
    studentId: (function(){ try{ var a=JSON.parse(localStorage.getItem('how_active_student')||'null'); return a?a.id:null; }catch(e){ return null; } })()
  };
}

// Murshid ḍabṭ (precision) check — does the reflection show the content was
// actually received? Fails open on network error (facilitator retains override).
async function dabtCheck(t, reflection){
  const _dJwt=localStorage.getItem('how_jwt');
  if(!_dJwt) return {ok:false};
  try{
    const resp = await fetch('https://how-proxy-production.up.railway.app/api/generate',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:150,
        system:'You check whether a student\'s written reflection shows they genuinely received a peer teaching (dabt — precision of retention). PASS if the reflection engages the actual content: names the key idea, explains it in their own words, applies it, or asks a real question about it. FAIL if it is generic praise ("it was good", "I learned a lot") or could have been written without reading the teaching. Be generous with young students — simple language is fine as long as it is specific. Respond ONLY with JSON: {"pass":true|false,"note":"if fail, one short encouraging pointer toward what to add"}',
        messages:[{role:'user',content:'TEACHING: "'+t.title+'"\nKey idea: '+(t.keyIdea||'')+'\nSummary: '+(t.summary||'')+'\n\nSTUDENT REFLECTION:\n'+reflection+'\n\nJSON verdict:'}]})
    });
    const d = await resp.json();
    const raw = (d.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
    const v = JSON.parse(raw);
    return { pass: !!v.pass, note: v.note||'', via:'murshid' };
  }catch(e){
    return { pass:true, note:'', via:'platform' };
  }
}

async function submitLearningVerification(teachingId){
  const t = getAllTeachings().find(x=>x.id===teachingId);
  if(!t) return;
  const nameEl = document.getElementById('verify-name');
  const txtEl  = document.getElementById('verify-text');
  const statusEl = document.getElementById('verify-status');
  const btn = document.getElementById('verify-btn');
  const learner = (nameEl?.value||'').trim();
  const txt = (txtEl?.value||'').trim();

  const coral = m=>`<div style="background:var(--coral-l,#FAECE7);border:1px solid var(--coral,#C4552E);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.6">${m}</div>`;
  if(!learner){ statusEl.innerHTML = coral('Add your name so the chain records who received this.'); return; }
  if(t.teacherName && learner.toLowerCase()===t.teacherName.trim().toLowerCase()){
    statusEl.innerHTML = coral('A teacher can\'t verify their own transmission — that\'s for the one who received it.'); return;
  }
  if(txt.length < 25){
    statusEl.innerHTML = coral('<strong>Say more about what you learned</strong> — mention the actual idea. What was the key insight? How would you explain it to someone else?'); return;
  }

  if(btn) btn.disabled = true;
  statusEl.innerHTML = `<div style="font-size:12.5px;color:var(--ink-4)"><em>The Murshid is reading your reflection…</em></div>`;

  const verdict = await dabtCheck(t, txt);
  if(!verdict.pass){
    if(btn) btn.disabled = false;
    statusEl.innerHTML = coral('<strong>Say more about what you learned.</strong> '+escV(verdict.note||'Mention the specific idea — what was the key insight, and how would you explain it to someone else?'));
    return;
  }

  const me = getLearnerIdentity();
  const entryText = 'What I learned from '+(t.teacherName||'a peer')+' — "'+t.title+'": '+txt;

  // 1) Sahifa entry — local (the sahifa app and Murshid read this key)
  try{
    var entries = JSON.parse(localStorage.getItem('sahifa_entries')||'[]');
    entries.unshift({ id:'pl'+Date.now(), type:'peer_learning', text:entryText, date:new Date().toISOString(),
                      teachingId:t.id, teacherName:t.teacherName||'' });
    localStorage.setItem('sahifa_entries', JSON.stringify(entries.slice(0,500)));
  }catch(e){}

  // 2) Sahifa entry — Supabase (best-effort)
  if(sb && me.jwt && me.hid){
    try{
      await sb.from('sahifa_entry').insert({
        household_id: me.hid, student_id: me.studentId, type:'peer_learning',
        text: entryText, grade: parseInt(me.grade,10)||null,
        entry_date: new Date().toISOString().split('T')[0]
      });
    }catch(e){ console.warn('sahifa_entry insert failed:', e.message||e); }
  }

  // 3) Seal the transmission
  var sealed = false;
  if(sb && me.jwt){
    try{
      // v2: resolve person UUIDs for authoritative identity on the Isnād Map
      var learnerGrade = parseInt(me.grade, 10) || null;
      var fromPersonId = await findOrCreatePerson(t.teacherName||'Unknown teacher', null, 'student');
      var toPersonId   = await findOrCreatePerson(learner, learnerGrade, 'student');
      // Curriculum week from sahifa_settings (written by platform on each week view)
      var currentWeek  = null;
      try{ var sq=JSON.parse(localStorage.getItem('sahifa_settings')||'{}'); currentWeek=parseInt(sq.juz)||null; }catch(e){}
      var row = {
        household_id:       me.hid||null,
        kind:               'reception',
        teaching_id:        (t.fromSupabase && /^[0-9a-f-]{36}$/.test(t.id)) ? t.id : null,
        from_name:          t.teacherName||'Unknown teacher',  // v1: kept
        to_name:            learner,                           // v1: kept
        from_person_id:     fromPersonId,                      // v2
        to_person_id:       toPersonId,                        // v2
        evidence:           txt,
        evidence_ref:       t.title,
        week:               currentWeek,                       // v2
        grade:              learnerGrade,                      // v2
        status:             'verified',
        verified_by:        verdict.via,
        verification_level: verdict.via === 'murshid' ? 'murshid_checked' : 'platform_auto'  // v2
      };
      var r = await sb.from('transmission_verification').insert(row);
      if(r.error) throw r.error;
      sealed = true;
    }catch(e){
      console.warn('verification insert failed:', e.message||e);
      toast('⚠ Reflection saved, but the seal did not reach the Isnād Map: '+(e.message||'server error'), 5000);
    }
  }

  const panel = document.getElementById('verify-panel');
  if(panel) panel.innerHTML = `
    <span class="detail-section-label">🖋 Samāʿ recorded</span>
    <div style="background:var(--gold-pale,#FAEEDA);border:1px solid var(--gold,#B98A2F);border-radius:10px;padding:14px 16px">
      <p style="font-size:13.5px;font-weight:600;color:var(--ink);margin:0 0 6px">✓ Transmission ${sealed?'verified':'recorded'} — ${escV(t.teacherName||'teacher')} → ${escV(learner)}</p>
      <p style="font-size:12.5px;color:var(--ink-2);line-height:1.7;margin:0 0 8px">"${escV(txt)}"</p>
      <p style="font-size:11.5px;color:var(--ink-4);line-height:1.6;margin:0">Saved to your sahifa${sealed?' and sealed on the Isnād Map. This link is now <em>muttaṣil</em> — attested by the one who received it.':'. Sign in on the platform to seal it on the Isnād Map.'}</p>
    </div>`;
  toast(sealed ? 'Transmission verified ✓' : 'Learning recorded ✓');
}

// If this learner already verified this teaching, show that instead of the form
async function checkExistingVerification(t){
  const me = getLearnerIdentity();
  if(!sb || !me.jwt || !me.name || !t.fromSupabase) return;
  try{
    var r = await sb.from('transmission_verification').select('created_at,evidence')
      .eq('teaching_id', t.id).eq('to_name', me.name).eq('kind','reception').limit(1);
    if(r.data && r.data.length){

      if(panel) panel.innerHTML = `
        <span class="detail-section-label">🖋 Samāʿ recorded</span>
        <div style="background:var(--gold-pale,#FAEEDA);border:1px solid var(--gold,#B98A2F);border-radius:10px;padding:12px 16px">
          <p style="font-size:13px;font-weight:600;color:var(--ink);margin:0 0 4px">✓ You verified this transmission on ${new Date(r.data[0].created_at).toLocaleDateString()}</p>

        </div>`;
    }
  }catch(e){}
}

async function prepareMurshid(){
  const s = getSettings();
  const el = document.getElementById('murshid-prep-text');
  if(!el) return;
  if(!s.apiKey){
    setTimeout(()=>{
      if(!el) return;
      el.innerHTML = `Before you write your summary — what is the one thing that, once a student understands it, makes the whole concept click? Not the definition. The insight. For "${draftTeaching.title}", that moment is usually hiding in the question: what were people confused about before this idea existed?`;
    }, 800);
    return;
  }
  const _pJwt=localStorage.getItem('how_jwt');
  if(!_pJwt) return;
  try {
    const resp = await fetch('https://how-proxy-production.up.railway.app/api/generate',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:200,
        system:'You are the Murshid. A student is about to record a peer teaching. Help them find their key insight. Ask one precise question that will help them articulate the single most important idea. Be brief — two or three sentences maximum.',
        messages:[{role:'user',content:`I am about to record a peer teaching on: "${draftTeaching.title}". I taught this to Grade ${draftTeaching.taughtGrade} students. I am in Grade ${draftTeaching.teacherGrade}.`}]})
    });
    const data = await resp.json();
    if(el) el.textContent = data.content?.[0]?.text || 'What is the one insight that made this concept click?';
  } catch(e){
    if(el) el.textContent = 'What is the one sentence that unlocks this concept for a younger student?';
  }
}

async function publishTeaching(){
  const s = getSettings();
  const teachings = getTeachings();
  const name = s.name||'Anonymous';
  const initials = name.split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase()||'??';
  const entry = {
    ...draftTeaching,
    id: 'u'+Date.now(),
    teacherName: name,
    teacherInitials: initials,
    year: new Date().getFullYear().toString(),
    views: 0,
    helpful: 0,
    is_published: true,
  };
  // Strip drawing data URLs from localStorage copy to prevent QuotaExceededError
  // Drawings are large base64 strings — they go to Supabase; localStorage keeps metadata only
  const entryForStorage = Object.assign({}, entry, {
    annotatedSlides: (entry.annotatedSlides||[]).map(function(sl){
      return Object.assign({}, sl, {drawing: sl.drawing ? '[drawing]' : ''});
    })
  });
  try{
    teachings.push(entryForStorage);
    saveTeachings(teachings);
  } catch(e){
    toast('⚠ Could not save locally — '+e.message);
    return;
  }
  switchTab(document.querySelector('[data-tab=browse]'));
  toast('✓ Teaching saved to library');
  // Push to the shared table so the Map and other devices can see it.
  const shared = await pushTeachingToSupabase(entry);
  if(shared && shared.id){
    // Adopt the server uuid so future publish-toggles update the real row
    var list = getTeachings().map(function(t){ return t.id===entry.id ? Object.assign({},t,{id:shared.id, fromSupabase:true, keyIdea:shared.keyIdea||t.keyIdea, summary:shared.summary||t.summary, scholar:shared.scholar||t.scholar, juz:shared.juz||t.juz, openQuestion:shared.openQuestion||t.openQuestion, annotatedSlides:shared.annotatedSlides||t.annotatedSlides||[]}) : t; });
    saveTeachings(list);
    toast('✓ Published to the shared library — it can now be verified on the Isnād Map.');
  } else {
    toast('⚠ Saved on this device only — NOT shared. '+(shared&&shared.reason?shared.reason:'Check connection and platform sign-in.'), 5000);
  }
}

// Insert a locally-recorded teaching into the shared `teaching` table.
// Returns {id} on success, {reason} on failure — never silent.
async function pushTeachingToSupabase(t){
  if(!sb) return { reason:'Supabase client did not load in this tab.' };
  var jwt = localStorage.getItem('how_jwt');
  if(!jwt) return { reason:'Not signed in on the platform in this browser.' };
  var hid = localStorage.getItem('how_household_id');
  var sid = null;
  try{ var a=JSON.parse(localStorage.getItem('how_active_student')||'null'); sid=a?a.id:null; }catch(e){}
  // v2: resolve teacher_id from the person table
  var teacherName = t.teacherName || 'Anonymous';
  var teacherGrade = parseInt(t.teacherGrade, 10) || null;
  var teacherId = await findOrCreatePerson(teacherName, teacherGrade, 'student');
  var row = {
    household_id:     hid||null,
    teacher_name:     teacherName,
    teacher_id:       teacherId,
    student_id:       sid,
    taught_grade:     parseInt(t.taughtGrade,10)||parseInt(t.grade,10)||parseInt((getSettings()||{}).grade,10)||null,
    teacher_grade:    parseInt(t.teacherGrade,10)||teacherGrade||null,
    subject:          t.subject||'other',
    title:            t.title||'Untitled teaching',
    key_idea:         t.keyIdea||'',
    summary:          t.summary||'',
    transcript:       t.transcript||[],
    tags:             t.tags||[],
    scholar:          t.scholar||'',
    juz:              t.juz||'',
    open_question:    t.openQuestion||'',
    year:             t.year||String(new Date().getFullYear()),
    annotated_slides: t.annotatedSlides||[],
    is_published:     true
  };
  try{
    var r = await sb.from('teaching').insert(row).select().single();
    if(r.error){
      // Retry without household_id in case the column/policy differs
      delete row.household_id;
      r = await sb.from('teaching').insert(row).select().single();
    }
    if(r.error) return { reason:'Server rejected it: '+(r.error.message||'unknown error') };
    // Merge server fields back into the local object shape (snake_case → camelCase)
    return {
      id: r.data.id,
      keyIdea:       r.data.key_idea||t.keyIdea||'',
      summary:       r.data.summary||t.summary||'',
      scholar:       r.data.scholar||t.scholar||'',
      juz:           r.data.juz||t.juz||'',
      openQuestion:  r.data.open_question||t.openQuestion||'',
      annotatedSlides: r.data.annotated_slides||t.annotatedSlides||[],
    };
  }catch(e){
    return { reason:'Network error: '+(e.message||'could not reach Supabase') };
  }
}

function renderOneAnnotatedSlide(sl, idx){
  if(!sl) return '';
  let html = '';
  html += `<div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#aaa;margin-bottom:6px">Slide ${idx+1} · ${sl.type||'content'}</div>`;
  if(sl.heading) html += `<div style="font-size:1rem;font-weight:700;color:#1a1a2e;margin-bottom:6px">${sl.heading}</div>`;
  if(sl.content) html += `<div style="font-size:.85rem;color:#5a5a78;margin-bottom:10px;line-height:1.55">${sl.content}</div>`;
  if(sl.drawing && sl.drawing.length > 100){
    html += `<img src="${sl.drawing}" style="max-width:100%;border-radius:6px;border:1px solid #e4ddd0;margin-bottom:10px;display:block" alt="Student drawing">`;
  }
  if(sl.studentNote && sl.studentNote.trim()){
    html += `<div style="background:#f0f8f8;border-left:3px solid #1d6f6f;padding:10px 12px;border-radius:0 6px 6px 0">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#1d6f6f;margin-bottom:4px">Teaching note</div>
      <div style="font-size:.88rem;color:#1a1a2e;line-height:1.6">${sl.studentNote}</div>
    </div>`;
  }
  if(!sl.drawing && !sl.studentNote){
    html += `<div style="color:#ccc;font-size:.82rem;font-style:italic;padding:12px 0">No annotation on this slide</div>`;
  }
  return html;
}

function libSlideNav(id, dir){
  const state = (window._libDeck||{})[id];
  if(!state) return;
  state.idx = Math.max(0, Math.min(state.slides.length-1, state.idx+dir));
  const view = document.getElementById('slide-view-'+id);
  const ctr  = document.getElementById('slide-ctr-'+id);
  if(view) view.innerHTML = renderOneAnnotatedSlide(state.slides[state.idx], state.idx);
  if(ctr)  ctr.textContent = 'Slide '+(state.idx+1)+' of '+state.slides.length;
}

      }).join('') +

// ── Load slide prompts (AI or cached) ────────────────────────────────────────
async function _howLoadSlide(n){
  if(_howAICache[n]){
    _howRenderSlideBody(n, _howAICache[n]);
    return;
  }
  var prompts = await _howGeneratePrompts(n);
  _howAICache[n] = prompts;
  _howRenderSlideBody(n, prompts);
}

// ── AI prompt generation ──────────────────────────────────────────────────────
async function _howGeneratePrompts(n){
  var band    = _ptlTeacherBand();
  var subject = draftTeaching.subject || 'general';
  var scholar = draftTeaching.scholar || '';
  var juz     = draftTeaching.juz    || '';
  var title   = draftTeaching.title  || '';
  var slideType = HOW_SLIDE_TYPES[n] || 'Content';

  // Previous responses for slide 8 context
  var prevContext = '';
  if(n===8){
    var parts = [];
    for(var i=1;i<=7;i++){
      if(_howResponses[i] && _howResponses[i].paragraph){
        parts.push('Slide '+i+' ('+HOW_SLIDE_TYPES[i]+'): '+_howResponses[i].paragraph);
      }
    }
    if(parts.length) prevContext = '\n\nStudent\'s teaching so far:\n' + parts.join('\n');
  }

  var isJuz = (n===8);
  var bandDesc = band==='k2'?'Ages 5-7, very simple language':
                 band==='35'?'Ages 8-11, clear simple sentences':
                 band==='68'?'Ages 11-14, thoughtful language':
                 'Ages 14-18, full intellectual depth';

  var sys = 'You are writing prompts for a student who is teaching this slide to their peers. ' +
    'The student already learned this content — now they are recording their own teaching of it. ' +
    'Write all work prompts in the second person, directed at the student as the teacher: ' +
    '"Write your own example...", "Explain in your own words...", "Describe how this connects to..." — ' +
    'NEVER use "Ask students to...", "Have students...", or classroom-teacher language. ' +
    'The three approaches are fixed: Give a new example / Explain why it matters / Connect to what you know. ' +
    'Your job is only to write the specific work1 and work2 prompts for each approach, ' +
    'tailored to this exact slide type and subject. ' +
    'Grade band of the student teacher: '+bandDesc+'. ' +
    'Return ONLY valid JSON. No markdown, no backticks, no explanation.';

  var prompt = isJuz ?
    'Slide type: Juz Connection (Slide 8 of 8).\n' +
    'Lesson title: "'+title+'". Subject: '+subject+'. Scholar: '+scholar+'. Juz: '+juz+'.' +
    prevContext + '\n\n' +
    'Generate JSON with this exact shape:\n' +
    '{\n' +
    '  "positions": ["I see this connection clearly","I see a different connection","I think the connection is elsewhere"],\n' +
    '  "approaches": [\n' +
    '    {"label":"Give a new example","work1":"...","work2":"..."},\n' +
    '    {"label":"Explain why it matters","work1":"...","work2":"..."},\n' +
    '    {"label":"Connect to what you know","work1":"...","work2":"..."}\n' +
    '  ],\n' +
    '  "drawingPrompt": "Draw ... (no faces, no eyes)"\n' +
    '}\n' +
    'The approaches and work prompts must be specific to this slide type and the student\'s previous teaching. work2 may be empty string if one prompt is enough.' :

    'Slide type: "'+slideType+'" (Slide '+n+' of 8).\n' +
    'Lesson title: "'+title+'". Subject: '+subject+'. Scholar: '+scholar+'. Juz: '+juz+'.' + '\n\n' +
    'Generate JSON with this exact shape:\n' +
    '{\n' +
    '  "approaches": [\n' +
    '    {"label":"Give a new example","work1":"...","work2":"..."},\n' +
    '    {"label":"Explain why it matters","work1":"...","work2":"..."},\n' +
    '    {"label":"Connect to what you know","work1":"...","work2":"..."}\n' +
    '  ],\n' +
    '  "drawingPrompt": "Draw ... (no faces, no eyes)"\n' +
    '}\n' +
    'The three approaches are always: "Give a new example", "Explain why it matters", "Connect to what you know". ' +
    'Keep these labels exactly. work1 and work2 are specific prompts tailored to this slide type and subject. work2 can be empty string. Band: '+bandDesc+'.';

  try{
    var jwt = localStorage.getItem('how_jwt');
    if(!jwt) throw new Error('no jwt');
    var resp = await fetch('https://how-proxy-production.up.railway.app/api/generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6', max_tokens:600,
        system: sys,
        messages:[{role:'user',content:prompt}]
      })
    });
    var data = await resp.json();
    var raw = (data.content&&data.content[0]&&data.content[0].text)||'{}';
    raw = raw.replace(/```json/g,'').replace(/```/g,'').trim();
    return JSON.parse(raw);
  } catch(e){
    // Fallback — generic prompts
    return _howFallbackPrompts(n, subject);
  }
}

  html += '</div>'; // how-work-area

// ── Live paragraph assembly ───────────────────────────────────────────────────
function _howUpdateParagraph(n){
  var saved = _howResponses[n] || {};
  var prompts = _howAICache[n] || {};
  var apps    = (prompts.approaches) || [];
  var app     = apps[saved.approachIdx] || {label:''};

  var w1El = document.getElementById('how-w1-'+n);
  var w2El = document.getElementById('how-w2-'+n);
  var w1 = (w1El&&w1El.value.trim()) || '';
  var w2 = (w2El&&w2El.value.trim()) || '';

  if(!_howResponses[n]) _howResponses[n]={};
  _howResponses[n].work1 = w1;
  _howResponses[n].work2 = w2;

  if(!w1 && !w2){
    var paraEl = document.getElementById('how-para-'+n);
    if(paraEl) paraEl.innerHTML = '<span style="color:#ccc">Your teaching will appear here as you write…</span>';
    return;
  }

// ── Save slide and advance ────────────────────────────────────────────────────
function _howSaveSlide(n){
  var saved = _howResponses[n] || {};
  if(saved.approachIdx === undefined){ toast('Choose your approach first.'); return; }
  var w1El = document.getElementById('how-w1-'+n);
  if(w1El && !w1El.value.trim()){ toast('Show your work — write at least one response.'); return; }

  // Save canvas before advancing
  _howSaveCanvasData(n);
  var hint=document.getElementById('how-canvas-hint-'+n);
  if(hint && _howStrokes[n] && _howStrokes[n].length>0) hint.textContent='Drawing saved ✓';

  // Build the annotatedSlide entry
  var prompts  = _howAICache[n] || {};
  var apps     = (prompts.approaches) || [];
  var app      = apps[saved.approachIdx] || {};

  var slide = {
    type:      HOW_SLIDE_TYPES[n] || 'content',
    heading:   (app.label||''),
    content:   (saved.work1||'') + (saved.work2 ? '\n' + saved.work2 : ''),
    studentNote: saved.paragraph || '',
    drawing:   saved.drawing || ''
  };

  draftTeaching.annotatedSlides = draftTeaching.annotatedSlides || [];
  // Replace or add
  var existing = draftTeaching.annotatedSlides.findIndex(function(s,i){ return i===n-1; });
  if(existing >= 0) draftTeaching.annotatedSlides[existing] = slide;
  else draftTeaching.annotatedSlides.push(slide);

  if(n < 8){
    _howSlide = n + 1;
    renderHOWStep();
    // Init canvas after render
    setTimeout(function(){ _howInitCanvas(_howSlide); }, 100);
  } else {
    // Done with all slides — build key idea and summary from paragraphs
    var paras = [];
    for(var i=1;i<=8;i++){
      if(_howResponses[i] && _howResponses[i].paragraph) paras.push(_howResponses[i].paragraph);
    }
    draftTeaching.keyIdea = paras[0] || '';
    draftTeaching.summary = paras.join(' ');
    draftTeaching.isTeachIt = true;
    // Go to open question step
    recStep = 4; renderRecordStep();
  }
}

// ── Back navigation ───────────────────────────────────────────────────────────
function _howBack(){
  if(_howSlide > 1){
    _howSlide--;
    renderHOWStep();
    setTimeout(function(){
      var saved = _howResponses[_howSlide];
      if(saved && saved.drawing) _howRestoreCanvas(_howSlide, saved.drawing);
      _howInitCanvas(_howSlide);
    }, 100);
  } else {
    // Back to step 1
    recStep = 1; renderRecordStep();
  }
}

function _howShapeRedraw(ctx, strokes){
  ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
  (strokes||[]).forEach(function(h){ _howShapeDrawOn(ctx,h); });
}

function _howShapeDrawOn(ctx,h){
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  if(h.type==='highlight'){
    ctx.globalAlpha=0.28;
    ctx.fillStyle=(h.color==='#1a1a2e')?'#ffdd44':h.color;
    ctx.fillRect(Math.min(h.x1,h.x2),Math.min(h.y1,h.y2),Math.abs(h.x2-h.x1),Math.abs(h.y2-h.y1));
  }else if(h.type==='circle'){
    ctx.strokeStyle=h.color; ctx.lineWidth=(h.lw||3)+1;
    var rx=Math.abs(h.x2-h.x1)/2,ry=Math.abs(h.y2-h.y1)/2;
    ctx.beginPath(); ctx.ellipse((h.x1+h.x2)/2,(h.y1+h.y2)/2,Math.max(rx,5),Math.max(ry,5),0,0,Math.PI*2); ctx.stroke();
  }else if(h.type==='rect'){
    ctx.strokeStyle=h.color; ctx.lineWidth=(h.lw||3)+1;
    ctx.strokeRect(Math.min(h.x1,h.x2),Math.min(h.y1,h.y2),Math.abs(h.x2-h.x1),Math.abs(h.y2-h.y1));
  }else if(h.type==='arrow'){
    ctx.strokeStyle=h.color; ctx.fillStyle=h.color; ctx.lineWidth=(h.lw||3)+1;
    var dx=h.x2-h.x1,dy=h.y2-h.y1,len=Math.sqrt(dx*dx+dy*dy);
    if(len<5){ctx.restore();return;}
    var angle=Math.atan2(dy,dx),headLen=Math.min(20,len*0.4);
    ctx.beginPath(); ctx.moveTo(h.x1,h.y1); ctx.lineTo(h.x2,h.y2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(h.x2,h.y2);
    ctx.lineTo(h.x2-headLen*Math.cos(angle-0.4),h.y2-headLen*Math.sin(angle-0.4));
    ctx.lineTo(h.x2-headLen*Math.cos(angle+0.4),h.y2-headLen*Math.sin(angle+0.4));
    ctx.closePath(); ctx.fill();
  }else if(h.type==='text'){
    ctx.fillStyle=h.color; ctx.font='bold '+(h.size||16)+'px DM Sans,sans-serif';
    ctx.fillText(h.text,h.x,h.y);
  }else if(h.type==='erase'){
    if(!h.points||h.points.length<2){ctx.restore();return;}
    ctx.globalCompositeOperation='destination-out';
    ctx.lineWidth=(h.lw||3)*4; ctx.strokeStyle='rgba(0,0,0,1)';
    ctx.beginPath(); ctx.moveTo(h.points[0].x,h.points[0].y);
    for(var ei=1;ei<h.points.length;ei++){
      var emx=(h.points[ei-1].x+h.points[ei].x)/2,emy=(h.points[ei-1].y+h.points[ei].y)/2;
      ctx.quadraticCurveTo(h.points[ei-1].x,h.points[ei-1].y,emx,emy);
    }
    ctx.stroke();
  }else if(h.type==='star'){
    ctx.strokeStyle=h.color; ctx.lineWidth=(h.lw||3)+1;
    var scx=(h.x1+h.x2)/2,scy=(h.y1+h.y2)/2;
    var sR=Math.min(Math.abs(h.x2-h.x1),Math.abs(h.y2-h.y1))/2;
    if(sR<5){ctx.restore();return;}
    var sr=sR*0.38;
    ctx.beginPath();
    for(var si=0;si<16;si++){
      var sa=si*Math.PI/8-Math.PI/2;
      var srad=(si%2===0)?sR:sr;
      var spx=scx+srad*Math.cos(sa),spy=scy+srad*Math.sin(sa);
      if(si===0)ctx.moveTo(spx,spy);else ctx.lineTo(spx,spy);
    }
    ctx.closePath(); ctx.stroke();
  }else if(h.type==='crescent'){
    ctx.fillStyle=h.color;
    var ccx=(h.x1+h.x2)/2,ccy=(h.y1+h.y2)/2;
    var cR=Math.min(Math.abs(h.x2-h.x1),Math.abs(h.y2-h.y1))/2;
    if(cR<5){ctx.restore();return;}
    ctx.beginPath();
    ctx.arc(ccx,ccy,cR,0,Math.PI*2,false);
    ctx.arc(ccx+cR*0.32,ccy-cR*0.08,cR*0.76,0,Math.PI*2,true);
    ctx.fill('evenodd');
  }else if(h.type==='arch'){
    ctx.strokeStyle=h.color; ctx.lineWidth=(h.lw||3)+1;
    var al=Math.min(h.x1,h.x2),at=Math.min(h.y1,h.y2);
    var ar=Math.max(h.x1,h.x2),ab=Math.max(h.y1,h.y2);
    var amid=(al+ar)/2,aw=ar-al,ah=ab-at;
    ctx.beginPath();
    ctx.moveTo(al,ab); ctx.lineTo(al,at+ah*0.45);
    ctx.quadraticCurveTo(al,at,amid,at);
    ctx.quadraticCurveTo(ar,at,ar,at+ah*0.45);
    ctx.lineTo(ar,ab); ctx.stroke();
  }else if(h.type==='diamond'){
    ctx.strokeStyle=h.color; ctx.lineWidth=(h.lw||3)+1;
    var dcx=(h.x1+h.x2)/2,dcy=(h.y1+h.y2)/2;
    var dw=Math.abs(h.x2-h.x1)/2,dh=Math.abs(h.y2-h.y1)/2;
    ctx.beginPath();
    ctx.moveTo(dcx,dcy-dh); ctx.lineTo(dcx+dw,dcy);
    ctx.lineTo(dcx,dcy+dh); ctx.lineTo(dcx-dw,dcy);
    ctx.closePath(); ctx.stroke();
  }else if(h.type==='pen'){
    if(!h.points||h.points.length<2){ctx.restore();return;}
    ctx.strokeStyle=h.color; ctx.lineWidth=h.lw||3;
    ctx.beginPath(); ctx.moveTo(h.points[0].x,h.points[0].y);
    for(var i=1;i<h.points.length;i++){
      var mx=(h.points[i-1].x+h.points[i].x)/2,my=(h.points[i-1].y+h.points[i].y)/2;
      ctx.quadraticCurveTo(h.points[i-1].x,h.points[i-1].y,mx,my);
    }
    ctx.stroke();
  }
  ctx.restore();
}

  ca.addEventListener('pointermove',function(e){
    e.preventDefault();
    if(!drawing) return;
    var p=gp(e);
    pvCtx.clearRect(0,0,pvCanvas.width,pvCanvas.height);
    if(activeTool==='pen'||activeTool==='erase'){
      penPoints.push({x:p.x,y:p.y});
      _howShapeDrawOn(pvCtx,{type:activeTool,points:penPoints,color:activeColor,lw:activeSize});
    } else {
      _howShapeDrawOn(pvCtx,{type:activeTool,x1:sx,y1:sy,x2:p.x,y2:p.y,color:activeColor,lw:activeSize});
    }
  });
  function finish(e){
    if(!drawing) return; drawing=false;
    pvCtx.clearRect(0,0,pvCanvas.width,pvCanvas.height);
    var p=e?gp(e):{x:sx,y:sy};
    if(activeTool==='pen'||activeTool==='erase'){
      if(penPoints.length>1) _howStrokes[n].push({type:activeTool,points:penPoints.slice(),color:activeColor,lw:activeSize});
    } else {
      _howStrokes[n].push({type:activeTool,x1:sx,y1:sy,x2:p.x,y2:p.y,color:activeColor,lw:activeSize});
    }
    _howShapeRedraw(bgCtx,_howStrokes[n]);
    _howSyncPreview(n,bgCanvas);
    penPoints=[];
  }
  ca.addEventListener('pointerup',finish);
  ca.addEventListener('pointercancel',finish);
  ca.addEventListener('contextmenu',function(e){e.preventDefault();});
  textInput.addEventListener('keydown',function(e){
    if(e.key==='Escape'||(e.key==='Enter'&&!e.shiftKey)){e.preventDefault();commitText();}
  });

  var kbHandler=function(e){
    if(textInput===document.activeElement) return;
    if(!document.getElementById('how-canvas-expand-ov')) return;
    var map={h:'highlight',c:'circle',a:'arrow',r:'rect',t:'text',p:'pen',e:'erase',s:'star',m:'crescent',n:'arch',d:'diamond'};
    if(map[e.key.toLowerCase()]) setET(map[e.key.toLowerCase()]);
    if(e.key>='1'&&e.key<='9') setEC(COLORS[parseInt(e.key)-1]);
    if((e.metaKey||e.ctrlKey)&&e.key==='z'){
      e.preventDefault();
      _howStrokes[n].pop();
      _howShapeRedraw(bgCtx,_howStrokes[n]);
      _howSyncPreview(n,bgCanvas);
    }
    if(e.key==='Escape'){commitText();ov.remove();document.removeEventListener('keydown',kbHandler);}
  };
  document.addEventListener('keydown',kbHandler);
}

// Sync expanded canvas back to the small preview thumbnail
function _howSyncPreview(n, srcCanvas){
  var thumb=document.getElementById('how-canvas-'+n);
  if(!thumb) return;
  var tctx=thumb.getContext('2d');
  tctx.clearRect(0,0,thumb.width,thumb.height);
  if(srcCanvas.width>0) tctx.drawImage(srcCanvas,0,0,thumb.width,thumb.height);
  if(!_howResponses[n]) _howResponses[n]={};
  try{ _howResponses[n].drawing=thumb.toDataURL(); }catch(e){}
}

// ── HOW Approach — slide card renderer (matches presRender logic, PTL styles) ─
function _howRenderSlideCard(sl){
  if(!sl) return '';
  var type = sl.type || 'content';
  var html = '';

  if(type==='title'){
    html += '<div style="text-align:center;padding:8px 0 4px">';
    html += '<div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);margin-bottom:8px">Lesson title</div>';
    html += '<div style="font-size:1.3rem;font-weight:800;color:var(--ink);line-height:1.3;font-family:\'DM Serif Display\',serif;margin-bottom:8px">'+(sl.heading||'')+'</div>';
    if(sl.objective) html += '<div style="font-size:.85rem;color:var(--ink-3);line-height:1.6;margin-bottom:6px">'+sl.objective+'</div>';
    if(sl.juzTheme)  html += '<div style="display:inline-block;background:var(--gold-pale);border:1px solid var(--gold);border-radius:20px;padding:3px 12px;font-size:.78rem;color:var(--coral);font-weight:600;margin-top:4px">✦ '+sl.juzTheme+'</div>';
    html += '</div>';

  } else if(type==='provocation'){
    html += '<div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);margin-bottom:8px">Opening question</div>';
    if(sl.heading && sl.heading!=='Opening Question') html += '<div style="font-size:.85rem;font-weight:600;color:var(--ink-3);margin-bottom:6px">'+sl.heading+'</div>';
    if(sl.question) html += '<div style="font-size:1.05rem;font-weight:700;border-left:3px solid var(--teal);padding-left:12px;color:var(--ink);line-height:1.6">'+sl.question+'</div>';
    if(sl.parentNote) html += '<div style="margin-top:10px;font-size:.78rem;color:var(--ink-4);font-style:italic">'+sl.parentNote+'</div>';

  } else if(type==='worked'){
    html += '<div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);margin-bottom:8px">Worked example</div>';
    html += '<div style="font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:8px">'+(sl.heading||'')+'</div>';
    if(sl.content) html += '<div style="font-size:.9rem;color:var(--ink-3);line-height:1.6;margin-bottom:8px">'+sl.content+'</div>';
    if(sl.steps && sl.steps.length){
      html += '<ol style="padding-left:1.1rem;margin-top:4px">';
      sl.steps.forEach(function(s){ html += '<li style="margin-bottom:6px;font-size:.9rem;color:var(--ink);line-height:1.5">'+s+'</li>'; });
      html += '</ol>';
    }
    if(sl.parentNote) html += '<div style="margin-top:8px;font-size:.78rem;color:var(--teal);font-style:italic;border-left:2px solid var(--teal);padding-left:8px">'+sl.parentNote+'</div>';

  } else if(type==='juz'){
    // PTL adaptation — warm parchment, no dark overlay
    html += '<div style="background:var(--gold-pale);border:1px solid var(--gold);border-radius:10px;padding:14px 16px;text-align:center">';
    if(sl.arabic) html += '<div style="font-size:1.8rem;direction:rtl;font-family:\'Amiri\',serif;color:var(--ink);margin-bottom:6px;line-height:1.6">'+sl.arabic+'</div>';
    if(sl.name)   html += '<div style="font-size:.85rem;font-weight:700;color:var(--coral);margin-bottom:8px">'+sl.name+'</div>';
    if(sl.story)  html += '<div style="font-size:.85rem;color:var(--ink-3);line-height:1.7;margin-bottom:8px;font-style:italic">'+sl.story+'</div>';
    if(sl.reflection) html += '<div style="font-size:.9rem;font-weight:600;border-left:3px solid var(--gold);padding-left:10px;color:var(--ink);text-align:left;margin-top:4px">'+sl.reflection+'</div>';
    html += '</div>';

  } else if(type==='studio'){
    html += '<div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--teal);margin-bottom:8px">🎨 Studio connection</div>';
    html += '<div style="font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:8px">'+(sl.heading||'')+'</div>';
    if(sl.discipline) html += '<div style="font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:8px">'+sl.discipline+'</div>';
    if(sl.prompt)    html += '<div style="background:var(--teal-l);border-left:3px solid var(--teal);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.9rem;line-height:1.7">'+sl.prompt+'</div>';
    if(sl.materials) html += '<div style="font-size:.8rem;color:var(--ink-3);margin-top:8px"><strong>Materials:</strong> '+sl.materials+'</div>';

  } else {
    // Default: content, activity, discussion, anything else
    var typeLabel = {'content':'Concept','activity':'Activity','discussion':'Discussion'}[type]||'';
    if(typeLabel) html += '<div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);margin-bottom:8px">'+typeLabel+'</div>';
    if(sl.heading) html += '<div style="font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:8px">'+sl.heading+'</div>';
    if(sl.content) html += '<div style="font-size:.9rem;color:var(--ink-3);line-height:1.7;margin-bottom:8px">'+sl.content+'</div>';
    if(sl.passage) html += '<div style="background:var(--parchment-2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0;font-family:\'DM Serif Display\',serif;font-size:.9rem;line-height:1.8;margin-top:6px">'+sl.passage+'</div>';
    if(sl.steps && sl.steps.length){
      html += '<ol style="padding-left:1.1rem;margin-top:6px">';
      sl.steps.forEach(function(s){ html += '<li style="margin-bottom:5px;font-size:.9rem;color:var(--ink)">'+s+'</li>'; });
      html += '</ol>';
    }
    if(sl.question) html += '<div style="font-size:1rem;font-weight:700;border-left:3px solid var(--teal);padding-left:10px;color:var(--ink);margin-top:8px;line-height:1.6">'+sl.question+'</div>';
    if(sl.example)  html += '<div style="margin-top:8px;font-size:.85rem;color:var(--ink-3);font-style:italic"><strong style="color:var(--ink)">Example:</strong> '+sl.example+'</div>';
    if(sl.visual)   html += '<div style="margin-top:6px;font-size:.8rem;color:var(--teal);font-style:italic">'+sl.visual+'</div>';
    if(sl.scholarNote) html += '<div style="margin-top:8px;padding:6px 10px;border-radius:6px;font-size:.8rem;font-weight:700;background:var(--teal-l);color:var(--teal)">☪ '+sl.scholarNote+'</div>';
    if(sl.parentNote)  html += '<div style="margin-top:8px;font-size:.78rem;color:var(--ink-4);font-style:italic;border-left:2px solid var(--ink-5);padding-left:8px">'+sl.parentNote+'</div>';
  }
  return html;
}
