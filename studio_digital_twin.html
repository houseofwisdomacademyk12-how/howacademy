function getTownSystemForProject(p){
  // Check explicit townSystem field (user-documented projects)
  if(p.townSystem) return p.townSystem;
  // Check SEED map
  if(SEED_TOWN_MAP[p.id]) return SEED_TOWN_MAP[p.id];
  // Fallback: infer from studio
  var studioMap = {eng:'infrastructure', sky:'research', med:'health', math:'knowledge', hum:'knowledge', map:'navigation', cal:'knowledge', nat:'food'};
  return studioMap[p.studio] || 'knowledge';
}

function getSystemStats(){
  var all = getAllProjects();
  var stats = {};
  TOWN_SYSTEMS.forEach(function(s){ stats[s.id] = {count:0, projects:[]}; });
  all.forEach(function(p){
    var sys = getTownSystemForProject(p);
    if(stats[sys]){ stats[sys].count++; stats[sys].projects.push(p); }
  });
  return stats;
}

function getCurrentWeekTownData(){
  var week = parseInt(localStorage.getItem('how_week')||'1')||1;
  return { week: week, data: STUDIO_TOWN[String(week)] || null };
}

function _getTownGradeBand(){
  var g=parseInt((getSettings().grade)||7);
  return g<=2?'k2':g<=5?'s35':g<=8?'s68':'s912';
}

function _getTownDiffBand(){
  var g=parseInt((getSettings().grade)||7);
  return g<=4?'k4':g<=8?'m58':'h912';
}

// ── HISTORICAL PRECEDENTS (one per week) ──────────────────────────────────
// {work, date, scholar, desc, connection}
var HAYY_PRECEDENTS={
  1:{work:'Tabula Rogeriana',date:'1154',scholar:'Al-Idrisi',desc:'Al-Idrisi spent fifteen years gathering accounts from travelers across three continents to produce the most accurate world map of the medieval period, drawn for King Roger II of Sicily. He compiled conflicting reports, triangulated claims, and marked areas of uncertainty.',connection:'What you\'re drawing this week, Al-Idrisi did for the whole known world. The method is the same: observe, record, resolve conflicts, commit to a projection.'},
  2:{work:'Alhambra tiling systems',date:'c. 1350',scholar:'Nasrid craftsmen, Granada',desc:'The palace complex at the Alhambra contains examples of all 17 mathematically possible wallpaper symmetry groups — a fact rediscovered by mathematicians in the 19th century. The craftsmen achieved this through geometric construction alone, without modern group theory.',connection:'The tiling problem the town council gave you is the same constraint these builders solved: no gaps, no waste, no broken symmetry.'},
  3:{work:'Great Mosque of Córdoba — hypostyle hall',date:'786–987',scholar:'Multiple architects across three centuries',desc:'The mosque\'s great hall solved a structural problem without modern materials: available column heights were too short. Architects doubled the arches — a lower arch carrying a taller one — to reach unprecedented ceiling height. The solution was structural ingenuity within constraint.',connection:'Your masjid design faces the same core question: what does the space require, and how does structure serve prayer?'},
  4:{work:'Kitāb al-Mukhtaṣar — land division methods',date:'830',scholar:'Al-Khwārizmī',desc:'Al-Khwārizmī\'s algebra was developed partly to solve practical problems: how to divide an inheritance fairly when the estate includes land, debt, and uncertain assets. His geometric proofs made the division visible — you could see why the shares were equal.',connection:'The water wheel division the town needs is exactly the kind of problem Al-Khwārizmī built his system to solve. Fair division of continuous quantities.'},
  5:{work:'Zīj-i Khāqānī — observatory at Samarkand',date:'1413–1420',scholar:'Al-Kāshī',desc:'Al-Kāshī computed sine tables to nine sexagesimal decimal places and designed instruments for the Samarkand observatory. His arc — carved into a hillside — was so large a person could walk along it. Precision required scale.',connection:'Your direction system, like the observatory, is only reliable if it can be reproduced by someone who wasn\'t there when you built it.'},
  6:{work:'Muqaddimah — on the necessity of writing',date:'1377',scholar:'Ibn Khaldūn',desc:'Ibn Khaldūn argued that civilization depends on writing not just to record, but to make knowledge transferable across time and distance. Oral transmission degrades; written transmission accumulates. A civilization without consistent script cannot build on its own past.',connection:'The town\'s inconsistent handwriting is exactly the failure Ibn Khaldūn described. Your work this week is a foundational act.'},
  7:{work:'Kitāb al-Manāẓir — camera obscura',date:'1011–1021',scholar:'Ibn al-Haytham',desc:'Ibn al-Haytham sealed a room completely, leaving only a small hole. The inverted image of the world outside appeared on the opposite wall. He used this to prove that vision comes from light entering the eye — not from rays the eye projects outward, as Euclid had claimed.',connection:'Your optics challenge — getting light into a dark meeting hall — is the same problem Ibn al-Haytham turned into a proof about the nature of sight.'},
  8:{work:'Al-Battānī\'s Zīj — star catalogue',date:'c. 900',scholar:'Al-Battānī',desc:'Al-Battānī spent forty years at his observatory in Raqqa measuring star and planet positions. His tables corrected errors in Ptolemy that had accumulated over seven centuries. Copernicus cited his lunar observations directly in De Revolutionibus — 600 years later.',connection:'The star positions you\'re charting for the trade journey are the same positions navigators have always needed. Al-Battānī made them reliable enough to last six centuries.'},
  9:{work:'Al-Qānūn fī al-Ṭibb — Book II, pharmacopoeia',date:'1025',scholar:'Ibn Sīnā',desc:'Book II of Ibn Sīnā\'s Canon lists 800 medicinal plants with their preparation method, observed effects, contraindications, and required dosage. Crucially, it records what was tried and what failed — the negative results are as important as the positive ones. European medical schools used it until the 17th century.',connection:'The medicinal garden record you\'re keeping this week is what Ibn Sīnā\'s pharmacopoeia started as: careful observation, noted by hand, in sequence.'},
  10:{work:'Murūj al-Dhahab — Meadows of Gold',date:'947',scholar:'Al-Masʿūdī',desc:'Al-Masʿūdī traveled from Morocco to China and recorded what grew, swam, flew, and walked in each region — not as curiosity but as systematic natural history. He noted which species appeared together, which seasons they followed, and which environments they required.',connection:'What you\'re doing in the surrounding land this week, Al-Masʿūdī did across three continents. Observation before classification.'},
  11:{work:'Bayt al-Ḥikma translation program',date:'9th century',scholar:'Ḥunayn ibn Isḥāq',desc:'Ḥunayn led the systematic translation of Greek medical and philosophical texts into Arabic. When Greek had no equivalent for a concept, he coined new Arabic terminology rather than borrowing the Greek word. He was building a technical vocabulary in real time — words that didn\'t exist until he needed them.',connection:'The text that arrived in a language no one reads is exactly Ḥunayn\'s starting problem. His method: find the meaning first, then find the word for it.'},
  12:{work:'Kitāb al-Ḥayawān — Book of Animals',date:'c. 860',scholar:'Al-Jāḥiẓ',desc:'Al-Jāḥiẓ classified 350 species, described food chains, and noted how animals adapt to their environments — observations that resemble evolutionary thinking fifteen centuries before Darwin\'s vocabulary existed. His system required naming things consistently before he could compare them.',connection:'The market classification problem is the same: without consistent naming, you cannot compare, count, or trade reliably.'},
  13:{work:'Madrasa al-Niẓāmiyya — Baghdad',date:'1065',scholar:'Niẓām al-Mulk (architect unknown)',desc:'The first purpose-built university in the world. Its spatial design separated public and private zones, allocated natural light to reading spaces through courtyard geometry, and structured movement so students could work without interruption. Space was designed to support the cognitive work that happened inside it.',connection:'Your school design faces the same question: how does a building make thinking easier?'},
  14:{work:'Jābir\'s laboratory records',date:'8th century',scholar:'Jābir ibn Ḥayyān',desc:'Jābir kept the first systematic records of chemical experiments with controlled conditions: apparatus described precisely enough to reproduce, reactions noted with their temperatures and durations, failures recorded alongside successes. The word "alchemy" derives from his practice. The method — record everything, especially what went wrong — is still the method.',connection:'Two plants reacted unexpectedly. Jābir\'s answer to exactly this situation was: write it down before you forget what conditions produced it.'},
  15:{work:'Ibn al-Nafīs\'s medical summaries — on transmission',date:'13th century',scholar:'Ibn al-Nafīs',desc:'Ibn al-Nafīs discovered pulmonary circulation — blood moving through the lungs, not directly between heart chambers as Galen claimed. He embedded this discovery in texts explicitly designed for wide copying and distribution, understanding that a finding only matters if it travels. His pulmonary discovery reached Europe three centuries later.',connection:'The town\'s announcement problem is the same transmission problem Ibn al-Nafīs solved for medical knowledge: how does something important reach everyone who needs it?'},
  16:{work:'Al-Tūsī couple — geometric device',date:'1247',scholar:'Naṣīr al-Dīn al-Tūsī',desc:'Al-Tūsī invented a geometric mechanism — two circles, one rolling inside the other — that produces perfect linear motion from circular motion. He used it to correct a fundamental flaw in Ptolemaic astronomy. Copernicus used the same device in De Revolutionibus without crediting him.',connection:'Your sundial\'s clock drift is a geometric problem. Al-Tūsī showed that geometry, precisely applied, can fix systematic error.'},
  17:{work:'The Riḥla — route reconstruction',date:'1355',scholar:'Ibn Baṭṭūṭa',desc:'Ibn Baṭṭūṭa dictated his 75,000-mile journey from memory to the scholar Ibn Juzayy. The reconstructed routes span forty countries over twenty-nine years — navigated by landmark, bearing, and elapsed time, recorded years after the journey ended.',connection:'The traveler arrived with stories but no map. Ibn Baṭṭūṭa\'s method: start with what you remember, fix what you can check, mark what you\'re uncertain about.'},
  18:{work:'Determination of Earth\'s circumference',date:'c. 1420',scholar:'Al-Kāshī',desc:'Using gnomon shadow measurements at different latitudes, Al-Kāshī computed Earth\'s radius to within 0.1% of the modern value. The gnomon — a vertical rod — was the only instrument. The precision came from calculation, not from better tools.',connection:'Your sundial\'s angle is the same problem: the gnomon\'s shadow encodes latitude, and latitude determines the correct angle. Al-Kāshī extracted Earth\'s size from the same geometry.'},
  19:{work:'Kitāb al-Fawāʾid — pilot\'s manual',date:'1490',scholar:'Aḥmad ibn Mājid',desc:'Ibn Mājid\'s sailing manual described forty routes with star bearings, seasonal wind patterns, coastal landmarks, and hazard notes. It was practical knowledge accumulated from centuries of Indian Ocean navigation, organized so a pilot who had never sailed a route could follow it. Vasco da Gama reportedly used it to reach India.',connection:'Two families disagree about the safer path. Ibn Mājid\'s answer: observe the route in different conditions, record what matters, commit it to a document others can use.'},
  20:{work:'Kitāb fī Maʿrifat al-Ḥiyal — Book of Ingenious Devices',date:'1206',scholar:'Al-Jazarī',desc:'Al-Jazarī described 100 machines in enough detail to build them: a water-powered clock, a programmable automaton, a crankshaft mechanism — the first known description of a crankshaft, five centuries before it appeared in European engineering. Every device included materials, dimensions, and assembly sequence.',connection:'Moving water uphill is a mechanical problem. Al-Jazarī solved harder ones with the same approach: understand the forces, then design against them.'},
  21:{work:'The waqf institution — civic archive',date:'9th–13th century',scholar:'Various — documented by Ibn Baṭṭūṭa',desc:'Ibn Baṭṭūṭa observed that across the Islamic world, traveler infrastructure — rest houses, water stations, libraries — was funded through waqf endowments: permanent legal instruments that outlasted their founders. The institution turned a private act into a public record.',connection:'The town is in its third year with no formal record. A community that doesn\'t document itself cannot account for its own choices. The Archive is the waqf principle applied to knowledge.'},
  22:{work:'Al-Khiṭaṭ — topographic survey of Cairo',date:'1417',scholar:'Al-Maqrīzī',desc:'Al-Maqrīzī produced the first systematic urban geography of a major city: every neighborhood described, its founding history recorded, its current land divisions mapped, its changes over time traced. He showed that a city is not static — it is an accumulated record of decisions.',connection:'Three families, one plot, a fair division. Al-Maqrīzī\'s work shows that land has a history. Fair division requires knowing what came before.'},
  23:{work:'Al-Qarawiyyīn — campus and city',date:'859',scholar:'Fāṭima al-Fihrī',desc:'Fāṭima al-Fihrī founded the oldest continuously operating university in the world in Fez. The campus required connecting the university to the surrounding city across terrain that separated them. Infrastructure was not secondary to the institution — it made the institution possible.',connection:'The seasonal stream separating your two neighborhoods is the same problem al-Fihrī solved: a physical barrier is also a social barrier, and the bridge changes both.'},
  24:{work:'Muqaddimah — on why settlements fail',date:'1377',scholar:'Ibn Khaldūn',desc:'Ibn Khaldūn analyzed agricultural failure systematically: soil depletion, water mismanagement, disrupted crop cycles, broken market connections. He showed that collapse is rarely sudden — it accumulates from processes that were never tracked, never corrected, never finished.',connection:'The abandoned composting process is exactly the kind of incomplete project Ibn Khaldūn described: something started, interrupted, and now impossible to evaluate because no one recorded what was tried.'},
  25:{work:'Kitāb al-Manāẓir — pedagogical diagrams',date:'1011',scholar:'Ibn al-Haytham',desc:'Ibn al-Haytham\'s optical diagrams were the first to use geometric illustrations as primary explanatory tools, not decoration. Each diagram was designed so that a reader could understand the claim without reading the surrounding text. He invented a new genre: the explanatory drawing.',connection:'Teaching younger children about a tool without a written or drawn explanation is the problem Ibn al-Haytham solved for optics. Draw it so it teaches itself.'},
  26:{work:'Kitāb al-Mukhtaṣar — geometric algebraic proofs',date:'830',scholar:'Al-Khwārizmī',desc:'Al-Khwārizmī proved algebraic identities by literally constructing squares and rectangles. To solve x² + 10x = 39, he drew a square of side x, added four rectangles of width 2.5 along its sides, and showed geometrically why the result was 64. The proof was a physical construction.',connection:'The disputed corner — is it truly square? — is the question Al-Khwārizmī answered by building the proof with your hands, not just claiming the numbers.'},
  27:{work:'On vision and perceptual distance',date:'10th century',scholar:'Al-Fārābī',desc:'Al-Fārābī distinguished between what the eye receives and what the mind interprets, arguing that distance perception is not direct — the brain calculates it from multiple cues. When those cues conflict, the result is systematic perceptual error: things appear farther or closer than they are.',connection:'Your lookout post is giving false distance readings. Al-Fārābī\'s framework explains why: perception is inference, and the inference has conditions under which it fails.'},
  28:{work:'Geographic notation system',date:'1154',scholar:'Al-Idrīsī',desc:'Al-Idrīsī developed standardized map symbols: distinct marks for cities, ports, rivers, mountains, and uncertain terrain. Before this, every cartographer invented their own notation and maps from different sources were incompatible. A shared symbol system made knowledge cumulative.',connection:'The town\'s inconsistent sign system is the pre-Al-Idrīsī problem. Your work this week is to do what he did: establish the standard before the confusion compounds.'},
  29:{work:'Kitāb al-Hind — survey of abandoned settlements',date:'c. 1030',scholar:'Al-Bīrūnī',desc:'In his study of India, Al-Bīrūnī surveyed ruins and recorded why settlements were abandoned: water sources that dried up, defensive positions that became indefensible, trade routes that shifted. He was the first to treat ruins as evidence of decision-making, not just decay.',connection:'The unfinished building is a record of interrupted decisions. Al-Bīrūnī would want to know: what was intended, what stopped it, and what does the incompletion cost the community now?'},
  30:{work:'Determination of the solar year',date:'c. 880',scholar:'Al-Battānī',desc:'Al-Battānī measured the length of the solar year to within 24 seconds of the modern value — an error of less than 0.001%. His measurements underpinned the Islamic lunar calendar\'s continuous operation for over 1,400 years. One precise cycle, carefully measured, governed all subsequent cycles.',connection:'The town has completed one full year. Al-Battānī\'s question applies: how precisely did you measure the cycle, and what does that precision make possible for the next one?'}
};

function renderPrecedentCard(wk){
  var p=HAYY_PRECEDENTS[wk];
  if(!p) return '';
  return '<div style="background:var(--parchment);border:1px solid var(--gold-l);border-radius:10px;padding:18px 20px;margin-bottom:16px;position:relative;overflow:hidden">' +
    '<div style="position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--gold)"></div>' +
    '<div style="padding-left:10px">' +
      '<p style="font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px">Historical precedent</p>' +
      '<p style="font-size:15px;font-weight:600;color:var(--ink);margin-bottom:2px">'+p.work+'</p>' +
      '<p style="font-size:12px;color:var(--ink-3);font-style:italic;margin-bottom:10px">'+p.scholar+' · '+p.date+'</p>' +
      '<p style="font-size:13px;line-height:1.7;color:var(--ink-2);margin-bottom:10px">'+p.desc+'</p>' +
      '<div style="background:rgba(192,136,24,.1);border-radius:6px;padding:8px 12px">' +
        '<p style="font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em">Connection to your work</p>' +
        '<p style="font-size:13px;color:var(--ink-2);margin:0;line-height:1.6;font-style:italic">'+p.connection+'</p>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderTown(mc){
  var weekData = getCurrentWeekTownData();
  var wk = weekData.week;
  var td = weekData.data;
  var stats = getSystemStats();
  var allProjects = getAllProjects();
  var recentContrib = allProjects.filter(function(p){return p.year>='2023';}).slice(0,8);

  // Studio card for this week
  var sc = STUDIO_CARDS[String(wk)] || null;
  var oqBand = _getTownGradeBand();
  var diffBand = _getTownDiffBand();
  var oq = (OPENING_QS[String(wk)]||{})[oqBand] || '';
  var diffText = sc ? (sc.diff[diffBand] || sc.prompt || '') : '';
  var sysObj = td && td.townSystem ? (TOWN_SYSTEMS.find(function(s){return s.id===td.townSystem;})||TOWN_SYSTEMS[7]) : null;

  // Band labels for the studio card differentiation
  var bandLabel = diffBand==='k4'?'K–4':diffBand==='m58'?'Grades 5–8':'Grades 9–12';

  mc.innerHTML = '<div class="town-wrap">' +

    // ── HERO: Town brief + precedent + studio card ──────────────────
    '<div style="background:var(--parchment-2);border-bottom:1px solid var(--ink-5);padding:28px 32px 24px">' +

      // Title row
      '<div style="margin-bottom:20px">' +
        '<p style="font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--ink-4);margin-bottom:4px;text-transform:uppercase">حي الحكمة · Hayy al-Hikmah · Week ' + wk + '</p>' +
        '<h1 style="font-size:22px;font-weight:700;color:var(--ink);margin-bottom:2px">Quarter of Wisdom</h1>' +
        '<p style="font-size:13px;color:var(--ink-3)">' + allProjects.length + ' projects documented · ' + allProjects.reduce(function(a,p){return a+(p.buildOns||[]).length;},0) + ' build-ons · 8 systems active</p>' +
      '</div>' +

      // 0 · Live town map
      '<div style="border-radius:12px;overflow:hidden;margin-bottom:20px;border:1px solid var(--ink-5);background:#000">' +
        '<iframe src="https://rosebud.ai/d/the-town" width="100%" height="480" frameborder="0" allow="fullscreen" allowfullscreen style="display:block;width:100%;height:480px;border:none"></iframe>' +
      '</div>' +

      // 1 · Town need
      (td && sysObj ? (
        '<div style="background:'+sysObj.bg+';border-radius:10px;padding:18px 20px;margin-bottom:16px;border:1px solid '+sysObj.color+'33">' +
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
            '<span style="font-size:20px">'+sysObj.icon+'</span>' +
            '<div>' +
              '<p style="font-size:11px;font-weight:600;letter-spacing:.07em;color:'+sysObj.color+';text-transform:uppercase;margin-bottom:1px">'+sysObj.label+' system · this week\'s need</p>' +
              (sc?'<p style="font-size:16px;font-weight:600;color:var(--ink);margin:0">'+sc.title+'</p>':'') +
            '</div>' +
          '</div>' +
          '<p style="font-size:14px;line-height:1.75;color:var(--ink-2);margin:0">'+td.townNeed+'</p>' +
        '</div>'
      ) : '') +

      // 2 · Historical precedent
      renderPrecedentCard(wk) +

      // 3 · Studio card — grade-differentiated prompt
      (sc ? (
        '<div style="background:var(--parchment);border-radius:10px;padding:18px 20px;margin-bottom:16px;border:1px solid var(--ink-5)">' +
          '<p style="font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--ink-4);text-transform:uppercase;margin-bottom:6px">Your studio project this week · '+bandLabel+'</p>' +
          '<p style="font-size:13px;line-height:1.75;color:var(--ink-2);margin-bottom:0">'+diffText+'</p>' +
        '</div>'
      ) : '') +

      // 4 · Munazara seed
      (oq ? (
        '<div style="border-left:3px solid var(--gold);padding:10px 14px;margin-bottom:18px;background:var(--parchment)">' +
          '<p style="font-size:11px;font-weight:600;color:var(--ink-4);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em">After you build — the question waiting for you</p>' +
          '<p style="font-size:13px;font-style:italic;color:var(--ink-2);margin:0">'+oq+'</p>' +
        '</div>'
      ) : '') +

      // CTA
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
        '<button class="btn primary" onclick="switchTab(document.querySelector(\'[data-tab=document]\'))">Document your build →</button>' +
        '<button class="btn" onclick="switchTab(document.querySelector(\'[data-tab=explore]\'))">Browse past projects</button>' +
      '</div>' +
    '</div>' +

    // ── COMMAND CENTRE ─────────────────────────────────────────────
    '<div class="town-cc-wrap">' +
      '<h2 class="town-section-title">Command Centre — all systems</h2>' +
      '<div class="town-systems-grid">' +
        TOWN_SYSTEMS.map(function(sys){
          var s = stats[sys.id];
          var isCurrentWeek = td && td.townSystem === sys.id;
          return '<div class="town-sys-node'+(isCurrentWeek?' town-sys-active':'')+'" style="--sys-color:'+sys.color+';--sys-bg:'+sys.bg+'" onclick="filterTownSystem(\''+sys.id+'\')">' +
            '<div class="town-sys-icon">'+sys.icon+'</div>' +
            '<div class="town-sys-label">'+sys.label+'</div>' +
            '<div class="town-sys-desc">'+sys.desc+'</div>' +
            '<div class="town-sys-count">'+s.count+' project'+(s.count!==1?'s':'')+'</div>' +
            (isCurrentWeek?'<div class="town-sys-badge">This week</div>':'') +
          '</div>';
        }).join('') +
      '</div>' +
    '</div>' +

    // ── CONTRIBUTIONS ──────────────────────────────────────────────
    '<div class="town-contrib-wrap" id="town-contrib">' +
      '<div class="town-contrib-header">' +
        '<h2 class="town-section-title" style="margin:0">Projects &amp; contributions</h2>' +
        '<button class="town-filter-clear" id="town-filter-clear" style="display:none" onclick="clearTownFilter()">Show all systems</button>' +
      '</div>' +
      '<div class="town-proj-list" id="town-proj-list">'+renderTownProjects(recentContrib)+'</div>' +
    '</div>' +

  '</div>';

}

function _capitalise(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : ''; }

function renderTownProjects(projects){
  if(!projects.length) return '<p style="color:var(--ink-4);padding:24px 0">No projects in this system yet — this week\'s studio card is the town\'s request.</p>';
  return projects.map(function(p){
    var sys = getTownSystemForProject(p);
    var sysObj = TOWN_SYSTEMS.find(function(s){return s.id===sys;}) || TOWN_SYSTEMS[7];
    return '<div class="town-proj-row" onclick="showProject(\'' + p.id + '\')">' +
      '<span class="town-proj-icon">' + (p.icon||'📋') + '</span>' +
      '<div class="town-proj-info">' +
        '<div class="town-proj-title">' + p.title + '</div>' +
        '<div class="town-proj-meta">' + (p.student||'Student') + ' · Grade ' + (p.grade||'?') + ' · ' + (p.year||'') + '</div>' +
      '</div>' +
      '<span class="town-proj-sys" style="background:' + sysObj.bg + ';color:' + sysObj.color + '">' + sysObj.icon + ' ' + sysObj.label + '</span>' +
    '</div>';
  }).join('');
}

function filterTownSystem(sysId){
  var projects = getAllProjects().filter(function(p){ return getTownSystemForProject(p)===sysId; });
  var list = document.getElementById('town-proj-list');
  var clearBtn = document.getElementById('town-filter-clear');
  var sysObj = TOWN_SYSTEMS.find(function(s){return s.id===sysId;});
  if(list){
    var title = document.querySelector('#town-contrib .town-section-title');
    if(title) title.textContent = (sysObj?sysObj.icon+' '+sysObj.label+' projects':'Projects');
    list.innerHTML = renderTownProjects(projects);
    if(clearBtn) clearBtn.style.display = 'inline-block';
  }
}

function clearTownFilter(){
  var all = getAllProjects().slice(0,8);
  var list = document.getElementById('town-proj-list');
  var clearBtn = document.getElementById('town-filter-clear');
  var title = document.querySelector('#town-contrib .town-section-title');
  if(title) title.textContent = 'Projects & contributions';
  if(list) list.innerHTML = renderTownProjects(all);
  if(clearBtn) clearBtn.style.display = 'none';
}
</script>
</body>
</html>
