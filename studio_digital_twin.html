var OPENING_QS={
  "1":{k2:"When you make something \u2014 a drawing, a tower, a story \u2014 where did it come from?",s35:"Al-Idrisi drew the whole world from knowledge he collected piece by piece. How do you build a picture of something you cannot see all at once?",s68:"What does it mean to create something that did not exist before \u2014 and how do you know it is true?",s912:"Al-Idrisi's map was wrong in places and still the most accurate of its time. When is a flawed creation better than no creation?"},
  "2":{k2:"What is a pattern? Can you find one in the classroom right now?",s35:"Al-Biruni found the same patterns in crystals, planets, and languages. Why do you think the same patterns keep appearing?",s68:"Why do the same mathematical patterns appear in nature, in music, and in the structure of language?",s912:"Is a pattern a property of the world, or a property of the mind that perceives it?"},
  "3":{k2:"What makes something strong enough not to fall down?",s35:"Ibn Rushd said a good argument is like a good building \u2014 everything has to support everything else. What does that mean?",s68:"What makes a structure strong \u2014 in a building, in an argument, in a community?",s912:"Ibn Rushd believed reason and revelation share a foundation. What holds your own beliefs together?"},
  "4":{k2:"If you had eight dates and three friends, how would you share them so it feels fair?",s35:"Al-Khwarizmi wrote his algebra book so that ordinary people could solve problems of inheritance and trade. Why did he think mathematics should belong to everyone?",s68:"Is fair always equal \u2014 and can mathematics tell the difference?",s912:"Islamic inheritance law gives daughters half what sons receive. Al-Khwarizmi built algebra to calculate it precisely. What does precision in an unjust system produce?"},
  "5":{k2:"What is the difference between nearly right and exactly right? Does it always matter?",s35:"Al-Kashi spent years calculating pi to 16 decimal places. Why would anyone spend years on a calculation that was already good enough?",s68:"What is the difference between an approximation and the truth \u2014 and does it always matter?",s912:"All scientific measurement contains error. Does that mean science only produces approximations, never truth?"},
  "6":{k2:"How do you know when someone is telling the truth?",s35:"Ibn Khaldun said that most history is wrong because historians copy each other without checking. How would you check whether something written a thousand years ago is true?",s68:"How do you know when to trust what you read \u2014 and what would a world with no reliable knowledge look like?",s912:"Ibn Khaldun invented the scientific study of history. What assumptions do you have to make before you can trust any source at all?"},
  "7":{k2:"What is the difference between looking at something and really seeing it?",s35:"Ibn al-Haytham spent years in a dark room testing how light worked. What does it take to observe something so carefully that you change what everyone believes?",s68:"What is the difference between seeing and observing \u2014 and why does the difference matter?",s912:"Ibn al-Haytham said: do not trust any result until you have tested it yourself. What would it cost you to apply that principle to everything you believe?"},
  "8":{k2:"A circle is the same shape no matter how big it is. Why do you think that is?",s35:"Pi is the same for every circle on Earth, on Mars, and in every galaxy. What does it mean that a number can be true everywhere?",s68:"Why is pi the same for every circle everywhere \u2014 and what does that tell us about the universe?",s912:"Al-Battani used circles to map the heavens. Al-Muhit surrounds all existence. Is the circle a mathematical fact, a physical reality, or a spiritual symbol \u2014 or all three at once?"},
  "9":{k2:"A plant knows which way is up before it reaches the soil. How does it know?",s35:"Ibn Sina described the body as a system where everything connects. What happens to a system when one part stops working?",s68:"What makes a living system different from a very complicated machine?",s912:"Al-Latif is the subtly kind \u2014 care that arrives before it is asked for. Is there a parallel between divine providence and the self-regulating systems of living organisms?"},
  "10":{k2:"What is something in your life that is always changing? What is something that always stays the same?",s35:"Al-Masudi travelled for 30 years to understand how peoples and landscapes change. What do you think stays constant while everything around it transforms?",s68:"How do you measure change \u2014 and what stays constant while everything else transforms?",s912:"Al-Halim is the forbearing \u2014 unchanged by provocation. In a world where everything changes, what is the value of constancy?"},
  "11":{k2:"If you translated a book from Arabic to English, would it still be the same book?",s35:"Hunayn ibn Ishaq said a good translation requires you to understand the idea so completely that you can express it in a different language as if you had thought of it yourself. What do you think is hardest about that?",s68:"What is lost and what is gained when knowledge moves from one language to another?",s912:"The Quran is untranslatable \u2014 its meaning depends on its Arabic. Hunayn translated Greek science into Arabic and saved it. What is the relationship between language and truth?"},
  "12":{k2:"What happens when you take something out of its place \u2014 a rock from a garden, an animal from its home?",s35:"Al-Jahiz wrote that every animal has a place in nature, and when something takes more than its share, the order breaks. What examples can you think of?",s68:"What is the natural order of things \u2014 and what happens when that order is disturbed?",s912:"Al-Ghafur covers and conceals wrongdoing. In ecology, a disturbed system tries to restore equilibrium. Is the desire for order a property of nature, or of mind?"},
  "13":{k2:"What is the difference between knowing the answer and understanding why it is true?",s35:"Al-Ghazali walked away from the most prestigious job in Baghdad to go in search of something more important than being right. What do you think he was looking for?",s68:"What is the difference between knowing something and being wise about it?",s912:"Al-Hakim is the all-wise. Al-Ghazali argued that Islamic scholars had confused knowledge with wisdom. What is the difference, and can a person have one without the other?"},
  "14":{k2:"Have you ever given something away and felt richer for giving it?",s35:"Jabir ibn Hayyan gave his discoveries away freely \u2014 he wrote down his methods so that anyone could use them. What does it mean to give knowledge?",s68:"When you give something without expecting return \u2014 what does that change about the exchange?",s912:"Al-Wadud is love that gives without requiring lovability in return. Jabir built chemistry on sharing method. Is generosity in knowledge the same as generosity in love?"},
  "15":{k2:"How would you tell someone something important if they did not speak your language?",s35:"Ibn al-Nafis proved the blood circulates through the lungs \u2014 something everyone believed was impossible. How do you convince people of something true when they are certain it is false?",s68:"How do you communicate something you know is true when everyone around you believes something different?",s912:"Al-Qawiyy is strength \u2014 but the Prophet \ufdfa said the strongest person is not the one who wins fights but the one who controls themselves when angry. What is the strongest form of communication?"},
  "16":{k2:"What cycles do you depend on every day without thinking about them?",s35:"Al-Tusi showed that a straight line can be produced by two circles going around each other. What other things that seem simple turn out to be cycles underneath?",s68:"What cycles do you depend on that you never notice \u2014 and what would happen if they stopped?",s912:"Al-Waliyy is the protecting friend \u2014 the guardian who sustains cycles of care invisibly. Is it possible to understand a system from the inside, while you are sustained by it?"},
  "17":{k2:"Has someone you have never met ever taught you something?",s35:"Ibn Battuta received hospitality and knowledge from strangers across 44 countries. He gave his whole life to writing it all down so others could learn from people they would never meet. What does that kind of generosity look like?",s68:"What knowledge did you receive this week from someone who will never know you existed?",s912:"Al-Karim gives before being asked. The Islamic scholarly tradition flows through isnad chains \u2014 named people giving named people what was given to them. What do you owe to people you have never met?"},
  "18":{k2:"Have you ever done something carelessly and wished you had paid more attention?",s35:"Al-Kashi checked his calculations of pi again and again because he knew a small error in astronomy becomes a large error over time. What in your own life gets worse when you are not precise?",s68:"What did you do this week that you would have done differently if you had been fully paying attention?",s912:"Al-Raqib watches every act and every intention. Precision is a form of attention. What is the relationship between being watched and doing careful work?"},
  "19":{k2:"Have you ever arrived somewhere and found it was much bigger than you imagined?",s35:"Ibn Majid navigated by stars across oceans he had never seen. What does it feel like to commit to a direction when you cannot yet see the destination?",s68:"Where this week did you encounter something larger than your frameworks could contain?",s912:"Al-Wasi is spacious beyond all measure. Every expanding understanding requires letting go of the frame that used to contain it. What do you have to give up in order to understand something genuinely new?"},
  "20":{k2:"What is the most useful tool you own? What does it let you do that you could not do without it?",s35:"Al-Jazari built a clock powered by water that told not just the time but the movements of the sun and moon. What does it mean to build something that does the thinking for you?",s68:"What did you receive this week that enabled you to do what you were trying to do?",s912:"Al-Muqit provides the precise nourishment each thing needs to be itself fully. Is a tool that extends your capability also extending your nature \u2014 or replacing part of it?"},
  "21":{k2:"What is something from long ago that you still use every day?",s35:"Ibn Battuta recorded everything he saw across three continents so that people who would never travel could know the world. What would be lost if he had not written it down?",s68:"What did you count or measure this week that revealed something the looking alone had missed?",s912:"Al-Hasib is the reckoner \u2014 every atom accounted for. Heritage is what we choose to count. What gets lost from history when we do not measure it carefully?"},
  "22":{k2:"Is it possible to be fair with numbers? Can mathematics be just?",s35:"Al-Maqrizi studied what happened when rulers debased the currency and the poor suffered first. How do numbers and justice connect?",s68:"In your work this week \u2014 what determined the precise measure that made the system work?",s912:"Al-Muqaddir decrees exact measures. Al-Maqrizi documented exact economic injustice. Is measurement in the service of justice the same as measurement in the service of efficiency?"},
  "23":{k2:"What is the hardest thing about beginning something you have never done before?",s35:"Fatima al-Fihri used her inheritance to build a university when no such thing existed. What do you think she was most afraid of?",s68:"What did you begin this week that had no template?",s912:"Al-Mubdi originates without model or precedent. Fatima al-Fihri began al-Qarawiyyin \u2014 the oldest continuously operating university \u2014 1200 years ago. What does it take to create an institution rather than just a building?"},
  "24":{k2:"Have you ever understood something, forgotten it, and then understood it again? Did it feel different the second time?",s35:"Ibn Khaldun described how civilisations collapse and then are rebuilt \u2014 not the same, but carrying something from what came before. What survives a collapse?",s68:"What understanding did you rediscover this week \u2014 something forgotten that came back?",s912:"Al-Muid is the restorer \u2014 nothing truly lost, only waiting to be brought back. Is restoration the same as creation, or something different?"},
  "25":{k2:"Who taught you something this year that you will teach someone else someday?",s35:"Ibn al-Haytham's method of experiment was so powerful that it was still being taught 900 years later. How does a way of thinking stay alive across centuries?",s68:"What came alive in you this week that had been dormant?",s912:"Al-Muhyi gives life not only to bodies but to hearts \u2014 through knowledge, through remembrance. What is the difference between information and living knowledge?"},
  "26":{k2:"How do you prove something is true? What counts as proof?",s35:"Al-Khwarizmi showed that every algebraic statement can be tested \u2014 both sides of the equation must balance. What does it mean for a statement to be a claim that can be checked?",s68:"What bore witness to your effort this week \u2014 and what would it testify about you?",s912:"Al-Shahid witnesses not from outside but from within the reality of what is witnessed. What is the difference between evidence and witness?"},
  "27":{k2:"What is something you were certain about at the beginning of the year that you are less certain about now?",s35:"Al-Farabi said that logic is the tool for separating what is actually true from what only seems true. How do you know when you have found real truth rather than convincing yourself?",s68:"What were you most confident about this week \u2014 and how do you know you were right?",s912:"Al-Haqq is not merely accurate but the ground of all accuracy. Al-Farabi built logic as a ladder toward truth. At what point does the ladder become unnecessary?"},
  "28":{k2:"Can you make something that is completely new \u2014 something that is not made of anything you have seen before?",s35:"Al-Idrisi's second great map combined Arab, African, and Greek knowledge into something that had never existed. How do you make something new from things that already exist?",s68:"What did you create this week that did not exist before?",s912:"Al-Badi creates without precedent \u2014 the universe is not a copy of anything. Is human creativity ever genuinely original, or always recombination?"},
  "29":{k2:"What is something you started this year that you are still working on?",s35:"Al-Biruni spent years learning Sanskrit so he could translate Indian mathematics. Why do some things worth doing take years?",s68:"What did you have to wait for this week \u2014 and what did the waiting teach you?",s912:"Al-Sabur is patient not because nothing matters, but because everything will arrive at its proper time. What is the difference between patience and passivity?"},
  "30":{k2:"What did you know at the beginning of this year that you did not know before?",s35:"Al-Battani measured the solar year \u2014 the time it takes for everything to return to where it began. What returns at the end of a year of learning?",s68:"What was the first question you carried into this year \u2014 and what question do you carry forward?",s912:"Al-Awwal and Al-Akhir \u2014 the first and the last, the boundaries within which all time exists. What question about existence do you carry that no year of learning will fully answer?"},
};

var STUDIO_CARDS={
  "1":{"title": "Your World, Your Map", "discipline": "Cartography", "scholar": "Al-Idrisi", "prompt": "[Cartography] Your world, your map: Draw a map of a place you know completely from memory. Include everything that matters to you, not just what would appear on an official map. Label it. Compare it with another student's map of the same place — what did each of you include that the other did not?", "diff": {"k4": "Young students should focus on drawing three to five big things they love about the place, using pictures more than words, and labelling with your help. Skip the fraction comparison — instead, simply count together how many things each map has and celebrate what is different as a discovery rather than an analysis.", "m58": "Students in this band should aim for fifteen or more labelled features and attempt the fraction and set comparison in Step 5 independently, recording their arithmetic in the Sahifa. Encourage them to experiment with a simple scale — for example, deciding that one hand-width on the page equals ten metres — and to reflect on where their memory was confident versus uncertain.", "h912": "Older students should research Al-Idrisi's method of compiling the Tabula Rogeriana from informant interviews and write a short comparison between that epistemology and their own memory-based process. They should also formalise the Step 5 comparison using set notation (A ∩ B, A \\ B) and consider what systematic biases might explain which features each mapper included or omitted."}, "sahifaPrompt": "Al-Idrisi built his map of the world from the memories and stories of travellers — and today I built a map from my own memory of ___. When I compared my map with another, I noticed that I had included ___ but they had not, which made me think that a map always shows ___."},
  "2":{"title": "Rules Hidden in Patterns", "discipline": "Geometry", "scholar": "Al-Biruni", "prompt": "[Geometry] Pattern hunting: Find three patterns in the physical space around you that repeat. Document each: draw it, name it, describe the rule that generates it. Then make your own pattern that follows a rule you invent.", "diff": {"k4": "Younger students should focus on finding and drawing two patterns rather than three, and can state their rule verbally while the facilitator scribes it for them. For the invented pattern, offer a simple constraint such as 'use only triangles and squares' to scaffold the rule-making without requiring abstract language.", "m58": "Students in this band should connect pattern rules to numeric descriptions — for example, identifying that a tile pattern repeats every 4 units and linking that to place-value ideas about grouping and periodicity. Their invented pattern rule must be written in words and also expressed as a simple numeric or step sequence before drawing begins.", "h912": "High-school students should attempt to classify each found pattern using basic transformation vocabulary — translation, reflection, rotation, or glide reflection — and discuss whether any patterns belong to the same symmetry family. Their invented pattern should be accompanied by a formal rule written as a transformation sequence, and they should consider whether their pattern could tile an infinite plane without gaps or overlaps."}, "sahifaPrompt": "Al-Biruni believed that careful observation was the beginning of all knowledge. Today I found a pattern in _______ and discovered that its rule is _______. This made me think that patterns in the world around me are really _______ waiting to be named."},
  "3":{"title": "Paper Towers, Reasoned Failures", "discipline": "Architecture", "scholar": "Ibn Rushd", "prompt": "[Architecture] Build a load-bearing structure: Using only paper and tape, build the tallest structure that can support a book for 30 seconds. Document each attempt: what failed, what you changed, what worked. Ibn Rushd would have called this iterative reasoning.", "diff": {"k4": "Give younger students pre-rolled paper tubes secured with tape so they start with columns rather than flat sheets, reducing fine-motor frustration. Limit documentation to a simple drawing of each attempt with a smiley or sad face for 'worked' or 'fell.' Focus the conversation on push and pull with hands-on demonstration rather than the vocabulary of compression and tension.", "m58": "Students should measure and record height, number of sheets used, and time-to-failure for every attempt in a simple table, practicing estimation and unit accuracy. Introduce the concept of load distribution and ask them to identify the weakest point before each test, then verify whether their prediction was correct. Encourage at least four distinct attempts with a written hypothesis before each one.", "h912": "Challenge students to sketch a formal force diagram for their best structure, labeling compressive and tensile members and estimating the approximate load in newtons using the book's mass. Ask them to write a short paragraph connecting Ibn Rushd's method of reconciling observed evidence with reasoned principle to the engineering design loop they just practiced. Extend further by calculating structural efficiency as load supported divided by mass of paper used."}, "sahifaPrompt": "Ibn Rushd believed that truth is found not in a single brilliant idea but in the patient work of testing, failing, and revising. Today I built _______ structures, and the moment I understood something new was when _______. If Ibn Rushd had watched my hands at the table, I think he would have said _______ about the way I reasoned through failure."},
  "4":{"title": "Dividing Circles with Precision", "discipline": "Geometry", "scholar": "Al-Khwarizmi", "prompt": "[Geometry] The mathematics of fair sharing: Using compass and straightedge only, divide a circle into equal parts: first 2, then 4, then 8. Now attempt 3 and 6. Document: which divisions are geometrically exact? Which require approximation? Why?", "diff": {"k4": "Younger students should focus only on the 2 and 4 divisions, using a pre-drawn circle traced from a cup or jar lid. The facilitator guides the ruler placement while the student draws. The key discovery is simply: 'a straight line through the middle makes two equal parts, and two lines make four.' Coloring the sections and counting them is the core documentation task.", "m58": "Students work independently through all divisions — 2, 4, 8, 3, and 6 — and use the protractor to verify their angles, recording results in a simple table (divisions / central angle / exact or approximate). They should articulate in writing why the radius-stepping method works for 6 divisions, connecting it to the relationship between a circle's radius and its circumference.", "h912": "After completing all constructions, students research which regular polygons are constructible with compass and straightedge (the Gauss-Wantzel theorem) and write a short reflection on why 5-divisions require approximation while 3 and 6 do not. They should connect the concept of constructibility to the idea of irrational numbers and explain why a 360° angle cannot always be divided into whole-number-degree sectors using only exact Euclidean tools."}, "sahifaPrompt": "Al-Khwarizmi believed that mathematics reveals the hidden order within creation. Today, when I tried to divide my circle into equal parts, I discovered that ___________________. The division that surprised me most was ___________________, because I expected it to be easy, but I found that..."},
  "5":{"title": "Five Ways to Know", "discipline": "Astronomy", "scholar": "Al-Kashi", "prompt": "[Astronomy] Measure the same thing five ways: Choose one object. Measure it using five different methods or tools. Record every measurement and its source of error. Calculate the mean. Write: what does the spread of your measurements tell you about the difference between precision and accuracy?", "diff": {"k4": "Younger students should focus on just three methods — ruler, string, and hand-span — and draw pictures of each tool rather than writing an error column. The facilitator names the error sources aloud together with the child, and the 'mean' concept can be simplified to 'which answer is in the middle of all our guesses?' No formal vocabulary is required; the goal is noticing that different tools give different answers.", "m58": "Students in this band complete all five methods independently, write their own error sources, and calculate the mean and range without facilitation. Push them to convert all measurements to the same unit (millimeters) before averaging, and introduce the terms precision and accuracy explicitly after their reflection is written — checking their intuitive definitions against the formal ones.", "h912": "Older students should calculate not just the mean and range but also identify which measurements they would exclude as outliers and justify why. Challenge them to research the concept of significant figures and rewrite all five measurements with appropriate sig-fig notation. As an extension, ask them to write a paragraph arguing whether a single highly accurate measurement is more valuable than five clustered precise ones — a genuine debate in metrology that Al-Kashi implicitly engaged every time he revised a table."}, "sahifaPrompt": "Al-Kashi never trusted a single calculation — he checked and rechecked until the numbers earned his confidence. Today I measured _______ five different ways and found that my results spread across a range of _______. What this spread taught me about the difference between precision and accuracy is that"},
  "6":{"title": "Letters Written With Attention", "discipline": "Calligraphy", "scholar": "Ibn Khaldun", "prompt": "[Calligraphy] The art of the question: Write the opening question for this week in your best handwriting — or attempt Arabic calligraphy. The goal is not beautiful letters but letters written with full attention. Reflect: what happened when your attention wandered?", "diff": {"k4": "Younger students should write only the key question word or a single short sentence rather than the full question. Focus entirely on one letter they find beautiful or tricky, drawing it large and slow three times. Skip the Arabic option and let them illustrate the meaning of the word alongside their handwriting.", "m58": "Students in this band should attempt the full question in careful handwriting and optionally copy two or three Arabic letters from the alphabet guide, connecting them into a short word. Ask them to write a one-sentence observation connecting the idea of 'attention in writing' to the precision required in mathematical notation — for example, the difference between 2³ and 23.", "h912": "Older students should attempt a full line of Arabic script using the reference guide, working letter by letter, and then write a short analytical paragraph (three to five sentences) comparing the discipline of calligraphy to the conventions of scientific or mathematical communication. They should engage with Ibn Khaldun's concept of malaka — the habitual skill built through repetition — and argue whether attention or repetition is the more foundational requirement."}, "sahifaPrompt": "Ibn Khaldun believed that true skill in any craft — including writing — is built letter by letter, through habits of care. Today when I wrote the question with full attention, I noticed __________. The moment my attention wandered was when __________, and that taught me something about how I communicate in mathematics and science too."},
  "7":{"title": "Light's Secret Upside-Down Room", "discipline": "Optics", "scholar": "Ibn al-Haytham", "prompt": "[Optics] Build a pinhole camera using a cardboard box or tube. Observe what it projects. Document: is the image right-side up or inverted? What does this tell you about how light travels? This is exactly the experiment Ibn al-Haytham performed in his darkened room in 1011 CE.", "diff": {"k4": "Young students should skip the box construction and instead use a ready-made paper-towel tube with foil and a pinhole on one end — simpler to hold and aim. Focus entirely on the observation experience: ask them to draw the projected image and circle which way is 'up.' Adult does all cutting and pinhole-making.", "m58": "Students build the full box camera independently with light facilitation guidance. After observing, they draw a ray diagram showing two labeled light rays crossing at the pinhole to explain the inversion, and calculate the area of their traced projected image in square centimeters using the grid method.", "h912": "Students extend the experiment by testing two or three different pinhole sizes and documenting how image brightness and sharpness change, forming a testable hypothesis beforehand. They write a structured lab report in the style of Ibn al-Haytham's Kitab al-Manazir — observation, hypothesis, evidence, conclusion — and derive the relationship between pinhole size, image clarity, and light intensity qualitatively."}, "sahifaPrompt": "Today I built the same dark chamber that Ibn al-Haytham built in 1011 CE, and I discovered that the image on my screen was _______________. This happened because light travels in _______________ lines, which means that when I look at the world through a single point, everything _______________. Ibn al-Haytham wrote down exactly what he observed instead of just accepting what others believed, and the thing I noticed today that surprised me most was _______________."},
  "8":{"title": "Stars Drawn in Circles", "discipline": "Astronomy", "scholar": "Al-Battani", "prompt": "[Astronomy] The compass and the circle: Using compass and straightedge only: construct a circle, inscribe a regular hexagon, then a twelve-pointed star. Measure the circumference with string and compare to 2πr. Define the method Al-Battani would have used.", "diff": {"k4": "Younger students should skip the star construction and focus only on drawing the circle and marking the six hexagon points with the compass. Use a pre-cut length of string taped to the circle's edge so they can see it wrap around, and let them simply compare 'long' and 'short' rather than calculating percentage error. Narrate Al-Battani's story aloud while they work rather than asking them to write it.", "m58": "Students in this band should complete the full construction and calculate 2πr using their measured radius, then compute the percentage difference between the string measurement and the formula. Ask them to write two to three sentences connecting the geometric idea of π to the real act of measuring curved lines, and to explain in their own words why astronomers needed precise circle measurements.", "h912": "Older students should complete the construction and then derive why the compass-step hexagon construction works algebraically, using the relationship between the radius and the chord length. Ask them to research Al-Battani's specific value for the solar year or the obliquity of the ecliptic and to explain in a paragraph how geometric circle measurement contributed to that precision. They should also calculate the theoretical side length of the inscribed hexagon and verify it against their drawing."}, "sahifaPrompt": "Today I worked the way Al-Battani worked — using only a compass and a straight edge to find the shape hidden inside a circle. When I measured the circumference with string, I found it was ______, and the formula 2πr gave me ______. The difference made me think about how Al-Battani must have felt when his measurements of the sky were slightly off, because ______."},
  "9":{"title": "Living System in Miniature", "discipline": "Pharmacy", "scholar": "Ibn Sina", "prompt": "[Pharmacy] A living system in miniature: Set up a terrarium or small garden — soil, at least one plant, drainage. Observe it daily for one week. Document: what does it need to survive? What happens if one element is missing? Ibn Sina's Canon of Medicine began with observation of living systems.", "diff": {"k4": "Younger students should focus on sensory observation rather than measurement — have them describe the soil by touch, smell the plant, and draw a detailed picture each day rather than filling in a data table. Use three simple question prompts per day: 'What do you see? What did you give it today? Does it look happy or sad?' The facilitator can scribe answers while the student draws.", "m58": "Students in this band should manage the full observation log independently and be responsible for completing their own line graph at the week's end. Introduce the concept of a 'variable' — only one element should change at a time — and ask them to write a one-paragraph hypothesis before the missing-element experiment, then a one-paragraph conclusion after. Connect the data to the Grade 7 math context by discussing what the slope of their graph line tells them.", "h912": "Older students should research Ibn Sina's specific method of classifying plants in the Canon of Medicine (by temperament, degree, and action) and attempt to classify their own plant using his framework. They should write a formal lab report structure — question, hypothesis, method, results, conclusion — and include a section reflecting on the limits of single-observation science. Challenge them to propose a follow-up experiment that would make their findings more reliable."}, "sahifaPrompt": "Ibn Sina believed that a physician must first be a careful observer of the natural world before they can understand how to heal. This week I built a living system and watched it every day. I noticed that my plant most needed _______ to stay healthy, and when I removed _______, here is what happened: ..."},
  "10":{"title": "One Week, One Thing", "discipline": "Natural History", "scholar": "Al-Masudi", "prompt": "[Natural History] Document change: Choose one thing in the natural world that changes across the week — a plant, the sky at a fixed time, shadow length, temperature. Measure and record it every day. At the end: what stayed constant? What changed?", "diff": {"k4": "Younger students should focus on drawing rather than measuring, producing a picture-log where they sketch what they see each day and circle anything that looks different from the day before. At the end of the week, the facilitator reads the entries aloud together and the child points to what changed. Keep the subject simple and visually dramatic — a flower bud opening or a shadow growing longer works better than temperature.", "m58": "Students in this band should take at least one numerical measurement per day (height in centimeters, shadow length in centimeters, or temperature in degrees) alongside their sketch and description. At the end of the week, they should plot their measurements on a simple hand-drawn line graph and identify whether the change appears steady, sudden, or random — connecting directly to the Grade 7 math context of measuring and recording over time.", "h912": "Older students should design their log like a formal field study: recording units, potential sources of measurement error, and controlled versus uncontrolled variables each day. In the final synthesis, they should write a short analysis distinguishing between natural variation and directional change, and consider what additional data would be needed to determine whether an observed trend would continue — connecting their work to how Al-Masudi cross-referenced accounts from multiple sources before drawing conclusions."}, "sahifaPrompt": "Al-Masudi traveled across three continents recording what he observed so that patterns invisible to any single traveler would become visible across all of his accounts. After seven days of watching ______________, I noticed that what changed was ______________, but what stayed constant was ______________. This made me think that constancy might be just as worth recording as change, because ______________."},
  "11":{"title": "Translation Without Words", "discipline": "Calligraphy", "scholar": "Hunayn ibn Ishaq", "prompt": "[Calligraphy] Translate without words: Take a concept from this week's lessons — any subject — and communicate it without using any language. Diagrams, symbols, objects, gesture. Test it: can another person decode your meaning? Hunayn ibn Ishaq translated Greek knowledge into Arabic — he knew that translation is always interpretation.", "diff": {"k4": "Younger students should choose a simple, concrete concept — the water cycle, addition, a story sequence — and build their visual from pictures and arrows rather than abstract symbols. During the decoding test, sit beside them and let them point and gesture rather than staying fully silent; the goal is noticing that pictures still need interpretation.", "m58": "Students in this band should work with a genuinely abstract concept from their Grade 7 math or science context — for example, how an equation balances, or how a scientific diagram encodes a process — and be asked to justify each symbol choice in the debrief. Push them to identify at least one thing their visual system cannot express, naming it precisely.", "h912": "Older students should treat this as a design problem with explicit constraints: create a visual notation that could be handed to a stranger from a different background and still decoded correctly. After the session, ask them to write a short paragraph comparing their choices to the translator's dilemma — drawing on what they know about semiotics, mathematical notation history, or the translation movement of the Abbasid period."}, "sahifaPrompt": "Today I tried to translate _______ without using any words, the way Hunayn ibn Ishaq translated Greek ideas into Arabic without a perfect word-for-word match. The part of the concept my visual carried well was _______, but the part that got lost in translation was _______."},
  "12":{"title": "Sorting Nature from Scratch", "discipline": "Natural History", "scholar": "Al-Jahiz", "prompt": "[Natural History] Your own classification system: Collect 20 natural objects or images. Create your own classification system from first principles. Justify every category boundary. Then look up how Al-Jahiz classified similar objects. Where does your system agree? Where does it diverge?", "diff": {"k4": "Young students should work with 10 objects instead of 20 and sort into no more than 3 groups using a single visible property they can point to, such as color, size, or rough vs. smooth. The facilitator scribes the category labels and justification sentences while the student dictates. Skip the formal Al-Jahiz comparison and instead tell one story about how Al-Jahiz watched animals carefully before writing about them, connecting observation to the student's own sorting experience.", "m58": "Students work with the full 20 objects and are challenged to create at least two different valid classification systems for the same collection — for example, one based on physical traits and one based on ecological origin — then explain which system is more useful and why. When comparing to Al-Jahiz, they should identify at least one specific point of agreement and one divergence in writing, using set notation (e.g., 'My group A overlaps with Al-Jahiz's category of…') to connect to the math context on sets.", "h912": "Students build their classification system and then formally evaluate it against two criteria: internal consistency (does every object fit exactly one category?) and explanatory power (does the system predict anything about an object's behavior or relationships?). They should write a structured comparison paragraph arguing whether Al-Jahiz's behavioral-ecological approach or their own approach is epistemically stronger, citing specific category choices as evidence. As an extension, they may research how Linnaean taxonomy later formalized biological classification and consider what Al-Jahiz's method anticipated or missed."}, "sahifaPrompt": "Al-Jahiz believed that careful observation — watching how an animal lives, hunts, and survives — reveals more than appearance alone. When I sorted my collection, I decided to separate ________ from ________ because ________. If Al-Jahiz had held these same objects, I think he would have agreed with me about ________, but he might have questioned my choice to ________ because his system cared most about ________."},
  "13":{"title": "Designing Spaces That Teach", "discipline": "Architecture", "scholar": "Al-Ghazali", "prompt": "[Architecture] Structure that embodies wisdom: Design (on paper) a space for learning — a room, a garden, a courtyard. Every design decision must be justified: why this size, why this light, why this material? Al-Ghazali wrote about the conditions that make knowledge possible. Make those conditions physical.", "diff": {"k4": "Younger students should work at the scale of 'the whole page is the room' without worrying about numeric scale. Focus the session on three choices only — where you sit, where the light comes in, and one special thing in the room — and have the student draw and verbally explain each choice to the facilitator, who scribes the justifications onto the drawing for them.", "m58": "Students in this band should apply a chosen numeric scale (1 cm = 1 m is appropriate) and calculate the actual dimensions of their space, checking that the room is a realistic size for a human being. They should write at least six annotated justifications and explicitly connect two of their design decisions to the science of how environment affects concentration, mood, or physical comfort.", "h912": "Older students should research one historical Islamic learning space (such as the Qarawiyyin in Fes or the courtyard of the Madrasa al-Attarine) and identify at least two design principles from that building, then consciously adopt or consciously reject each one in their own design with written reasoning. Their annotation layer should function as a design argument — a written case that their space optimises the conditions Al-Ghazali identified as necessary for the acquisition of knowledge."}, "sahifaPrompt": "Al-Ghazali believed that the conditions around us shape whether knowledge can enter the heart. In my design, I chose _______ because I wanted the learner to feel _______. The hardest decision was _______, and what it taught me about learning is _______."},
  "14":{"title": "Reactions Jabir Would Record", "discipline": "Pharmacy", "scholar": "Jabir ibn Hayyan", "prompt": "[Pharmacy] Observable reactions: Combine at least three safe household materials and record what happens: colour change, temperature change, gas production, texture change, smell. Document each combination like Jabir ibn Hayyan would: materials, quantities, procedure, result. Which changes were reversible? Which were not?", "diff": {"k4": "Focus only on experiments one and two, and simplify documentation to a drawing of before and after rather than written columns. Ask the student to describe what they see using their five senses aloud while you scribe their words. Skip the formal reversibility vocabulary — ask simply 'Can we make it go back?' and let them try stirring or waiting.", "m58": "Have students complete all three experiments and write full documentation in Jabir's style, including units for every quantity. Introduce the terms 'chemical change' and 'physical change' and ask them to classify each experiment with a written justification. Add the ratio extension in Step 6 and have them calculate what quantities would be needed to run each experiment at a 3:1 scale.", "h912": "Challenge students to design a fourth experiment themselves, hypothesise the type of change before running it, and evaluate their hypothesis afterward. Require documentation in a formal lab-note format with variables identified. Ask them to research why curdling milk is used in cheesemaking and connect it to Jabir's broader contribution to early chemistry and pharmacological preparation — then write a paragraph on how systematic documentation advanced Islamic scientific tradition."}, "sahifaPrompt": "Today I worked like Jabir ibn Hayyan, recording every material and quantity before I made any change. The most surprising reaction I observed was _____, because _____. When I asked myself whether the change could be reversed, I discovered that _____."},
  "15":{"title": "Speaking Without Words", "discipline": "Calligraphy", "scholar": "Ibn al-Nafis", "prompt": "[Calligraphy] Communicate without shared language: You must communicate a scientific concept to someone who does not share your language. You may use diagrams, symbols, mathematical notation, and objects — but no words. Create the artefact. Test it: can another student decode your meaning?", "diff": {"k4": "Younger students should choose a very concrete, visual concept — a rainbow, a seed growing, day and night. Limit the artefact to three panels drawn in sequence, like a comic strip without words. The facilitator may act as scribe for the answer key and should read the decode test aloud to the child rather than asking for written responses.", "m58": "Students at this level should choose a concept with a measurable or proportional relationship — such as the relationship between distance and time, or the input and output of photosynthesis — and must include at least one piece of mathematical notation (an equation, inequality, or ratio) within their wordless composition. During the gap analysis in Step 6, ask them to identify which element functioned most like a universal symbol and why.", "h912": "Older students should select a multi-step physiological or physical process (Ibn al-Nafis's pulmonary circulation is an excellent choice) and must construct a visual grammar — a small legend on the reverse of the card that defines their symbols without using words, using only other symbols and spatial relationships. After the decode test, they should write a one-paragraph formal reflection comparing their invented visual language to standardised scientific notation systems and evaluating the conditions under which universality is achieved."}, "sahifaPrompt": "Ibn al-Nafis described the movement of blood through the lungs at a time when scholars across many languages had to find ways to share ideas across great distances. Today I tried to communicate __________ without any words, and I discovered that __________. What this taught me about the difference between a private symbol and a shared language is __________."},
  "16":{"title": "Circles That Make a Line", "discipline": "Astronomy", "scholar": "Al-Tusi", "prompt": "[Astronomy] Model the Tusi couple: Using two circles of the right sizes (one twice the radius of the other), show how Al-Tusi proved that linear motion can be produced from two circular motions. Build it with cardboard and a pin. Document what you observe.", "diff": {"k4": "Young students should focus on the wonder of observation: let them spin the inner circle freely and finger-trace where the dot travels, describing the motion in their own words ('it goes back and forth like a swing'). Skip the precise tracing step and instead count how many times the small circle spins for every one trip around the inside of the large circle, turning it into a simple counting game.", "m58": "Students in this band should measure both circles, confirm the 2:1 ratio with a ruler, and make a prediction in writing before rotating — will the point move in a circle, a line, or something else? After tracing, they should measure the length of the resulting line and compare it to the diameter of the large circle, discovering that the line length equals the large circle's diameter.", "h912": "Older students should research the parametric equations for the hypocycloid (x = (R−r)cos θ + r·cos((R−r)θ/r), y = (R−r)sin θ − r·sin((R−r)θ/r)) and verify algebraically that when R = 2r these equations reduce to pure linear motion (x = R·cos θ, y = 0). They should also write a short analysis connecting Al-Tusi's geometric proof to Copernicus's later use of the same device, discussing the transmission of mathematical ideas across cultures."}, "sahifaPrompt": "Al-Tusi built something invisible — a mathematical proof — and then made it visible with moving circles. Today I built his Tusi couple and discovered that the tracing point moved in a path that looked like _______________. What surprised me most was _______________. Like Al-Tusi, I think the reason circular motion can hide inside what looks like straight motion is because _______________."},
  "17":{"title": "Map What You Know", "discipline": "Cartography", "scholar": "Ibn Battuta", "prompt": "[Cartography] Map the knowledge journey: Create a map — not of a place, but of a journey through knowledge. Map this year's learning: what were the territories? What were the borders? What remained unexplored? Ibn Battuta mapped 120,000km of the known world. Map what you know.", "diff": {"k4": "Younger students should work from a short pre-written list of just four or five subjects rather than generating the inventory themselves. Instead of freeform landmasses, they can draw a simple road or river path with named stops (like stations on a train), decorating each stop with a small picture of something they learned. The facilitator can scribe labels and the legend while the student focuses entirely on drawing and coloring.", "m58": "Grade 5-8 students should engage directly with the math context by building a simple coordinate grid on their map and placing each knowledge territory at a deliberate (x, y) position — for example, x-axis representing time across the year, y-axis representing confidence level. They should also apply a written scale (e.g., 1 cm = 2 weeks of study) and practice calculating the 'distance' their route traveled, connecting to Ibn Battuta's 120,000 km as a comparative anchor.", "h912": "High school students should extend the map into a systems-thinking analysis: after drawing, they annotate connection arrows between territories to show how one area of knowledge fed or depended on another, identifying feedback loops and isolated nodes. They should write a one-paragraph cartographer's note on the reverse that reflects formally on epistemology — what does the shape of their map reveal about how they learn, and what assumptions did they make in choosing what counted as a 'territory' versus a 'border'?"}, "sahifaPrompt": "Ibn Battuta once wrote that travel leaves you speechless, then turns you into a storyteller. Looking at my knowledge map, the territory I explored most deeply this year was ___, and I know this because ___. The region that still waits at the edge of my map — the place marked 'unexplored' — is ___, and what I hope to discover there is ___."},
  "18":{"title": "Chasing 108 Degrees", "discipline": "Astronomy", "scholar": "Al-Kashi", "prompt": "[Astronomy] Precision construction: Using compass and straightedge, construct a regular pentagon. Document every step. Measure the resulting angles. Al-Kashi calculated π to 16 decimal places — precision was his discipline. How close did your construction come to the theoretical 108°?", "diff": {"k4": "Young students should skip the compass-stepping method and instead trace a pre-drawn circle, then use a printed pentagon template to cut out and glue into their Sahifa. Focus the activity on measuring the angles with a protractor and counting: are all five angles the same? Use only whole-number measurements and celebrate getting within 5° of 108°.", "m58": "Students work through the full compass-and-straightedge construction as described and complete the angle table and sum calculation. Push them to express their error as a percentage: (measured − 108) ÷ 108 × 100. Ask them to hypothesize which step introduced the most error and how they could redesign the process to reduce it.", "h912": "After completing the construction and error analysis, students research why the regular pentagon cannot be constructed by simple compass-stepping (unlike the hexagon) and write a short explanation of the geometric relationship between the pentagon and the golden ratio φ. Challenge them to derive the exact interior angle of 108° from first principles using the exterior angle theorem, and to express Al-Kashi's iterative approach to π as a parallel to their own iterative precision in this construction."}, "sahifaPrompt": "Al-Kashi believed that precision was not stubbornness — it was respect for truth. When I measured my pentagon's angles, the one that came closest to 108° was __________, and the one that drifted the most was __________. What I learned about my own patience with precision is that __________."},
  "19":{"title": "Map What You Know", "discipline": "Cartography", "scholar": "Ibn Majid", "prompt": "[Cartography] Map an unknown territory: Choose a space you have never mapped — the inside of a drawer, the floor plan of a room from memory, a route you walk without thinking. Map it. Then walk/check it. What did you get wrong? What did your memory emphasize?", "diff": {"k4": "Younger students should choose the simplest territory — a single drawer or one tabletop — and draw with pictures rather than symbols. Skip the formal scale step and instead have them cut a piece of string the length of the real object and lay it against their drawing to see the difference. Focus the reflection on one thing they forgot and one thing they remembered well.", "m58": "Middle students should attempt a full room floor plan and apply a written scale ratio (e.g., 1 cm = 50 cm). Ask them to calculate the actual area of the room from their corrected map using the scale and compare it to the area suggested by the memory map. Connect the exercise to systematic observation by asking them to design a more reliable measurement procedure they could repeat.", "h912": "High school students should map a multi-room route or an outdoor path and work with a consistent representative fraction scale (e.g., 1:100). Ask them to quantify their errors — measuring the percentage difference in at least two distances between the memory and corrected maps — and write a short analysis of whether their errors were random or showed a directional bias. They may also research how Ibn Majid described the limits of dead reckoning in the Kitab al-Fawa'id and connect his epistemic humility to their own findings."}, "sahifaPrompt": "Ibn Majid spent his life charting waters that sailors had crossed for generations but never precisely drawn. Today I mapped _____ from memory before I checked it. The biggest difference between my memory map and the real space was _____. This makes me think that what I pay attention to every day is not the same as _____."},
  "20":{"title": "Redirect the Force", "discipline": "Engineering", "scholar": "Al-Jazari", "prompt": "[Engineering] Build a redirecting machine: Build a device — from any available materials — that redirects force: a lever, a pulley, a ramp, a waterwheel, a crank. The device must visibly change the direction or magnitude of a force. Document the mechanical principle.", "diff": {"k4": "Young students should build a single first-class lever using a ruler balanced on a pencil and explore how moving the fulcrum changes which side feels heavier. The facilitator should name 'push down here, it goes up there' as force redirection without requiring formal calculation. Documentation is a crayon drawing with arrows labeled 'push' and 'lift.'", "m58": "Students should build their chosen machine and measure the effort force versus the load force using a kitchen scale or hanging weights, then calculate mechanical advantage as a ratio. They should record whether their measured advantage matched their prediction and write one sentence explaining the trade-off between force and distance. This directly supports the Grade 7 math context of ratios and the science context of simple machines.", "h912": "Students should build a device and then derive the theoretical mechanical advantage from geometry (lever arm ratio, pulley radius, or ramp angle via trigonometry) before measuring experimentally. They should calculate efficiency as the ratio of theoretical to actual mechanical advantage, attribute losses to friction, and write a short analysis connecting their findings to Al-Jazari's engineering constraints — materials, water pressure, or palace aesthetics — and how those constraints shaped his design choices."}, "sahifaPrompt": "Al-Jazari spent years designing machines that moved water and weight through clever redirection of force. Today I built a ______, which changed force by ______. The most surprising thing I discovered was that when I moved my effort farther from the fulcrum (or axle), the load felt ______, which taught me that every machine involves a trade-off between ______ and ______."},
  "21":{"title": "Archive What Mattered Most", "discipline": "Architecture", "scholar": "Ibn Battuta", "prompt": "[Architecture] Archive this year: Create an archive of your work from this academic year — select, organize, and present it. An archive is not a collection; it is an argument about what mattered. Justify every inclusion. Ibn Battuta's Rihla was an archive of 30 years of travel.", "diff": {"k4": "Young students should limit their archive to five to seven items and draw a simple picture next to each justification card rather than writing full sentences. The facilitator can scribe the student's spoken justifications. The organizing structure should be chosen from two options the facilitator offers — for example, 'things I made' versus 'things I learned' — rather than invented from scratch.", "m58": "Students in this band should engage directly with the Math 7 context by creating a visual categorization map before building the archive — a hand-drawn chart or grid showing categories and how pieces are distributed across them. They should also write one sentence per item connecting it to the Science 7 documentation standard: what evidence does this piece provide, and how reliable is it?", "h912": "High school students should treat the introduction as a formal curatorial statement of at least two paragraphs, explicitly naming the criteria by which items were included or excluded. They should also write a one-page reflection comparing their archival logic to Ibn Battuta's Rihla — considering what Ibn Battuta chose to emphasize, what he left out, and what that reveals about the argument his archive was making about Islamic civilization in the 14th century."}, "sahifaPrompt": "Ibn Battuta spent thirty years traveling and then made choices about what to record in his Rihla — he did not write everything down, only what he believed mattered. After building my own archive, I think the argument my year is making is that I ___. The piece I almost left out but chose to keep was ___, and I am glad I kept it because it shows that ___."},
  "22":{"title": "Shapes That Share Justly", "discipline": "Geometry", "scholar": "Al-Maqrizi", "prompt": "[Geometry] The geometry of justice: Design a system for distributing a resource — water, light, space, food — among people with different needs. The system must be geometrically describable. Draw it. Justify why it is fair. Al-Maqrizi wrote about distribution of resources in 15th century Egypt.", "diff": {"k4": "Younger students should work with a concrete, physical resource they can touch — such as dividing a sheet of paper representing a garden into colored zones for three toy figures. Focus on the idea of 'more need, more space' and let them cut and arrange paper shapes rather than draw precise geometry. The facilitator writes the labels and numbers while the student dictates the reasoning.", "m58": "Students in this band should connect the diagram directly to ratio and proportion: require that every region's size be expressed as a fraction of the whole, and that at least one proportion be verified by calculation. Challenge them to explain what would happen to the geometry if one person's need doubled — would they redraw, or could the system flex?", "h912": "Older students should engage with the formal tension between equity and equality, defining each term precisely before designing. Require them to write a short proof or logical argument — not just an explanation — showing that their allocation satisfies a chosen fairness criterion (proportional allocation, leximin, or need-based priority). They may also research Al-Maqrizi's Ighatha al-Umma and connect one historical observation he made to a feature of their design."}, "sahifaPrompt": "Al-Maqrizi looked at his city and saw that the shape of a society — who lived where, who received what — could be read like a map. Today I designed a system for sharing ________, and I decided it was fair because ________. The hardest part of turning justice into a shape was ________."},
  "23":{"title": "Bridge the Gap Yourself", "discipline": "Engineering", "scholar": "Fatima al-Fihri", "prompt": "[Engineering] Build from no instructions: You will be given materials and a constraint but no instructions: the structure must hold weight AND span a gap. Figure out the rest. Fatima al-Fihri built the world's first university without a precedent to follow.", "diff": {"k4": "Reduce the gap to 10 cm and provide only index cards and tape — fewer variables make the challenge tractable. Skip the sketching phase and instead ask the student to describe their plan aloud before building. Focus praise and documentation on the observation of where the structure felt 'wobbly' versus 'strong.'", "m58": "Hold the gap at 20 cm and require the student to estimate in writing how much weight their design will hold before each test, then compare prediction to result. Introduce the vocabulary of compression and tension and ask them to label which forces are acting where in their sketch. Challenge them to improve their load-held-per-stick ratio across the two attempts.", "h912": "Require the student to produce a labeled engineering diagram with force-direction arrows before building and to calculate the estimated load distribution at the center span using ratios. After both builds, ask them to write a short design rationale explaining their structural choices in terms of triangulation, arch action, or beam theory. Optionally, introduce the concept of factor of safety and have them estimate theirs."}, "sahifaPrompt": "Fatima al-Fihri built something the world had never seen before, starting only with a vision and a commitment. Today I built a bridge that had to span _______ and hold _______. The moment I understood what was failing was when _______, and that changed how I thought about the whole problem."},
  "24":{"title": "Before, Process, After", "discipline": "Natural History", "scholar": "Ibn Khaldun", "prompt": "[Natural History] Restore something: Take something broken, worn, or neglected and restore it — repair an object, revive a plant, clean and document an artefact. Document the before, the process, the after. Ibn Khaldun wrote that civilisations decline and can be restored. What did restoration require?", "diff": {"k4": "Young students should choose a simple, visible subject — a muddy stone, a wilting plant, a dusty shelf object. Focus entirely on observational drawing: one before-sketch and one after-sketch, with the student dictating what they notice to the facilitator. The Ibn Khaldun connection can be told as a story: 'A long time ago, a scholar noticed that great cities can fall apart — and also come back. Today you noticed that too.'", "m58": "Students in this band should complete the full measurement cycle and write their own process log entries. Introduce the concept of rate of change: how much did the subject improve per minute of effort? Ask them to calculate the difference between before and after measurements and express it as a percentage change, connecting to the Grade 7 math context.", "h912": "High school students should research Ibn Khaldun's concept of 'asabiyyah (social cohesion) and write a structured paragraph arguing whether their restoration project is a physical analogy for civilisational renewal — identifying what conditions were necessary, what was irreversible, and what the limits of restoration reveal about decline. They should also consider the science context: how does decomposition interact with restoration, and at what point does restoration become impossible?"}, "sahifaPrompt": "Ibn Khaldun believed that things — and even whole civilisations — can decline and be restored, but only if the right conditions are present. Today I tried to restore __________, and what I found was that restoration required __________. What surprised me most about the process was __________."},
  "25":{"title": "The Object That Teaches", "discipline": "Calligraphy", "scholar": "Ibn al-Haytham", "prompt": "[Calligraphy] Teach through making: Make something — a diagram, a model, a labelled illustration — that teaches one concept from this year to someone who has not studied it. No words of explanation allowed beyond labels. Test it: does the object teach without you present?", "diff": {"k4": "Younger students choose a concrete, countable concept — the water cycle, the parts of a plant, place value — and build a large labelled illustration using simple shapes and no more than five labels. The facilitator scribes the labels as the student dictates the exact words, then the student traces over the lettering in their own hand. The silent test is conducted with a sibling or parent who gives a thumbs-up or thumbs-down for each element.", "m58": "Students at this level are expected to choose a relational concept — fractions as division, the angle of reflection, ratio — and represent it as a true diagram with at least two labelled components that interact. They must include a scale, an axis, or a directional arrow that carries meaning without words. After the silent test, they write a one-paragraph analysis on a separate sheet explaining what the test revealed about gaps in their own mental model.", "h912": "Older students select an abstract concept — a geometric proof, a model of scientific reasoning, a mathematical relationship — and produce a diagram rigorous enough to stand as a reference illustration. They must include a formal notation system (variables, symbols, or a legend) rendered in calligraphic lettering. After the silent test, they write a short comparative note connecting their diagram's purpose to Ibn al-Haytham's methodology in the Kitab al-Manazir, arguing whether a model can ever fully replace verbal explanation."}, "sahifaPrompt": "Ibn al-Haytham believed that a diagram could carry proof without a single spoken word. When I tried to teach _______ using only my diagram, the silent test showed me that _______ was still missing — and that told me something true about how well I actually understood it."},
  "26":{"title": "Proving Shapes With Hands", "discipline": "Geometry", "scholar": "Al-Khwarizmi", "prompt": "[Geometry] Physical proof: Choose a geometric theorem and prove it physically — not on paper, but with objects, string, shadows, or measurement. The Pythagorean theorem can be proved with square tiles. What can you prove with what you have?", "diff": {"k4": "Give younger students a 3-4-5 right triangle already measured and taped to the table, and provide pre-cut square tiles so they focus entirely on counting and comparing areas. Ask them to simply observe and narrate: 'How many tiles fit here? How many fit there? What do you notice?' Recording their finding as a drawing with numbers is sufficient documentation.", "m58": "Students at this level should measure and construct their own right triangle using string and the 3-4-5 ratio, then independently build and count the tile squares on each side. Push them to test at least two different right triangles (e.g., 5-12-13) and to write a sentence explaining why they think the pattern holds beyond the cases they tested.", "h912": "Challenge older students to choose a theorem beyond the Pythagorean — such as the exterior angle theorem or Thales' theorem — and design their own physical proof from scratch using available materials. Require them to write a formal argument distinguishing their empirical evidence from what a deductive proof would require, and to identify any assumptions their physical model cannot eliminate."}, "sahifaPrompt": "Al-Khwarizmi believed that mathematical truth should be demonstrated, not just stated. Today I tried to prove __________ without using paper — I used __________ to show that the theorem held. What surprised me was that empirical verification felt __________ because __________."},
  "27":{"title": "What the Eye Believes", "discipline": "Optics", "scholar": "Al-Farabi", "prompt": "[Optics] Light and truth: Create an optical illusion — a drawing, an arrangement of objects, or a mirror setup — that makes something appear to be what it is not. Document: what does the eye believe? What does the mind know? Al-Farabi distinguished between what the senses report and what reason concludes.", "diff": {"k4": "Focus only on the bending pencil and the mirror multiplication activity — keep the making concrete and sensory. Skip the drawing construction and instead ask the student to use words or a simple sketch to show 'what my eye thought' and 'what was really true.' The Sahifa entry can be dictated aloud and transcribed by the facilitator.", "m58": "Students should complete all three illusion activities and attempt to measure or describe the geometry involved — for instance, measuring the two 'unequal' lines to confirm they are equal, or recording how many reflections appear at 90°, 60°, and 45° mirror angles and looking for a numerical pattern. The documentation should include both a labeled diagram and a written paragraph distinguishing sensation from reason in their own words.", "h912": "After completing the activities, ask the student to research Snell's Law in brief and write a short explanation of why refraction causes the pencil illusion, connecting the geometry of angle of incidence to what the eye perceives. They should also write a one-page reflection engaging seriously with Al-Farabi's epistemology: if the senses can be systematically wrong, what is the proper relationship between empirical observation and rational analysis in scientific inquiry?"}, "sahifaPrompt": "Al-Farabi taught that the senses are like messengers — they bring news from the world, but reason must decide whether that news tells the whole truth. Today I made an illusion that tricked the eye into believing _______________. When I used my mind to check, I discovered _______________. This makes me wonder whether I have ever trusted my senses about something important without stopping to let reason ask questions."},
  "28":{"title": "One Stroke, One Idea", "discipline": "Calligraphy", "scholar": "Al-Idrisi", "prompt": "[Calligraphy] Create a new symbol: Invent a symbol — a single mark — that encodes a complex idea from this year's learning. The symbol must be drawable in one stroke, universally readable by anyone who knows the rule, and memorable. Document the rule. Test it.", "diff": {"k4": "Younger students should choose a concrete idea they can act out physically — such as 'things that grow' or 'big and small together.' Help them trace their finger in a single sweep before touching pen to paper, so the body learns the stroke before the hand commits. The rule card can be dictated to the facilitator and written collaboratively.", "m58": "Students at this level should anchor their symbol in a specific concept from math or science — for example, the relationship between a base and its exponent in scientific notation, or the meaning of a variable in an equation. Challenge them to explain why the stroke's shape is *not arbitrary* but structurally mirrors the idea it encodes.", "h912": "High school students should treat this as a semiotic design problem: after testing, they must write a one-paragraph analysis comparing their invented symbol to an existing mathematical or scientific symbol (such as the integral sign or a chemical notation) and argue whether their symbol meets the same standards of universality and economy. A second round of revision based on that analysis is expected."}, "sahifaPrompt": "Al-Idrisi made marks that carried whole landscapes inside them. My symbol encodes the idea of __________, and the rule that unlocks it is __________. When I tested it, I discovered that __________."},
  "29":{"title": "Return, Finish, Account For", "discipline": "Architecture", "scholar": "Al-Biruni", "prompt": "[Architecture] Complete an unfinished project: Return to a project from earlier this year that you abandoned or left incomplete. Finish it — or document honestly why it cannot be finished and what would be required. Al-Biruni spent 40 years on some of his calculations.", "diff": {"k4": "Younger students should choose a project that exists as a physical object they can hold and touch. Guide them to add one new element to the original rather than finishing it completely, and let them narrate their completion document to you as you write it down. The focus is on the feeling of returning, not on technical resolution.", "m58": "Students in this band should write the honest diagnosis themselves and produce either a genuinely completed artifact or a structured completion document with labeled drawings, a materials list, and a time estimate. Encourage them to connect the experience to Al-Biruni's iterative calculation process: what changed in their understanding between the first attempt and today?", "h912": "Older students should treat this session as a formal design critique of their own earlier work. They should produce a written analysis identifying the conceptual, material, and methodological reasons the project stalled, alongside a completion specification rigorous enough that someone else could theoretically execute it. Ask them to consider how Al-Biruni's willingness to revise over decades reflects an epistemological stance — what does it mean to treat a problem as never fully closed?"}, "sahifaPrompt": "Al-Biruni returned to his hardest problems again and again across a lifetime, because he believed careful work takes the time it actually takes. When I came back to my unfinished project today, the first thing I noticed was ___. I realized the work had stopped because ___, and what I understand now that I did not understand before is ___."},
  "30":{"title": "Your Year as Orbit", "discipline": "Astronomy", "scholar": "Al-Battani", "prompt": "[Astronomy] The year as a circle: Create a visual representation of this entire academic year as a single circle — the weeks, the scholars, the themes, the connections you see now that you did not see in September. The circle is Al-Battani's instrument. Make it yours.", "diff": {"k4": "Younger students should work with a pre-divided circle prepared by the facilitator, with only 10–12 sections representing major units or memorable scholars rather than all 30 weeks. Instead of writing, they draw one small picture per section and use stickers or stamps to mark their favorites. The connecting lines can be replaced by a single piece of colored yarn taped across the circle to show their biggest discovery of the year.", "m58": "Students at this level work with all 30 weeks and are challenged to color-code by discipline, then calculate what percentage of the circle each discipline occupies — connecting the visual to actual data. They should draw at least five cross-circle connections and label each with a one-phrase explanation of the link they see, practicing the skill of evidence-based synthesis.", "h912": "Older students extend the activity into formal analysis: after constructing the circle, they write a one-page annotation identifying at least three systems or cycles visible in the year's arc (e.g., how scientific method recurred across disciplines) and evaluate whether their year's curriculum was balanced or weighted. They may also research Al-Battani's actual zij format and deliberately echo one structural feature of his instrument in their own design, citing the connection in their Sahifa entry."}, "sahifaPrompt": "Al-Battani spent years watching the sky in careful circles so that one image could hold an entire year of truth. When I look at my own circle today, the connection I never expected to find is _______________. If I could go back to Week 1 and whisper one thing to myself, it would be _______________."},
